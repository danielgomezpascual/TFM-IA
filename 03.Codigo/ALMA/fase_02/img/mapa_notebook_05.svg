</defs><rect width="1400" height="670" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">EL RECORRIDO DEL NOTEBOOK 05</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">de los conjuntos de 04 a las medidas para la Fase 3</text><rect x="40" y="110" width="250" height="200" rx="0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/><rect x="40" y="110" width="250" height="40" fill="#141414"/><rect x="40" y="150" width="250" height="4" fill="#9b1b1e"/><text x="54" y="137" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold">ENTRA</text><text x="56" y="180" font-size="15" text-anchor="start" fill="#141414">· conjuntos/general.csv (04)</text><text x="56" y="206" font-size="15" text-anchor="start" fill="#141414">· senales.csv (02)</text><text x="56" y="232" font-size="15" text-anchor="start" fill="#141414">· edfs.csv (Fase 1)</text><text x="56" y="258" font-size="15" text-anchor="start" fill="#141414">· configuración de 03 y 04</text><text x="56" y="284" font-size="15" text-anchor="start" fill="#141414">· tramos.csv (01)</text><rect x="340" y="110" width="232" height="130" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="340" y="110" width="70" height="34" fill="#141414"/><text x="375.0" y="132.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§3</text><text x="420" y="134" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Las 7 pistas</text><text x="356" y="178" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">de cada ventana, con tablas</text><text x="356" y="200" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">(sin leer la señal)</text><rect x="596" y="110" width="232" height="130" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="596" y="110" width="70" height="34" fill="#141414"/><text x="631.0" y="132.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§3b</text><text x="676" y="134" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Comprobaciones</text><text x="612" y="178" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">¿están aplicadas las</text><text x="612" y="200" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">correcciones de 03 y 04?</text><rect x="852" y="110" width="232" height="130" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="852" y="110" width="70" height="34" fill="#141414"/><text x="887.0" y="132.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§4–8</text><text x="932" y="134" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Hipótesis H1–H5</text><text x="868" y="178" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">qué buscamos, por qué y</text><text x="868" y="200" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">qué esperamos, una a una</text><rect x="1108" y="110" width="232" height="130" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="1108" y="110" width="70" height="34" fill="#141414"/><text x="1143.0" y="132.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§9</text><text x="1188" y="134" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Semáforo</text><text x="1124" y="178" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">cuánto separa cada pista,</text><text x="1124" y="200" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">dentro del paciente</text><rect x="1108" y="380" width="232" height="130" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="1108" y="380" width="70" height="34" fill="#141414"/><text x="1143.0" y="402.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§10</text><text x="1188" y="404" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Techo del atajo</text><text x="1124" y="448" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">lo que se acierta</text><text x="1124" y="470" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">sin ver la señal</text><rect x="852" y="380" width="232" height="130" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><rect x="852" y="380" width="70" height="34" fill="#9b1b1e"/><text x="887.0" y="402.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§11</text><text x="932" y="404" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Control 1</text><text x="868" y="448" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">emparejado por</text><text x="868" y="470" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">posición</text><rect x="596" y="380" width="232" height="130" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><rect x="596" y="380" width="70" height="34" fill="#9b1b1e"/><text x="631.0" y="402.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§12</text><text x="676" y="404" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Control 2</text><text x="612" y="448" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">💤 de la misma</text><text x="612" y="470" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">sesión</text><rect x="340" y="380" width="232" height="130" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><rect x="340" y="380" width="70" height="34" fill="#9b1b1e"/><text x="375.0" y="402.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">§13–15</text><text x="420" y="404" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Medidas</text><text x="356" y="448" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">y conclusiones, decididas</text><text x="356" y="470" font-size="15.5" text-anchor="start" fill="#444" font-style="italic">por los datos</text><path d="M290,210 L336,175" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#fN)"/><path d="M574,175.0 L592,175.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M830,175.0 L848,175.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M1086,175.0 L1104,175.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M1224.0,242 L1224.0,376" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M1106,445.0 L1088,445.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M850,445.0 L832,445.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M594,445.0 L576,445.0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><rect x="40" y="380" width="250" height="200" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><rect x="40" y="380" width="250" height="40" fill="#9b1b1e"/><rect x="40" y="420" width="250" height="4" fill="#9b1b1e"/><text x="54" y="407" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold">SALE</text><text x="56" y="450" font-size="15" text-anchor="start" fill="#141414">· semáforo de las pistas</text><text x="56" y="476" font-size="15" text-anchor="start" fill="#141414">· techo del atajo</text><text x="56" y="502" font-size="15" text-anchor="start" fill="#141414">· 2 conjuntos de control</text><text x="56" y="528" font-size="15" text-anchor="start" fill="#141414">· medidas para la Fase 3</text><text x="56" y="554" font-size="15" text-anchor="start" fill="#141414">· summary.txt + figuras</text><path d="M336,445 L294,480" fill="none" stroke="#9b1b1e" stroke-width="2.5" marker-end="url(#fR)"/><text x="40" y="640" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Leyenda:</text><rect x="120" y="626" width="22" height="18" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="150" y="640" font-size="15" text-anchor="start" fill="#141414">medir</text><rect x="220" y="626" width="22" height="18" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="250" y="640" font-size="15" text-anchor="start" fill="#141414">remediar y concluir (lo que se lleva la Fase 3)</text><text x="1360" y="640" font-size="15" text-anchor="end" fill="#8a8a8a" font-style="italic">nada de 04 se modifica: el 05 solo audita</text></svg>