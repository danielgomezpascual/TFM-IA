</defs><rect width="1400" height="560" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">EL TEST COMÚN ENTRE UMBRALES</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">para comparar umbrales en igualdad, todos se evalúan también con las mismas crisis y el mismo minuto</text><rect x="1220" y="120" width="60" height="280" rx="0" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="1250.0" y="266.5" font-size="18" text-anchor="middle" fill="#ffffff">⚡</text><text x="60" y="161" font-size="16" text-anchor="start" fill="#141414">umbral 2 min</text><rect x="1097.3" y="135" width="61.3" height="38" rx="0" fill="#ffffff" stroke="#9b1b1e" stroke-width="1.5"/><rect x="1158.7" y="135" width="61.3" height="38" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="1189.3" y="158.3" font-size="12" text-anchor="middle" fill="#8a8a8a">SPH</text><text x="60" y="223" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="bold">umbral 4 min (TFM)</text><rect x="974.7" y="197" width="184.0" height="38" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><rect x="1158.7" y="197" width="61.3" height="38" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="1189.3" y="220.3" font-size="12" text-anchor="middle" fill="#8a8a8a">SPH</text><text x="60" y="285" font-size="16" text-anchor="start" fill="#141414">umbral 10 min</text><rect x="606.7" y="259" width="552.0" height="38" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><rect x="1158.7" y="259" width="61.3" height="38" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="1189.3" y="282.3" font-size="12" text-anchor="middle" fill="#8a8a8a">SPH</text><text x="60" y="347" font-size="16" text-anchor="start" fill="#141414">umbral 15 min</text><rect x="300.0" y="321" width="858.7" height="38" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><rect x="1158.7" y="321" width="61.3" height="38" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="1189.3" y="344.3" font-size="12" text-anchor="middle" fill="#8a8a8a">SPH</text><rect x="1097.3" y="120" width="61.3" height="280" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="2" opacity="0.25"/><rect x="1097.3" y="120" width="61.3" height="280" rx="0" fill="none" stroke="#9b1b1e" stroke-width="3"/><text x="1128.0" y="422" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="bold">minuto común</text><text x="1128.0" y="442" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">(de 2 a 1 min antes)</text><text x="300.0" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">−15</text><text x="606.7" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">−10</text><text x="974.7" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">−4</text><text x="1097.3" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">−2</text><text x="1158.7" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">−1</text><text x="1220.0" y="470" font-size="14" text-anchor="middle" fill="#8a8a8a">0</text><text x="760.0" y="494" font-size="14.5" text-anchor="middle" fill="#8a8a8a" font-style="italic">minutos antes de la crisis</text><rect x="40" y="506" width="1320" height="40" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="62" y="538" font-size="15" text-anchor="start" fill="#141414">Solo 🟢 eval, crisis con ≥ 2 min de lead-in útil (test_comun = True). Si no, un umbral podría ganar solo porque su test es más fácil.</text></svg>