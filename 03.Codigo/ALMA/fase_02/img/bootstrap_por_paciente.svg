<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="725" viewBox="0 0 1400 725" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="725" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">INTERVALO DE CONFIANZA CON BOOTSTRAP POR PACIENTE</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">el "[0,58 – 0,66]" que acompaña a cada AUROC (auroc_con_intervalo, metricas.py)</text><rect x="40" y="100" width="1320" height="112" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="58" y="128" font-size="16.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">Qué es el bootstrap</text><text x="58" y="154.0" font-size="14.5" text-anchor="start" fill="#141414">Una AUROC calculada una sola vez es un número sin margen: no dice si con otros pacientes saldría 0,60 o 0,75. El bootstrap lo estima con los propios</text><text x="58" y="174.59" font-size="14.5" text-anchor="start" fill="#141414">datos: se hace una muestra nueva sorteando CON REEMPLAZO (un elemento puede salir dos veces y otro ninguna), se recalcula la AUROC, y se repite</text><text x="58" y="195.18" font-size="14.5" text-anchor="start" fill="#141414">muchas veces. Cuánto varía la AUROC entre repeticiones es cuánto nos podemos fiar de ella. "Por paciente": lo que se sortea son pacientes enteros.</text><rect x="40" y="230" width="420" height="360" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="230" width="420" height="40" fill="#141414"/><rect x="40" y="270" width="420" height="4" fill="#9b1b1e"/><text x="54" y="257" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">1 · Los pacientes de la partición</text><text x="95" y="295" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold">A</text><rect x="75" y="310" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="75" y="340" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="75" y="370" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="75" y="400" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="75" y="430" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="75" y="460" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="75" y="490" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="75" y="520" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><text x="171" y="295" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold">B</text><rect x="151" y="310" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="151" y="340" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="151" y="370" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="151" y="400" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="151" y="430" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="151" y="460" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="151" y="490" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="151" y="520" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><text x="247" y="295" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold">C</text><rect x="227" y="310" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="227" y="340" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="227" y="370" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="227" y="400" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="227" y="430" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="227" y="460" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="227" y="490" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="227" y="520" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><text x="323" y="295" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold">D</text><rect x="303" y="310" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="303" y="340" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="303" y="370" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="303" y="400" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="303" y="430" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="303" y="460" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="303" y="490" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="303" y="520" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><text x="399" y="295" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold">E</text><rect x="379" y="310" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="379" y="340" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="379" y="370" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="379" y="400" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="379" y="430" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="379" y="460" width="40" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="0.8"/><rect x="379" y="490" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><rect x="379" y="520" width="40" height="22" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="0.8"/><text x="250" y="570" font-size="14.5" text-anchor="middle" fill="#444" font-style="italic">cada columna: un paciente con todas sus ventanas</text><rect x="500" y="230" width="420" height="360" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="500" y="230" width="420" height="40" fill="#141414"/><rect x="500" y="270" width="420" height="4" fill="#9b1b1e"/><text x="514" y="257" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">2 · Se sortean 5 pacientes, con reemplazo</text><text x="520" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">sorteo 1:</text><text x="640" y="310" font-size="18" text-anchor="start" fill="#141414" font-family="monospace">A A C D E</text><text x="900" y="310" font-size="16" text-anchor="end" fill="#9b1b1e">AUROC 0,61</text><text x="640" y="332" font-size="13" text-anchor="start" fill="#8a8a8a" font-style="italic">A sale 2 veces, B ninguna</text><text x="520" y="382" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">sorteo 2:</text><text x="640" y="382" font-size="18" text-anchor="start" fill="#141414" font-family="monospace">B C C D D</text><text x="900" y="382" font-size="16" text-anchor="end" fill="#9b1b1e">AUROC 0,57</text><text x="640" y="404" font-size="13" text-anchor="start" fill="#8a8a8a" font-style="italic">C y D, 2 veces</text><text x="520" y="454" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">sorteo 3:</text><text x="640" y="454" font-size="18" text-anchor="start" fill="#141414" font-family="monospace">A B D E E</text><text x="900" y="454" font-size="16" text-anchor="end" fill="#9b1b1e">AUROC 0,64</text><text x="640" y="476" font-size="13" text-anchor="start" fill="#8a8a8a" font-style="italic">E, 2 veces; C, ninguna</text><text x="520" y="530" font-size="16" text-anchor="start" fill="#8a8a8a" font-style="italic">… y así 500 veces (N_BOOTSTRAP)</text><text x="710" y="570" font-size="14.5" text-anchor="middle" fill="#9b1b1e" font-style="italic">nunca se sortean ventanas sueltas</text><rect x="960" y="230" width="400" height="360" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="960" y="230" width="400" height="40" fill="#141414"/><rect x="960" y="270" width="400" height="4" fill="#9b1b1e"/><text x="974" y="257" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">3 · Intervalo del 95 %</text><rect x="990" y="518.2407407407408" width="18" height="1.7592592592592593" fill="#cfcfcf"/><rect x="1011" y="520.0" width="18" height="0.0" fill="#cfcfcf"/><rect x="1032" y="518.2407407407408" width="18" height="1.7592592592592593" fill="#cfcfcf"/><rect x="1053" y="497.1296296296296" width="18" height="22.87037037037037" fill="#cfcfcf"/><rect x="1074" y="477.77777777777777" width="18" height="42.22222222222222" fill="#9b1b1e"/><rect x="1095" y="447.8703703703704" width="18" height="72.12962962962963" fill="#9b1b1e"/><rect x="1116" y="386.2962962962963" width="18" height="133.7037037037037" fill="#9b1b1e"/><rect x="1137" y="330.0" width="18" height="190.0" fill="#9b1b1e"/><rect x="1158" y="366.94444444444446" width="18" height="153.05555555555554" fill="#9b1b1e"/><rect x="1179" y="382.77777777777777" width="18" height="137.22222222222223" fill="#9b1b1e"/><rect x="1200" y="444.35185185185185" width="18" height="75.64814814814815" fill="#9b1b1e"/><rect x="1221" y="481.2962962962963" width="18" height="38.7037037037037" fill="#9b1b1e"/><rect x="1242" y="509.44444444444446" width="18" height="10.555555555555555" fill="#cfcfcf"/><rect x="1263" y="520.0" width="18" height="0.0" fill="#cfcfcf"/><rect x="1284" y="520.0" width="18" height="0.0" fill="#cfcfcf"/><rect x="1305" y="520.0" width="18" height="0.0" fill="#cfcfcf"/><line x1="985" y1="520" x2="1335" y2="520" stroke="#141414"/><text x="1160" y="542" font-size="13" text-anchor="middle" fill="#8a8a8a" font-style="italic">las 500 AUROC, de menor a mayor →</text><text x="1160" y="570" font-size="14.5" text-anchor="middle" fill="#9b1b1e" font-weight="bold">el 95 % central (en rojo) es el intervalo</text><path d="M462,410 L496,410" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M922,410 L956,410" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><rect x="40" y="615" width="1320" height="82" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="60" y="645.0" font-size="15" text-anchor="start" fill="#141414">Por qué por paciente y no por ventana: las ventanas de un mismo paciente se parecen mucho entre sí; 40.000 ventanas de 30 pacientes son, en la</text><text x="60" y="666.3" font-size="15" text-anchor="start" fill="#141414">práctica, más bien 30 datos. Sorteando ventanas el intervalo saldría estrechísimo y engañoso; sorteando pacientes dice cuánto cambiaría con otros pacientes.</text></svg>