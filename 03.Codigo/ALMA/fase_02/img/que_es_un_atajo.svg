<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="flechaNegra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e4e4e4" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Título -->
  <text x="700" y="52" text-anchor="middle" font-size="34" letter-spacing="2" fill="#141414">QUÉ ES UN ATAJO</text>
  <text x="700" y="84" text-anchor="middle" font-size="18" font-style="italic" fill="#8a8a8a">Una red aprende lo más fácil que separe las clases, sea o no lo que buscamos (shortcut learning)</text>

  <!-- ── Ventana de EEG ───────────────────────────────────────────── -->
  <rect x="40" y="120" width="380" height="300" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <rect x="40" y="120" width="380" height="44" fill="#141414"/>
  <rect x="40" y="164" width="380" height="5" fill="#9b1b1e"/>
  <text x="58" y="149" font-size="21" font-weight="bold" fill="#ffffff">Ventana de EEG</text>
  <text x="402" y="149" text-anchor="end" font-size="15" fill="#d9a0a2" font-family="monospace">4 s · 256 Hz</text>
  <!-- trazas -->
  <g fill="none" stroke="#141414" stroke-width="1.6" transform="translate(0,-10)">
    <path d="M70,200 C90,186 105,214 125,200 S160,188 180,200 S215,214 235,200 S270,186 290,200 S325,212 345,200 S375,190 395,200"/>
    <path d="M70,240 C85,232 95,250 110,240 S135,228 150,240 S175,254 190,240 S215,230 230,240 S260,250 280,240 S320,232 340,240 S375,248 395,240"/>
    <path d="M70,280 C92,264 102,296 124,280 S154,266 172,280 S206,298 226,280 S258,264 280,280 S318,294 336,280 S372,268 395,280"/>
    <path d="M70,320 C80,314 90,326 100,320 S120,312 130,320 S150,328 160,320 S180,312 190,320 S215,330 230,320 S260,312 280,320 S320,328 340,320 S375,314 395,320"/>
    <path d="M70,360 C95,348 110,372 135,360 S175,350 195,360 S235,372 255,360 S290,348 315,360 S360,370 395,360"/>
  </g>
  <text x="230" y="392" text-anchor="middle" font-size="15.5" fill="#141414">22 canales TCP × 1.024 muestras</text>
  <text x="230" y="411" text-anchor="middle" font-size="15.5" font-style="italic" fill="#9b1b1e">lo único que entra a la red</text>

  <!-- ── Pistas que viajan con la ventana ─────────────────────────── -->
  <rect x="40" y="460" width="380" height="200" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="490" font-size="17" font-weight="bold" fill="#141414">Pistas que "viajan" con ella</text>
  <text x="58" y="510" font-size="14" font-style="italic" fill="#8a8a8a">no son EEG preictal, pero pueden dejar huella en la señal</text>
  <g font-size="15" fill="#141414">
    <rect x="58" y="526" width="160" height="30" rx="15" fill="#ffffff" stroke="#141414"/><text x="138" y="546" text-anchor="middle">canales a 0</text>
    <rect x="228" y="526" width="176" height="30" rx="15" fill="#ffffff" stroke="#141414"/><text x="316" y="546" text-anchor="middle">equipo (montaje, Hz)</text>
    <rect x="58" y="566" width="196" height="30" rx="15" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.6"/><text x="156" y="586" text-anchor="middle" fill="#9b1b1e" font-weight="bold">minuto del fichero</text>
    <rect x="264" y="566" width="140" height="30" rx="15" fill="#ffffff" stroke="#141414"/><text x="334" y="586" text-anchor="middle">nivel de señal</text>
    <rect x="58" y="606" width="346" height="30" rx="15" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.6"/><text x="231" y="626" text-anchor="middle" fill="#9b1b1e" font-weight="bold">tipo de fichero: con crisis / sin crisis</text>
  </g>
  <text x="230" y="652" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9b1b1e">en rojo, las dos que más separan en TUSZ</text>

  <!-- ── Salida del modelo ────────────────────────────────────────── -->
  <rect x="980" y="230" width="380" height="250" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/>
  <rect x="980" y="230" width="380" height="44" fill="#141414"/>
  <rect x="980" y="274" width="380" height="5" fill="#9b1b1e"/>
  <text x="998" y="259" font-size="21" font-weight="bold" fill="#ffffff">Salida del modelo</text>
  <text x="1170" y="330" text-anchor="middle" font-size="24" fill="#141414">¿Se acerca una crisis?</text>
  <g font-size="18">
    <circle cx="1040" cy="380" r="9" fill="#9b1b1e"/><text x="1058" y="386" fill="#141414">preictal · <tspan font-style="italic">sí, en 1-4 min</tspan></text>
    <circle cx="1040" cy="420" r="9" fill="#8a8a8a"/><text x="1058" y="426" fill="#141414">interictal · <tspan font-style="italic">no</tspan></text>
  </g>

  <!-- ── Camino que queremos (negro) ─────────────────────────────── -->
  <path d="M420,260 C600,230 800,230 976,300" fill="none" stroke="#141414" stroke-width="3" marker-end="url(#flechaNegra)"/>
  <rect x="525" y="168" width="350" height="34" fill="#ffffff"/>
  <text x="700" y="192" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="1" fill="#141414">CAMINO QUE QUEREMOS</text>
  <text x="700" y="282" text-anchor="middle" font-size="16" fill="#141414">cambios del EEG antes de la crisis</text>
  <text x="700" y="303" text-anchor="middle" font-size="16" font-style="italic" fill="#8a8a8a">ritmos, sincronía entre canales…</text>

  <!-- ── Atajo (rojo discontinuo) ─────────────────────────────────── -->
  <path d="M420,580 C640,600 840,560 990,486" fill="none" stroke="#9b1b1e" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#flechaRoja)"/>
  <text x="700" y="535" text-anchor="middle" font-size="20" font-weight="bold" letter-spacing="1" fill="#9b1b1e">ATAJO</text>
  <text x="700" y="625" text-anchor="middle" font-size="16" fill="#9b1b1e">acierta por la pista, no por el EEG preictal</text>
  <text x="700" y="646" text-anchor="middle" font-size="16" font-style="italic" fill="#9b1b1e">buena nota en eval que no se sostiene con otros pacientes ni en la demo</text>

  <!-- ── Cómo lo vigila el 05 ─────────────────────────────────────── -->
  <line x1="40" y1="690" x2="1360" y2="690" stroke="#9b1b1e" stroke-width="1.5"/>
  <text x="40" y="716" font-size="17" letter-spacing="1" fill="#9b1b1e">CÓMO LO VIGILA EL NOTEBOOK 05</text>
  <g font-size="16" fill="#141414">
    <rect x="40" y="728" width="400" height="70" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <rect x="40" y="728" width="44" height="70" fill="#141414"/><text x="62" y="771" text-anchor="middle" font-size="24" fill="#ffffff">1</text>
    <text x="98" y="757" font-weight="bold">Medir cada pista</text>
    <text x="98" y="780" font-style="italic" fill="#555">semáforo 🟢🟡🔴 dentro del paciente (§9)</text>

    <rect x="500" y="728" width="400" height="70" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <rect x="500" y="728" width="44" height="70" fill="#141414"/><text x="522" y="771" text-anchor="middle" font-size="24" fill="#ffffff">2</text>
    <text x="558" y="757" font-weight="bold">Techo del atajo</text>
    <text x="558" y="780" font-style="italic" fill="#555">lo que se acierta sin ver la señal (§10)</text>

    <rect x="960" y="728" width="400" height="70" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.8"/>
    <rect x="960" y="728" width="44" height="70" fill="#9b1b1e"/><text x="982" y="771" text-anchor="middle" font-size="24" fill="#ffffff">3</text>
    <text x="1018" y="757" font-weight="bold">Controles para la Fase 3</text>
    <text x="1018" y="780" font-style="italic" fill="#555">posición y misma sesión (§11-12)</text>
  </g>
  <line x1="444" y1="763" x2="494" y2="763" stroke="#8a8a8a" stroke-width="2" marker-end="url(#flechaGris)"/>
  <line x1="904" y1="763" x2="954" y2="763" stroke="#8a8a8a" stroke-width="2" marker-end="url(#flechaGris)"/>
</svg>
