<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="610" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">LAS TRES TRAMPAS QUE COMPRUEBA LA SECCIÓN 3b</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">encontradas en la revisión del 05; las dos primeras se corrigen en 03 y 04, la tercera aquí</text><rect x="40" y="110" width="430" height="470" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="110" width="430" height="40" fill="#141414"/><rect x="40" y="150" width="430" height="4" fill="#9b1b1e"/><text x="54" y="137" font-size="19" text-anchor="start" fill="#ffffff" font-weight="bold">1 · Arranque del filtro</text><text x="58" y="175" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">principio de un fichero EDF (segundos)</text><rect x="60" y="190" width="120" height="150" fill="url(#rayado)" stroke="#9b1b1e" stroke-dasharray="5 4"/><text x="120" y="210" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="bold">filtro</text><text x="120" y="228" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="bold">arrancando</text><path d="M60,300 C80,230 100,360 120,280 S160,320 180,300 S240,290 270,300 S340,310 370,300 S420,295 450,300" fill="none" stroke="#141414" stroke-width="2"/><rect x="60" y="360" width="92" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="106.0" y="379.0" font-size="12" text-anchor="middle" fill="#141414">💤 0-4 s</text><rect x="160" y="360" width="92" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="206.0" y="379.0" font-size="12" text-anchor="middle" fill="#141414">💤 4-8 s</text><rect x="260" y="360" width="92" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="306.0" y="379.0" font-size="12" text-anchor="middle" fill="#141414">💤 8-12 s</text><rect x="360" y="360" width="92" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="406.0" y="379.0" font-size="12" text-anchor="middle" fill="#141414">💤 12-16 s</text><text x="60" y="418" font-size="14.5" text-anchor="start" fill="#141414">los ficheros sin crisis se cortan desde el segundo 0:</text><text x="60" y="438" font-size="14.5" text-anchor="start" fill="#141414">su 1.ª ventana 💤 lleva el arranque; casi ninguna ⏳ cae ahí</text><rect x="58" y="470" width="394" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="70" y="498" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">→ una pista que la red VE y solo tiene 💤</text><text x="70" y="524" font-size="15" text-anchor="start" fill="#141414">Corrección (03): descartar los primeros 10 s</text><text x="70" y="546" font-size="15" text-anchor="start" fill="#141414">de cada fichero, en todas las clases</text><rect x="485" y="110" width="430" height="470" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="485" y="110" width="430" height="40" fill="#141414"/><rect x="485" y="150" width="430" height="4" fill="#9b1b1e"/><text x="499" y="137" font-size="19" text-anchor="start" fill="#ffffff" font-weight="bold">2 · Equilibrado exacto</text><text x="635" y="175" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="bold">antes</text><text x="815" y="175" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="bold">ahora (04)</text><text x="503" y="226" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Paciente A</text><rect x="595" y="208" width="40.5" height="16" fill="#9b1b1e"/><rect x="595" y="228" width="40.5" height="16" fill="#bdbdbd"/><text x="641.5" y="221" font-size="13" text-anchor="start" fill="#141414">90 ⏳</text><text x="641.5" y="241" font-size="13" text-anchor="start" fill="#141414">90 💤</text><rect x="775" y="208" width="40.5" height="16" fill="#9b1b1e"/><rect x="775" y="228" width="40.5" height="16" fill="#bdbdbd"/><text x="821.5" y="221" font-size="13" text-anchor="start" fill="#141414">90 ⏳</text><text x="821.5" y="241" font-size="13" text-anchor="start" fill="#141414">90 💤</text><text x="503" y="301" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Paciente B</text><rect x="595" y="283" width="40.5" height="16" fill="#9b1b1e"/><rect x="595" y="303" width="18.0" height="16" fill="#bdbdbd"/><text x="641.5" y="296" font-size="13" text-anchor="start" fill="#141414">90 ⏳</text><text x="619.0" y="316" font-size="13" text-anchor="start" fill="#141414">40 💤</text><rect x="775" y="283" width="18.0" height="16" fill="#9b1b1e"/><rect x="775" y="303" width="18.0" height="16" fill="#bdbdbd"/><text x="799.0" y="296" font-size="13" text-anchor="start" fill="#141414">40 ⏳</text><text x="799.0" y="316" font-size="13" text-anchor="start" fill="#141414">40 💤</text><text x="503" y="376" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Paciente C</text><rect x="595" y="358" width="40.5" height="16" fill="#9b1b1e"/><rect x="595" y="378" width="1" height="16" fill="#bdbdbd"/><text x="641.5" y="371" font-size="13" text-anchor="start" fill="#141414">90 ⏳</text><text x="602" y="391" font-size="13" text-anchor="start" fill="#141414">0 💤</text><text x="775" y="384" font-size="14" text-anchor="start" fill="#9b1b1e" font-style="italic">fuera del entrenamiento</text><text x="505" y="438" font-size="14.5" text-anchor="start" fill="#141414">si un paciente aporta más ⏳ que 💤, sus rasgos</text><text x="505" y="458" font-size="14.5" text-anchor="start" fill="#141414">fijos (equipo, canales a 0) "tiran" hacia ⏳</text><rect x="503" y="470" width="394" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="515" y="498" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">→ cada paciente, exactamente mitad y mitad</text><text x="515" y="524" font-size="15" text-anchor="start" fill="#141414">Corrección (04): EQUILIBRADO_EXACTO = True</text><text x="515" y="546" font-size="15" text-anchor="start" fill="#141414">se sortean también sus ⏳ si faltan 💤</text><rect x="930" y="110" width="430" height="470" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="930" y="110" width="430" height="40" fill="#141414"/><rect x="930" y="150" width="430" height="4" fill="#9b1b1e"/><text x="944" y="137" font-size="19" text-anchor="start" fill="#ffffff" font-weight="bold">3 · Rejilla de corte</text><text x="948" y="175" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">segundo del fichero en el que empieza cada ventana</text><rect x="950" y="195" width="90" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="995.0" y="214.0" font-size="12" text-anchor="middle" fill="#141414">💤 0,0 s</text><rect x="1048" y="195" width="90" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="1093.0" y="214.0" font-size="12" text-anchor="middle" fill="#141414">💤 4,0 s</text><rect x="1146" y="195" width="90" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="1191.0" y="214.0" font-size="12" text-anchor="middle" fill="#141414">💤 8,0 s</text><rect x="1244" y="195" width="90" height="30" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="1289.0" y="214.0" font-size="12" text-anchor="middle" fill="#141414">💤 12,0 s</text><text x="950" y="248" font-size="14.5" text-anchor="start" fill="#141414">💤: desde el inicio del tramo → múltiplos de 4</text><rect x="950" y="275" width="90" height="30" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="995.0" y="294.0" font-size="12" text-anchor="middle" fill="#ffffff">⏳ 101,6 s</text><rect x="1048" y="275" width="90" height="30" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="1093.0" y="294.0" font-size="12" text-anchor="middle" fill="#ffffff">⏳ 103,6 s</text><rect x="1146" y="275" width="90" height="30" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="1191.0" y="294.0" font-size="12" text-anchor="middle" fill="#ffffff">⏳ 105,6 s</text><rect x="1244" y="275" width="90" height="30" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="1289.0" y="294.0" font-size="12" text-anchor="middle" fill="#ffffff">⏳ 107,6 s</text><text x="950" y="328" font-size="14.5" text-anchor="start" fill="#141414">⏳: hacia atrás desde la crisis → con decimales</text><text x="950" y="368" font-size="14.5" text-anchor="start" fill="#141414">un modelo de metadatos acertaba casi siempre</text><text x="950" y="388" font-size="14.5" text-anchor="start" fill="#141414" font-weight="bold">solo con "¿el segundo es múltiplo de 4?"</text><text x="950" y="418" font-size="14.5" text-anchor="start" fill="#141414">la red no puede ver eso en el EEG: es una fuga</text><text x="950" y="438" font-size="14.5" text-anchor="start" fill="#141414">de los metadatos, no de la señal</text><rect x="948" y="470" width="394" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="960" y="498" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">→ la posición se mide de 30 en 30 s</text><text x="960" y="524" font-size="15" text-anchor="start" fill="#141414">Corrección (atajos.py): RESOLUCION_POSICION_S</text><text x="960" y="546" font-size="15" text-anchor="start" fill="#141414">= 30; así solo queda "en qué parte del fichero"</text></svg>