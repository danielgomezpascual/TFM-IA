<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="750" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">EL TECHO DEL ATAJO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">cuánto se acierta sin ver la señal, y por qué no es una nota a superar</text><rect x="40" y="100" width="1320" height="86" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="58" y="128" font-size="16.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">Qué es el techo del atajo</text><text x="58" y="154.0" font-size="14.5" text-anchor="start" fill="#141414">Se entrenan modelos sencillos que NO ven el EEG, solo las pistas, y se mide cuánto aciertan (AUROC). Lo que acierten sin señal es lo máximo</text><text x="58" y="174.59" font-size="14.5" text-anchor="start" fill="#141414">que esas pistas podrían "regalarle" a la red. Se hace en tres escalones, añadiendo pistas cada vez.</text><rect x="40" y="205" width="700" height="460" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="205" width="700" height="40" fill="#141414"/><rect x="40" y="245" width="700" height="4" fill="#9b1b1e"/><text x="54" y="232" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Tres escalones de pistas (modelos SIN señal)</text><rect x="80" y="535" width="190" height="90" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="80" y="535" width="36" height="36" fill="#141414"/><text x="98.0" y="559.48" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><text x="175" y="597" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold">lo que la red ve</text><text x="175" y="619" font-size="14" text-anchor="middle" fill="#555" font-style="italic">canales a 0, equipo, nivel</text><rect x="295" y="435" width="190" height="190" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><rect x="295" y="435" width="36" height="36" fill="#9b1b1e"/><text x="313.0" y="459.48" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><text x="390" y="497" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold">+ posición</text><text x="390" y="519" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">= TECHO DEL ATAJO</text><rect x="510" y="305" width="190" height="320" rx="0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/><rect x="510" y="305" width="36" height="36" fill="#8a8a8a"/><text x="528.0" y="329.48" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="605" y="367" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold">+ contexto del fichero</text><text x="605" y="389" font-size="14" text-anchor="middle" fill="#555" font-style="italic">no cabe en una ventana</text><line x1="70" y1="625" x2="720" y2="625" stroke="#141414"/><text x="175" y="525" font-size="15" text-anchor="middle" fill="#8a8a8a">suele salir ≈ azar</text><text x="390" y="425" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="bold">el techo</text><text x="605" y="295" font-size="15" text-anchor="middle" fill="#8a8a8a">≈ 1 (por construcción)</text><text x="390" y="652" font-size="14" text-anchor="middle" fill="#8a8a8a" font-style="italic">altura = AUROC del modelo que solo ve esas pistas (esquema)</text><rect x="780" y="205" width="580" height="210" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="780" y="205" width="580" height="40" fill="#9b1b1e"/><rect x="780" y="245" width="580" height="4" fill="#9b1b1e"/><text x="794" y="232" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Cómo NO leerlo</text><text x="800" y="280" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">✗  No es un "suelo" que la red tenga que superar:</text><text x="800" y="306.0" font-size="15" text-anchor="start" fill="#141414">la red no lee el minuto del fichero; solo podría</text><text x="800" y="327.3" font-size="15" text-anchor="start" fill="#141414">aprovecharlo si el EEG de esa parte es distinto.</text><text x="800" y="368" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="bold">✓  Es lo MÁXIMO que la pista podría inflar la nota.</text><text x="800" y="394" font-size="15" text-anchor="start" fill="#141414">La red se sigue comparando con el azar (0,5).</text><rect x="780" y="435" width="580" height="230" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="780" y="435" width="580" height="40" fill="#141414"/><rect x="780" y="475" width="580" height="4" fill="#9b1b1e"/><text x="794" y="462" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Dónde están las cifras de verdad</text><text x="800" y="510" font-size="15" text-anchor="start" fill="#141414">Las calcula la sección 10 cuando ejecutas el notebook:</text><text x="800" y="537" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">· figura techo_del_atajo.png (barras con intervalo)</text><text x="800" y="564" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">· recuadro 🏆 con la AUROC de cada escalón en dev y eval</text><text x="800" y="591" font-size="15" text-anchor="start" fill="#141414">· y se guardan en modelo_metadatos.csv.</text><text x="800" y="618" font-size="15" text-anchor="start" fill="#8a8a8a" font-style="italic">Cambian si cambian 01-04: por eso no van en la imagen.</text><text x="40" y="700.0" font-size="15" text-anchor="start" fill="#333" font-style="italic">La prueba de verdad no es el techo, son los controles (secciones 11 y 12): si la nota de la red se mantiene en ellos, no usaba la pista;</text><text x="40" y="721.3" font-size="15" text-anchor="start" fill="#333" font-style="italic">si cae mucho, sí. El techo solo dice cuánto podría estar en juego.</text></svg>