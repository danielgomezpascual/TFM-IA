<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="680" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">TRAMPA 3 · LA REJILLA DE CORTE</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">por qué la posición en el fichero se mide de 30 en 30 segundos (valores de ejemplo)</text><rect x="40" y="100" width="1320" height="330" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="100" width="1320" height="40" fill="#141414"/><rect x="40" y="140" width="1320" height="4" fill="#9b1b1e"/><text x="54" y="127" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Cómo corta 03 las ventanas de 4 s en cada clase</text><text x="60" y="172" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">💤 interictal: desde el INICIO del tramo, una cada 4 s (sin solape)</text><rect x="60" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="130.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 12 s</text><rect x="210" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="280.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 16 s</text><rect x="360" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="430.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 20 s</text><rect x="510" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="580.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 24 s</text><rect x="660" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="730.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 28 s</text><rect x="810" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="880.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 32 s</text><rect x="960" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="1030.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 36 s</text><rect x="1110" y="188" width="140" height="34" rx="0" fill="#cfcfcf" stroke="#141414" stroke-width="1"/><text x="1180.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#141414">empieza en 40 s</text><text x="60" y="248" font-size="14.5" text-anchor="start" fill="#444" font-style="italic">todas empiezan en un segundo entero que sale de la misma cuadrícula: 12, 16, 20, 24…</text><text x="60" y="296" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="bold">⏳ preictal: hacia ATRÁS desde "crisis − SPH", una cada 2 s (solape del 50 %)</text><rect x="60" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="130.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 265,6 s</text><rect x="210" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="280.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 267,6 s</text><rect x="360" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="430.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 269,6 s</text><rect x="510" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="580.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 271,6 s</text><rect x="660" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="730.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 273,6 s</text><rect x="810" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="880.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 275,6 s</text><rect x="960" y="312" width="140" height="34" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><text x="1030.0" y="333.0" font-size="13.5" text-anchor="middle" fill="#ffffff">empieza en 277,6 s</text><rect x="1110" y="312" width="70" height="34" fill="url(#rayado)" stroke="#8a8a8a"/><text x="1145" y="334" font-size="13" text-anchor="middle" fill="#8a8a8a">SPH</text><rect x="1180" y="312" width="40" height="34" fill="#141414"/><text x="1200" y="335" font-size="15" text-anchor="middle" fill="#ffffff">⚡</text><text x="60" y="372" font-size="14.5" text-anchor="start" fill="#444" font-style="italic">el inicio depende del segundo exacto en que empieza la crisis (p. ej. 341,6 s, con SPH de 60 s): sale con decimales que la cuadrícula del 💤 nunca tiene</text><text x="60" y="400" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Resultado: con solo mirar el segundo exacto de inicio se sabe la clase. "¿Cae en la cuadrícula de 4 s?" → 💤; "¿tiene ,6?" → ⏳.</text><rect x="40" y="455" width="640" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="455" width="640" height="40" fill="#9b1b1e"/><rect x="40" y="495" width="640" height="4" fill="#9b1b1e"/><text x="54" y="482" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Por qué era una trampa</text><text x="60" y="530" font-size="15" text-anchor="start" fill="#141414">La red NO ve este número: solo recibe el EEG de la ventana.</text><text x="60" y="557" font-size="15" text-anchor="start" fill="#141414">Pero el modelo de metadatos de la sección 10 sí lo veía</text><text x="60" y="584" font-size="15" text-anchor="start" fill="#141414">a través de la posición en el fichero, y acertaba casi</text><text x="60" y="611" font-size="15" text-anchor="start" fill="#141414">siempre por la cuadrícula, no por "en qué parte del fichero".</text><text x="60" y="638" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">El techo del atajo salía inflado: medía la rejilla de corte.</text><rect x="720" y="455" width="640" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="720" y="455" width="640" height="40" fill="#141414"/><rect x="720" y="495" width="640" height="4" fill="#9b1b1e"/><text x="734" y="482" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Corrección (atajos.py)</text><text x="740" y="530" font-size="15" text-anchor="start" fill="#141414">La posición se redondea a franjas de 30 s</text><text x="740" y="557" font-size="15" text-anchor="start" fill="#141414">(RESOLUCION_POSICION_S = 30): 265,6 s y 268 s caen</text><text x="740" y="584" font-size="15" text-anchor="start" fill="#141414">las dos en la franja de 4,0 min y el truco desaparece.</text><text x="740" y="611" font-size="15" text-anchor="start" fill="#141414">Se conserva lo que interesa medir: en qué parte</text><text x="740" y="638" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">del fichero está la ventana (principio, medio, final).</text></svg>