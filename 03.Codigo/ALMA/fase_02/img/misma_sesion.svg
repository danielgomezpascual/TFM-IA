<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="720" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">CONTROL 2 · 💤 DE LA MISMA SESIÓN</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">mismo paciente, misma sesión (≈ mismo día), pero un fichero sin crisis</text><text x="40" y="132" font-size="17.5" text-anchor="start" fill="#141414" font-weight="bold">Una sesión con crisis (≈ un día de grabación; sus ficheros, los tokens, van uno detrás de otro)</text><text x="195" y="170" font-size="16" text-anchor="middle" fill="#8a8a8a" font-family="monospace">t000</text><rect x="40" y="180" width="310" height="60" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.5"/><text x="195" y="217" font-size="16" text-anchor="middle" fill="#141414">💤 fichero sin crisis</text><text x="195" y="270" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">✓ entra en el control</text><text x="195" y="292" font-size="13.5" text-anchor="middle" fill="#9b1b1e" font-weight="bold">✓ y en la variante estricta (antes de la crisis)</text><text x="530" y="170" font-size="16" text-anchor="middle" fill="#8a8a8a" font-family="monospace">t001</text><rect x="375" y="180" width="310" height="60" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.5"/><text x="530" y="217" font-size="16" text-anchor="middle" fill="#141414">💤 fichero sin crisis</text><text x="530" y="270" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">✓ entra en el control</text><text x="530" y="292" font-size="13.5" text-anchor="middle" fill="#9b1b1e" font-weight="bold">✓ y en la variante estricta (antes de la crisis)</text><text x="865" y="170" font-size="16" text-anchor="middle" fill="#8a8a8a" font-family="monospace">t002</text><rect x="710" y="180" width="310" height="60" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><rect x="750" y="180" width="90" height="60" fill="#9b1b1e"/><text x="795" y="215" font-size="18" text-anchor="middle" fill="#ffffff">⏳</text><rect x="855" y="180" width="28" height="60" fill="#141414"/><text x="869" y="217" font-size="16" text-anchor="middle" fill="#ffffff">⚡</text><rect x="883" y="180" width="45" height="60" fill="url(#rayado)" stroke="#8a8a8a"/><rect x="928" y="180" width="92" height="60" fill="#f1c9cb" stroke="#9b1b1e" stroke-dasharray="4 3"/><text x="974" y="215" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold">💤 ✗</text><text x="865" y="270" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">fichero con crisis</text><text x="865" y="295" font-size="13.5" text-anchor="middle" fill="#9b1b1e">su 💤 "lejos_de_crisis" está casi todo</text><text x="865" y="313" font-size="13.5" text-anchor="middle" fill="#9b1b1e" font-weight="bold">justo DESPUÉS → podría ser post-crisis ✗</text><text x="1200" y="170" font-size="16" text-anchor="middle" fill="#8a8a8a" font-family="monospace">t003</text><rect x="1045" y="180" width="310" height="60" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.5"/><text x="1200" y="217" font-size="16" text-anchor="middle" fill="#141414">💤 fichero sin crisis</text><text x="1200" y="270" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">✓ entra en el control</text><text x="1200" y="292" font-size="13.5" text-anchor="middle" fill="#8a8a8a" font-style="italic">✗ no en la estricta: podría ser post-crisis</text><rect x="40" y="340" width="1320" height="78" rx="0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="60" y="370" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Otro día, sesión sin crisis:</text><text x="262" y="370" font-size="16" text-anchor="start" fill="#141414">de aquí sale casi todo el 💤 interictal "normal" del conjunto de 04.</text><text x="60" y="398" font-size="15" text-anchor="start" fill="#444" font-style="italic">Si la red aprende "día con crisis", con este 💤 acierta fácil; con el 💤 de la misma sesión, no, porque es del mismo día.</text><rect x="40" y="440" width="1320" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="440" width="1320" height="40" fill="#9b1b1e"/><rect x="40" y="480" width="1320" height="4" fill="#9b1b1e"/><text x="54" y="467" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Cómo se usa en la Fase 3</text><text x="60" y="515" font-size="15.5" text-anchor="start" fill="#141414">Se mide la red con todas las ⏳ y SOLO el 💤 de la misma sesión (conjuntos_control/&lt;conjunto&gt;_misma_sesion.csv, lo guarda la sección 12).</text><text x="60" y="545" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Nota que se mantiene → detecta algo cercano a la crisis.   Nota que cae mucho → aprendía sobre todo "día con crisis".</text><text x="60" y="575" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">Limitación: TUSZ no dice cuánto tiempo pasa entre un token y el siguiente.</text><text x="40" y="635.0" font-size="14.5" text-anchor="start" fill="#333" font-weight="bold">De dónde salen los datos (nada nuevo que se guarde aparte):</text><text x="40" y="655.59" font-size="14.5" text-anchor="start" fill="#333">· la sesión y el token salen del nombre de cada fichero (paciente_sesión_token); edfs.csv de la Fase 1 dice cuántas crisis tiene cada fichero;</text><text x="40" y="676.18" font-size="14.5" text-anchor="start" fill="#333">· atajos.marcar_sesiones junta las dos cosas al vuelo: sesion, sesion_con_crisis y antes_de_la_primera_crisis (para la variante estricta).</text></svg>