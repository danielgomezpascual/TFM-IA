/><text x="935" y="400" font-size="13" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="1.5">LO QUE SALIÓ</text><text x="935" y="428" font-size="16" xml:space="preserve"><tspan font-weight="bold" fill="#9b1b1e">Conjuntos: </tspan><tspan fill="#141414">equilibrio solo en train, por paciente</tspan></text></g><g opacity="0.33"><rect x="40" y="464" width="170" height="72" rx="0" fill="#8a8a8a" stroke="#141414" stroke-width="0"/><rect x="40" y="532" width="170" height="4" fill="#9b1b1e"/><text x="125" y="497" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">F02.05</text><text x="125" y="520" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Auditoría de atajos</text><rect x="230" y="464" width="640" height="72" rx="0" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="0"/><text x="250" y="488" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal" letter-spacing="1.5">PREGUNTA</text><text x="250" y="516" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">¿Puede acertar sin mirar el EEG?</text><line x1="872" y1="500" x2="913" y2="500" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="915" y="464" width="445" height="72" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="935" y="488" font-size="13" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="1.5">LO QUE SALIÓ</text><text x="935" y="516" font-size="16" xml:space="preserve"><tspan font-weight="bold" fill="#9b1b1e">Hay pistas: </tspan><tspan fill="#141414">posición y tipo de fichero → controles</tspan></text></g><rect x="28" y="102" width="1344" height="92" fill="none" stroke="#9b1b1e" stroke-width="4"/><rect x="1190" y="88" width="170" height="28" fill="#9b1b1e"/><text x="1275" y="108" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="2">ESTÁS AQUÍ</text><rect x="40" y="566" width="1320" height="52" rx="0" fill="#8a8a8a" stroke="#141414" stroke-width="0"/><rect x="40" y="614" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="598" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Siguiente: Fase 3 · el modelo de predicción (F03.01 prepara los datos que verá la red)</text><text x="700" y="662" font-size="14" text-anchor="middle" fill="#b0b0b0" font-weight="normal" font-style="italic">Las cifras exactas salen de cada notebook al ejecutarlo; esta figura resume lo que salió en noviembre de 2026.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>