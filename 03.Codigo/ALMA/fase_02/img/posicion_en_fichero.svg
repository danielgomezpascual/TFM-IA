<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="690" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">POR QUÉ EL ⏳ PREICTAL SALE AL PRINCIPIO DEL FICHERO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">esquema (no a escala exacta)</text><text x="40" y="150" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Fichero con crisis</text><text x="40" y="172" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">(los de TUSZ se cortan</text><text x="40" y="190" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">cerca de la crisis)</text><rect x="250.0" y="135" width="872.0" height="50" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><rect x="342.65" y="135" width="163.50000000000006" height="50" fill="#9b1b1e"/><text x="424.4" y="166" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">⏳ preictal</text><text x="424.4" y="206" font-size="13.5" text-anchor="middle" fill="#9b1b1e" font-style="italic">de 4 a 1 min antes de la crisis</text><rect x="506.15000000000003" y="135" width="54.50000000000006" height="50" fill="url(#rayado)" stroke="#8a8a8a"/><text x="533.4000000000001" y="166" font-size="13" text-anchor="middle" fill="#8a8a8a">SPH</text><rect x="560.6500000000001" y="135" width="43.59999999999991" height="50" fill="#141414"/><text x="582.45" y="166" font-size="18" text-anchor="middle" fill="#ffffff">⚡</text><text x="582.45" y="125" font-size="14" text-anchor="middle" fill="#141414" font-style="italic">crisis (mediana: minuto ~5-6)</text><text x="40" y="270" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Fichero sin crisis</text><rect x="250.0" y="245" width="763.0" height="50" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.5"/><text x="631.5" y="276" font-size="15" text-anchor="middle" fill="#141414">💤 interictal: todo el fichero</text><line x1="250.0" y1="330" x2="1340.0" y2="330" stroke="#141414"/><line x1="250.0" y1="330" x2="250.0" y2="336" stroke="#141414"/><text x="250.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">0</text><line x1="359.0" y1="330" x2="359.0" y2="336" stroke="#141414"/><text x="359.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">2</text><line x1="468.0" y1="330" x2="468.0" y2="336" stroke="#141414"/><text x="468.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">4</text><line x1="577.0" y1="330" x2="577.0" y2="336" stroke="#141414"/><text x="577.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">6</text><line x1="686.0" y1="330" x2="686.0" y2="336" stroke="#141414"/><text x="686.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">8</text><line x1="795.0" y1="330" x2="795.0" y2="336" stroke="#141414"/><text x="795.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">10</text><line x1="904.0" y1="330" x2="904.0" y2="336" stroke="#141414"/><text x="904.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">12</text><line x1="1013.0" y1="330" x2="1013.0" y2="336" stroke="#141414"/><text x="1013.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">14</text><line x1="1122.0" y1="330" x2="1122.0" y2="336" stroke="#141414"/><text x="1122.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">16</text><line x1="1231.0" y1="330" x2="1231.0" y2="336" stroke="#141414"/><text x="1231.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">18</text><line x1="1340.0" y1="330" x2="1340.0" y2="336" stroke="#141414"/><text x="1340.0" y="354" font-size="14" text-anchor="middle" fill="#8a8a8a">20</text><text x="795.0" y="378" font-size="15" text-anchor="middle" fill="#8a8a8a" font-style="italic">minuto del fichero</text><path d="M250.0,560 C304.5,560 359.0,420 413.5,420 C468.0,420 522.5,540 686.0,555 L1340.0,560" fill="none" stroke="#9b1b1e" stroke-width="3"/><path d="M250.0,560 L250.0,500 C468.0,505 686.0,515 1013.0,540 C1176.5,552 1285.5,558 1340.0,560 z" fill="#cfcfcf" opacity="0.8"/><text x="413.5" y="410" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="bold">⏳ amontonado en los minutos 1-5</text><text x="904.0" y="500" font-size="15" text-anchor="middle" fill="#555">💤 repartido por todo el fichero</text><line x1="250.0" y1="560" x2="1340.0" y2="560" stroke="#141414"/><rect x="40" y="590" width="1320" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="60" y="618" font-size="15" text-anchor="start" fill="#141414">La posición separa las clases, también dentro de cada paciente. Pero solo ~1 de cada 5 ventanas está en el primer fichero de su sesión (t000):</text><text x="60" y="642" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">en la mayoría, el "principio del fichero" no es el principio de la grabación. Si la red lo nota en el EEG lo dirá el control de la sección 11.</text></svg>