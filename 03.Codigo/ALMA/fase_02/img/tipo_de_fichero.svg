<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="770" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">H5 · LA CONFUSIÓN POR TIPO DE FICHERO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">en TUSZ el ⏳ solo existe en ficheros con crisis: la clase va pegada al tipo de fichero y de sesión</text><rect x="40" y="100" width="1320" height="86" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="58" y="128" font-size="16.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">Qué es una sesión</text><text x="58" y="154.0" font-size="14.5" text-anchor="start" fill="#141414">En TUSZ cada fichero se llama paciente_sesión_token (p. ej. aaaaaacz_s006_t000). Una sesión (s006) es una visita de grabación, normalmente un día;</text><text x="58" y="174.59" font-size="14.5" text-anchor="start" fill="#141414">dentro de ella hay varios ficheros seguidos, los tokens (t000, t001…). En tus datos hay 1.643 sesiones, con 3 ficheros por sesión de mediana.</text><rect x="40" y="205" width="600" height="250" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="205" width="600" height="40" fill="#141414"/><rect x="40" y="245" width="600" height="4" fill="#9b1b1e"/><text x="54" y="232" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Una sesión CON crisis (≈ un día con crisis)</text><rect x="60" y="265" width="560" height="46" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><rect x="200" y="265" width="160" height="46" fill="#9b1b1e"/><text x="280" y="294" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">⏳ preictal</text><rect x="390" y="265" width="40" height="46" fill="#141414"/><text x="410" y="294" font-size="18" text-anchor="middle" fill="#ffffff">⚡</text><text x="60" y="345.0" font-size="15" text-anchor="start" fill="#444" font-style="italic">ese día el paciente puede estar sin dormir, con la medicación</text><text x="60" y="366.3" font-size="15" text-anchor="start" fill="#444" font-style="italic">reducida para provocar crisis, ingresado, con otro tipo de grabación…</text><text x="60" y="425" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="bold">→ todo el ⏳ preictal sale de sesiones así</text><rect x="760" y="205" width="600" height="250" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="760" y="205" width="600" height="40" fill="#141414"/><rect x="760" y="245" width="600" height="4" fill="#9b1b1e"/><text x="774" y="232" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Una sesión SIN crisis (≈ un día sin crisis)</text><rect x="780" y="265" width="560" height="46" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.2"/><text x="1060" y="294" font-size="16" text-anchor="middle" fill="#141414">💤 interictal</text><text x="780" y="345.0" font-size="15" text-anchor="start" fill="#444" font-style="italic">otro día, con el paciente en otro estado</text><text x="780" y="425" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">→ casi todo el 💤 interictal sale de sesiones así</text><text x="700" y="345" font-size="26" text-anchor="middle" fill="#8a8a8a">vs</text><rect x="40" y="480" width="1320" height="175" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="480" width="1320" height="40" fill="#9b1b1e"/><rect x="40" y="520" width="1320" height="4" fill="#9b1b1e"/><text x="54" y="507" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Qué podría aprender la red</text><text x="70" y="555" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">Lo que queremos:</text><text x="260" y="555" font-size="17" text-anchor="start" fill="#141414">"este EEG cambia porque se acerca una crisis"  (minutos antes)</text><text x="70" y="590" font-size="17" text-anchor="start" fill="#9b1b1e" font-weight="bold">El atajo posible:</text><text x="260" y="590" font-size="17" text-anchor="start" fill="#9b1b1e">"este EEG es de un día con crisis"  (todo el día)</text><text x="70" y="630" font-size="15" text-anchor="start" fill="#444" font-style="italic">La red no ve los metadatos: si la diferencia existe, va DENTRO de la señal. Borrar metadatos no sirve: hace falta un control (sección 12).</text><text x="40" y="690.0" font-size="14.5" text-anchor="start" fill="#333" font-weight="bold">De dónde salen estos datos (no es nada nuevo que se guarde aparte):</text><text x="40" y="710.59" font-size="14.5" text-anchor="start" fill="#333">· si un 💤 viene de un fichero con o sin crisis ya lo anota 01 en tramos.csv (columna origen: fichero_sin_crisis / lejos_de_crisis);</text><text x="40" y="731.18" font-size="14.5" text-anchor="start" fill="#333">· la sesión sale del nombre del fichero y edfs.csv dice cuántas crisis tiene cada fichero; atajos.marcar_sesiones junta las dos cosas al vuelo.</text></svg>