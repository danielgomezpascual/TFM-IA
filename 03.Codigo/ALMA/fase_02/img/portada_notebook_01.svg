<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="806" viewBox="0 0 1400 806" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><rect width="1400" height="806" fill="#ffffff"/><text x="700" y="50" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">F02.01 · SELECCIÓN DE CRISIS Y TRAMOS</text><text x="700" y="80" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">qué trozos de qué EDF se usan, sin tocar la señal</text><rect x="40" y="108" width="1320" height="76" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="134" font-size="13" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="2">LA PREGUNTA DE ESTE NOTEBOOK</text><text x="700" y="168" font-size="24" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿Qué trozos de señal son preictal, interictal e ictal?</text><text x="40" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE ENTRA</text><rect x="40" y="235" width="320" height="3" fill="#9b1b1e"/><text x="420" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE HACE</text><rect x="420" y="235" width="560" height="3" fill="#9b1b1e"/><text x="1040" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE SALE</text><rect x="1040" y="235" width="320" height="3" fill="#9b1b1e"/><rect x="40" y="250.0" width="320" height="196.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="343.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F01.01 · las tablas</text><text x="60" y="369.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">edfs.csv y crisis.csv</text><rect x="40" y="460.0" width="320" height="196.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="541.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">umbrales.py</text><text x="60" y="567.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">lead-in, SPH y margen</text><text x="60" y="591.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">postictal de cada tipo</text><rect x="1040" y="250.0" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="331.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">tramos.csv</text><text x="1060" y="357.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">un trozo de EDF por fila,</text><text x="1060" y="381.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">con su clase</text><rect x="1040" y="460.0" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="553.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Recuentos y figuras</text><text x="1060" y="579.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">por umbral, tipo y grupo</text><rect x="420" y="250" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="285.0" r="20" fill="#141414"/><text x="456" y="292.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><line x1="456" y1="305.0" x2="456" y2="333" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="280.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Limpiar las crisis</text><text x="492" y="304.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">fuera las anómalas y las de menos de 2 s</text><rect x="420" y="334" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="369.0" r="20" fill="#141414"/><text x="456" y="376.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><line x1="456" y1="389.0" x2="456" y2="417" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="364.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Contar por umbral</text><text x="492" y="388.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">crisis y pacientes que quedan con cada lead-in</text><rect x="420" y="418" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="453.0" r="20" fill="#141414"/><text x="456" y="460.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><line x1="456" y1="473.0" x2="456" y2="501" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="448.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Elegir el umbral</text><text x="492" y="472.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">el que más preictal da sin bajar de 20 pacientes</text><rect x="420" y="502" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="537.0" r="20" fill="#141414"/><text x="456" y="544.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><line x1="456" y1="557.0" x2="456" y2="585" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="532.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Tramos de cada clase</text><text x="492" y="556.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">preictal, interictal e ictal</text><rect x="420" y="586" width="560" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="456" cy="621.0" r="20" fill="#141414"/><text x="456" y="628.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="492" y="616.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Juntar y comprobar</text><text x="492" y="640.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">tramos.csv, sin ningún solape prohibido</text><line x1="366" y1="453.0" x2="412" y2="453.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="988" y1="453.0" x2="1034" y2="453.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="40" y="696" width="1320" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="756" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="735" font-size="19" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#e8a0a2">IDEA CLAVE: </tspan><tspan fill="#ffffff">aquí no se toca la señal: solo se apuntan tiempos.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>