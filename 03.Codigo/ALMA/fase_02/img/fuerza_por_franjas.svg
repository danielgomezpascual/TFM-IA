<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="760" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">FUERZA "POR FRANJAS"</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">para que el semáforo vea también las pistas que suben y bajan</text><rect x="40" y="100" width="650" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="58" y="128" font-size="16.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">¿Qué es una franja?</text><text x="58" y="154.0" font-size="14.5" text-anchor="start" fill="#141414">Un trozo del rango de valores de la pista. Ejemplo: el minuto del</text><text x="58" y="174.59" font-size="14.5" text-anchor="start" fill="#141414">fichero va de 0 a 30 y se corta en 10 trozos (N_FRANJAS = 10) que</text><text x="58" y="195.18" font-size="14.5" text-anchor="start" fill="#141414">tengan el mismo número de ventanas de 🔵 train. Por eso no miden</text><text x="58" y="215.76999999999998" font-size="14.5" text-anchor="start" fill="#141414">lo mismo: donde hay muchas ventanas son estrechos (0-1 min) y donde</text><text x="58" y="236.36" font-size="14.5" text-anchor="start" fill="#141414">hay pocas, anchos (19-30 min).</text><rect x="710" y="100" width="650" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="728" y="128" font-size="16.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">¿Qué es una pista de "cuanto más, más preictal"?</text><text x="728" y="154.0" font-size="14.5" text-anchor="start" fill="#141414">Una en la que el % de ⏳ va siempre en la misma dirección: cuanto más</text><text x="728" y="174.59" font-size="14.5" text-anchor="start" fill="#141414">alto el valor, más ⏳ (o siempre menos). La AUROC normal solo ve ese</text><text x="728" y="195.18" font-size="14.5" text-anchor="start" fill="#141414">tipo. El minuto del fichero NO es así: el ⏳ sube en los minutos 1-4 y</text><text x="728" y="215.76999999999998" font-size="14.5" text-anchor="start" fill="#141414">luego baja. Sube y baja, se compensa, y la AUROC normal sale cerca de</text><text x="728" y="236.36" font-size="14.5" text-anchor="start" fill="#141414">0,5 aunque la pista separe mucho. Las franjas lo arreglan.</text><rect x="40" y="295" width="900" height="390" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="295" width="900" height="40" fill="#141414"/><rect x="40" y="335" width="900" height="4" fill="#9b1b1e"/><text x="54" y="322" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold">1 · % de ventanas ⏳ en cada franja del minuto del fichero (train)</text><rect x="96.0" y="570.0" width="69.0" height="30.0" fill="#bdbdbd"/><text x="130.5" y="562.0" font-size="14" text-anchor="middle" fill="#141414">12 %</text><text x="130.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 1</text><text x="130.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">0-1 min</text><rect x="177.0" y="405.0" width="69.0" height="195.0" fill="#9b1b1e"/><text x="211.5" y="397.0" font-size="14" text-anchor="middle" fill="#141414">78 %</text><text x="211.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 2</text><text x="211.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">1-2 min</text><rect x="258.0" y="400.0" width="69.0" height="200.0" fill="#9b1b1e"/><text x="292.5" y="392.0" font-size="14" text-anchor="middle" fill="#141414">80 %</text><text x="292.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 3</text><text x="292.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">2-3 min</text><rect x="339.0" y="420.0" width="69.0" height="180.0" fill="#9b1b1e"/><text x="373.5" y="412.0" font-size="14" text-anchor="middle" fill="#141414">72 %</text><text x="373.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 4</text><text x="373.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">3-4 min</text><rect x="420.0" y="462.5" width="69.0" height="137.5" fill="#c98d8f"/><text x="454.5" y="454.5" font-size="14" text-anchor="middle" fill="#141414">55 %</text><text x="454.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 5</text><text x="454.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">4-6 min</text><rect x="501.0" y="500.0" width="69.0" height="100.0" fill="#bdbdbd"/><text x="535.5" y="492.0" font-size="14" text-anchor="middle" fill="#141414">40 %</text><text x="535.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 6</text><text x="535.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">6-8 min</text><rect x="582.0" y="512.5" width="69.0" height="87.5" fill="#bdbdbd"/><text x="616.5" y="504.5" font-size="14" text-anchor="middle" fill="#141414">35 %</text><text x="616.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 7</text><text x="616.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">8-11 min</text><rect x="663.0" y="512.5" width="69.0" height="87.5" fill="#bdbdbd"/><text x="697.5" y="504.5" font-size="14" text-anchor="middle" fill="#141414">35 %</text><text x="697.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 8</text><text x="697.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">11-14 min</text><rect x="744.0" y="505.0" width="69.0" height="95.0" fill="#bdbdbd"/><text x="778.5" y="497.0" font-size="14" text-anchor="middle" fill="#141414">38 %</text><text x="778.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 9</text><text x="778.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">14-19 min</text><rect x="825.0" y="510.0" width="69.0" height="90.0" fill="#bdbdbd"/><text x="859.5" y="502.0" font-size="14" text-anchor="middle" fill="#141414">36 %</text><text x="859.5" y="620" font-size="12.5" text-anchor="middle" fill="#8a8a8a">franja 10</text><text x="859.5" y="638" font-size="13" text-anchor="middle" fill="#141414" font-weight="bold">19-30 min</text><line x1="90" y1="600" x2="900" y2="600" stroke="#141414"/><line x1="90" y1="475.0" x2="900" y2="475.0" stroke="#8a8a8a" stroke-dasharray="5 4"/><text x="896" y="469.0" font-size="13" text-anchor="end" fill="#8a8a8a" font-style="italic">50 % = mitad y mitad: no separa</text><text x="490" y="668" font-size="14" text-anchor="middle" fill="#444" font-style="italic">casi no hay ⏳ en el minuto 0-1, mucho en 1-4 y una mezcla en el resto: sube y baja</text><rect x="980" y="295" width="380" height="180" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="980" y="295" width="380" height="40" fill="#141414"/><rect x="980" y="335" width="380" height="4" fill="#9b1b1e"/><text x="994" y="322" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold">2 · Cada ventana vale el % de su franja</text><text x="1000" y="372" font-size="16.5" text-anchor="start" fill="#141414">ventana en el minuto 0,5  →  0,12</text><text x="1000" y="402" font-size="16.5" text-anchor="start" fill="#141414">ventana en el minuto 2,5  →  0,80</text><text x="1000" y="432" font-size="16.5" text-anchor="start" fill="#141414">ventana en el minuto 9     →  0,35</text><rect x="980" y="505" width="380" height="180" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="980" y="505" width="380" height="40" fill="#141414"/><rect x="980" y="545" width="380" height="4" fill="#9b1b1e"/><text x="994" y="532" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold">3 · Fuerza = AUROC de ese número</text><text x="1000" y="580" font-size="15" text-anchor="start" fill="#141414">Con el minuto tal cual:</text><text x="1340" y="580" font-size="17" text-anchor="end" fill="#141414" font-weight="bold">≈ 0,55</text><text x="1000" y="615" font-size="15" text-anchor="start" fill="#141414">Con el % de su franja:</text><text x="1340" y="615" font-size="17" text-anchor="end" fill="#9b1b1e" font-weight="bold">≈ 0,75 🔴</text><text x="1170" y="662" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">ahora sí se ve que el minuto separa</text><path d="M942,450 L976,400" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><path d="M1170,477 L1170,501" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#fG)"/><text x="700" y="718.0" font-size="15" text-anchor="middle" fill="#8a8a8a" font-style="italic">Las franjas y sus % se calculan solo con 🔵 train y se aplican tal cual a 🟡 dev y 🟢 eval (sin mirar sus etiquetas).</text><text x="700" y="739.3" font-size="15" text-anchor="middle" fill="#8a8a8a" font-style="italic">Con las pistas que son categorías (montaje, Hz) es igual: cada categoría es su propia franja.</text></svg>