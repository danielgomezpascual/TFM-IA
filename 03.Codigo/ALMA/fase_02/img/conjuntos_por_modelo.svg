xt><text x="314" y="394" font-size="15.5" text-anchor="start" fill="#141414">tipos (Fase 4)</text><text x="594" y="394" font-size="15.5" text-anchor="start" fill="#141414">⚡ ictales</text><text x="834" y="394" font-size="15.5" text-anchor="start" fill="#141414">—</text><text x="1094" y="394" font-size="15.5" text-anchor="start" fill="#141414">🔵 🟡 🟢</text><rect x="40" y="430" width="1320" height="46" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="62" y="462" font-size="15" text-anchor="start" fill="#141414">Los modelos de grupo solo usan 💤 de pacientes de su grupo: un modelo de 🔹 ausencias se usaría con pacientes que tienen ausencias.</text></svg>