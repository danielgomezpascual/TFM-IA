</defs><rect width="1400" height="680" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">CÓMO SE USARÁN LOS CONTROLES EN LA FASE 3</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">hay resultado en todos los casos: lo que cambia es cómo se cuenta</text><rect x="40" y="110" width="420" height="90" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="60" y="148" font-size="19" text-anchor="start" fill="#141414" font-weight="bold">1 · Conjunto normal</text><text x="60" y="178" font-size="14" text-anchor="start" fill="#555" font-family="monospace">conjuntos/general.csv</text><rect x="490" y="110" width="420" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="510" y="148" font-size="19" text-anchor="start" fill="#141414" font-weight="bold">2 · Control de posición</text><text x="510" y="178" font-size="14" text-anchor="start" fill="#555" font-family="monospace">…_emparejado_posicion.csv</text><rect x="940" y="110" width="420" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="960" y="148" font-size="19" text-anchor="start" fill="#141414" font-weight="bold">3 · Control de misma sesión</text><text x="960" y="178" font-size="14" text-anchor="start" fill="#555" font-family="monospace">…_misma_sesion.csv</text><text x="700" y="240" font-size="16" text-anchor="middle" fill="#8a8a8a" font-style="italic">la misma red, medida tres veces (AUROC con intervalo por paciente)</text><rect x="40" y="270" width="1320" height="105" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="70" y="285.0" width="26" height="75.0" fill="#141414" opacity="1"/><rect x="104" y="288.0" width="26" height="72.0" fill="#9b1b1e" opacity="0.75"/><rect x="138" y="288.75" width="26" height="71.25" fill="#9b1b1e" opacity="0.75"/><text x="200" y="306" font-size="18" text-anchor="start" fill="#141414" font-weight="bold">La nota se mantiene en los controles</text><text x="200" y="334" font-size="16" text-anchor="start" fill="#141414">la red no usa esas pistas: detecta algo cercano a la crisis</text><text x="200" y="358" font-size="15" text-anchor="start" fill="#9b1b1e" font-style="italic">→ comprobación superada: muy defendible</text><rect x="40" y="390" width="1320" height="105" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="70" y="405.0" width="26" height="75.0" fill="#141414" opacity="1"/><rect x="104" y="416.25" width="26" height="63.75" fill="#9b1b1e" opacity="0.75"/><rect x="138" y="420.0" width="26" height="60.0" fill="#9b1b1e" opacity="0.75"/><text x="200" y="426" font-size="18" text-anchor="start" fill="#141414" font-weight="bold">Baja un poco</text><text x="200" y="454" font-size="16" text-anchor="start" fill="#141414">usa algo de la pista y algo preictal</text><text x="200" y="478" font-size="15" text-anchor="start" fill="#9b1b1e" font-style="italic">→ dar las tres cifras y explicarlo como limitación</text><rect x="40" y="510" width="1320" height="105" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><rect x="70" y="525.0" width="26" height="75.0" fill="#141414" opacity="1"/><rect x="104" y="558.75" width="26" height="41.25" fill="#9b1b1e" opacity="0.75"/><rect x="138" y="562.5" width="26" height="37.5" fill="#9b1b1e" opacity="0.75"/><text x="200" y="546" font-size="18" text-anchor="start" fill="#141414" font-weight="bold">Baja mucho (hacia 0,5)</text><text x="200" y="574" font-size="16" text-anchor="start" fill="#141414">aprendía sobre todo la pista</text><text x="200" y="598" font-size="15" text-anchor="start" fill="#9b1b1e" font-style="italic">→ posición: reentrenar con el emparejado · tipo de fichero: reelegir el 💤 en 01</text><text x="700" y="650" font-size="14" text-anchor="middle" fill="#8a8a8a" font-style="italic">Barras: 1 normal · 2 control de posición · 3 control de misma sesión (esquema, no cifras reales)</text></svg>