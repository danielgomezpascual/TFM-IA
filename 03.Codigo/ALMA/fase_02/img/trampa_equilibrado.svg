<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="685" viewBox="0 0 1400 685" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="685" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">TRAMPA 2 · PACIENTES QUE NO ESTÁN MITAD Y MITAD</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">ejemplo con tres pacientes; la tabla de la sección 3b dice cuántos hay así en tu train</text><rect x="40" y="100" width="640" height="330" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="100" width="640" height="40" fill="#141414"/><rect x="40" y="140" width="640" height="4" fill="#9b1b1e"/><text x="54" y="127" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Antes: cada paciente con lo que tenía</text><text x="60" y="189" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente A</text><text x="60" y="209" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 256 Hz</text><rect x="200" y="173" width="288.0" height="18" fill="#9b1b1e"/><text x="494.0" y="187" font-size="14" text-anchor="start" fill="#141414">90 ⏳</text><rect x="200" y="197" width="288.0" height="18" fill="#bdbdbd"/><text x="494.0" y="211" font-size="14" text-anchor="start" fill="#141414">90 💤</text><text x="60" y="274" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente B</text><text x="60" y="294" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 400 Hz</text><rect x="200" y="258" width="288.0" height="18" fill="#9b1b1e"/><text x="494.0" y="272" font-size="14" text-anchor="start" fill="#141414">90 ⏳</text><rect x="200" y="282" width="128.0" height="18" fill="#bdbdbd"/><text x="334.0" y="296" font-size="14" text-anchor="start" fill="#141414">40 💤</text><text x="60" y="359" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente C</text><text x="60" y="379" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 250 Hz</text><rect x="200" y="343" width="288.0" height="18" fill="#9b1b1e"/><text x="494.0" y="357" font-size="14" text-anchor="start" fill="#141414">90 ⏳</text><rect x="200" y="367" width="1.5" height="18" fill="#bdbdbd"/><text x="207.5" y="381" font-size="14" text-anchor="start" fill="#141414">0 💤</text><text x="60" y="418" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">B tiene más ⏳ que 💤 y C solo ⏳.</text><rect x="720" y="100" width="640" height="330" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="720" y="100" width="640" height="40" fill="#9b1b1e"/><rect x="720" y="140" width="640" height="4" fill="#9b1b1e"/><text x="734" y="127" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Ahora (04, EQUILIBRADO_EXACTO = True)</text><text x="740" y="189" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente A</text><text x="740" y="209" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 256 Hz</text><rect x="880" y="173" width="288.0" height="18" fill="#9b1b1e"/><text x="1174.0" y="187" font-size="14" text-anchor="start" fill="#141414">90 ⏳</text><rect x="880" y="197" width="288.0" height="18" fill="#bdbdbd"/><text x="1174.0" y="211" font-size="14" text-anchor="start" fill="#141414">90 💤</text><text x="740" y="274" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente B</text><text x="740" y="294" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 400 Hz</text><rect x="880" y="258" width="128.0" height="18" fill="#9b1b1e"/><text x="1014.0" y="272" font-size="14" text-anchor="start" fill="#141414">40 ⏳</text><rect x="880" y="282" width="128.0" height="18" fill="#bdbdbd"/><text x="1014.0" y="296" font-size="14" text-anchor="start" fill="#141414">40 💤</text><text x="1050" y="272" font-size="13.5" text-anchor="start" fill="#9b1b1e" font-style="italic">← se sortean 40 de sus 90 ⏳</text><text x="740" y="359" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Paciente C</text><text x="740" y="379" font-size="13.5" text-anchor="start" fill="#8a8a8a" font-style="italic">equipo de 250 Hz</text><text x="880" y="369" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">fuera del entrenamiento: no tiene ninguna 💤</text><text x="740" y="418" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">Cada paciente que queda: exactamente mitad y mitad.</text><path d="M684,265 L716,265" fill="none" stroke="#9b1b1e" stroke-width="3" marker-end="url(#fR)"/><rect x="40" y="455" width="1320" height="205" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="455" width="1320" height="40" fill="#9b1b1e"/><rect x="40" y="495" width="1320" height="4" fill="#9b1b1e"/><text x="54" y="482" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">Por qué era una trampa</text><text x="60" y="530" font-size="15" text-anchor="start" fill="#141414">Mira solo las ventanas grabadas con el equipo de 250 Hz: todas son del paciente C, y C solo aporta ⏳. En el entrenamiento, "ventana de 250 Hz" significa</text><text x="60" y="557" font-size="15" text-anchor="start" fill="#141414">siempre ⏳ preictal. La red no lee los Hz, pero cada equipo deja su huella en la señal (ruido, filtros, forma del espectro) y la puede reconocer.</text><text x="60" y="584" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">Resultado: la red aprendería "esta huella de equipo → ⏳", acertaría en train reconociendo al paciente C, y ese truco no le serviría con los pacientes de eval.</text><text x="60" y="611" font-size="15" text-anchor="start" fill="#141414">Lo mismo pasa, más suave, con B (90 ⏳ frente a 40 💤): sus rasgos fijos "tiran" hacia ⏳.</text><text x="60" y="638" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold">Corrección: 04 deja cada paciente de train mitad y mitad (sortea sus ⏳ si le faltan 💤) y quita a los que no tienen ninguna 💤. La tabla de 3b lo comprueba.</text></svg>