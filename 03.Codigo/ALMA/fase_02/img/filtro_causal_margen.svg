<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="520" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">FILTRO CAUSAL Y MARGEN DE LECTURA</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">el filtro solo usa el pasado (como en la demo) y necesita unos segundos para asentarse</text><text x="40" y="180" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">EDF</text><rect x="150" y="150" width="1100" height="46" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><rect x="410" y="150" width="110" height="46" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="465.0" y="178.0" font-size="14" text-anchor="middle" fill="#444444" font-weight="bold">+10 s</text><rect x="980" y="150" width="110" height="46" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="1035.0" y="178.0" font-size="14" text-anchor="middle" fill="#444444" font-weight="bold">+10 s</text><rect x="520" y="150" width="460" height="46" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1.2"/><text x="750.0" y="178.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">tramo de tramos.csv</text><line x1="410" y1="134" x2="1090" y2="134" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)" marker-start="url(#fN)"/><text x="750.0" y="126" font-size="14.5" text-anchor="middle" fill="#141414" font-style="italic">lo que se lee del EDF (MARGEN_LECTURA_S a cada lado)</text><path d="M410,220 C440,300 480,220 520,250" stroke="#9b1b1e" stroke-width="2" fill="none"/><text x="460" y="315" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">el filtro &quot;arranca&quot; aquí,</text><text x="460" y="335" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">fuera del tramo</text><line x1="820" y1="260" x2="700" y2="260" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="830" y="265" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">causal: cada muestra solo usa las anteriores</text><rect x="40" y="370" width="640" height="120" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="62" y="404" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Por qué causal</text><text x="62" y="433" font-size="15.5" text-anchor="start" fill="#141414">En la demo la señal llega en directo: no hay futuro.</text><text x="62" y="462" font-size="15.5" text-anchor="start" fill="#141414">Así el modelo se entrena con la misma señal que verá allí.</text><rect x="720" y="370" width="640" height="120" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="742" y="402" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">El límite: el segundo 0 del fichero</text><text x="742" y="432" font-size="15.5" text-anchor="start" fill="#141414">Antes del inicio del EDF no se puede leer. Esas ventanas</text><text x="742" y="462" font-size="15.5" text-anchor="start" fill="#141414">se descartan en 03 (DESCARTE_INICIO_FICHERO_S).</text></svg>