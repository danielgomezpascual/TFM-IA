" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="762" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="741" font-size="19" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#e8a0a2">IDEA CLAVE: </tspan><tspan fill="#ffffff">si un modelo sin ver la señal ya separa las clases, la red tiene que mantener su nota en los controles.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>