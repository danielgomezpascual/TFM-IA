<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="469" viewBox="0 0 1400 469" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="469" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">SECCIÓN 6 · EL TRAMO INTERICTAL</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">lejos de cualquier crisis: más de 15 min antes y fuera del margen postictal después</text><text x="40" y="138" font-size="18" text-anchor="start" fill="#141414" font-weight="bold">Por defecto</text><text x="166.3" y="138" font-size="15" text-anchor="start" fill="#8a8a8a" font-style="italic">modelo general, ♦️ focales y 🔷 generalizadas</text><rect x="60" y="160" width="130" height="56" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.2"/><text x="125.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">crisis anterior</text><rect x="190" y="160" width="160" height="56" rx="0" fill="url(#rayado)" stroke="#141414" stroke-width="1.2"/><text x="270.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">margen postictal</text><text x="270.0" y="240" font-size="15.5" text-anchor="middle" fill="#141414" font-weight="bold">5 min</text><rect x="350" y="160" width="200" height="56" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><text x="450.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">libre (no se usa)</text><rect x="550" y="160" width="250" height="56" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.2"/><text x="675.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">⏳ preictal (SOP)</text><text x="675.0" y="240" font-size="15.5" text-anchor="middle" fill="#9b1b1e" font-weight="bold">3 min</text><rect x="800" y="160" width="110" height="56" rx="0" fill="url(#rayado)" stroke="#141414" stroke-width="1.2"/><text x="855.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">SPH</text><text x="855.0" y="240" font-size="15.5" text-anchor="middle" fill="#141414" font-weight="bold">1 min</text><rect x="910" y="160" width="120" height="56" rx="0" fill="#d6d6d6" stroke="#141414" stroke-width="1.2"/><text x="970.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">⚡ crisis</text><rect x="1030" y="160" width="160" height="56" rx="0" fill="url(#rayado)" stroke="#141414" stroke-width="1.2"/><text x="1110.0" y="193.0" font-size="14" text-anchor="middle" fill="#444444">margen postictal</text><text x="1110.0" y="240" font-size="15.5" text-anchor="middle" fill="#141414" font-weight="bold">5 min</text><rect x="1190" y="160" width="150" height="56" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="3"/><text x="1265.0" y="193.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">💤 interictal</text><line x1="350" y1="268" x2="910" y2="268" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)" marker-start="url(#fN)"/><text x="630.0" y="288" font-size="14.5" text-anchor="middle" fill="#141414" font-style="italic">lead-in útil ≥ 4 min  (umbral = preictal + SPH)</text><line x1="800" y1="152" x2="800" y2="224" stroke="#9b1b1e" stroke-width="2.5"/><text x="800" y="146" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="bold">🔔 alarma</text><rect x="40" y="325" width="1320" height="120" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="62" y="357" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Ejemplo: </text><text x="62" y="387" font-size="15.5" text-anchor="start" fill="#141414">fichero de 30 min con una 🟥 fnsz (♦️) del minuto 20 al 21. Se quita del 5 al 20 (antes) y del 21 al 26 (postictal).</text><text x="62" y="417" font-size="15.5" text-anchor="start" fill="#141414">Quedan dos tramos 💤 interictales: del 0 al 5 y del 26 al 30. Los ficheros sin crisis entran enteros.</text></svg>