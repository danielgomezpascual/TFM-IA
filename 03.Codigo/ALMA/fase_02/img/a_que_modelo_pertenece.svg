</defs><rect width="1400" height="560" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">A QUÉ MODELO PERTENECE CADA VENTANA ⏳</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">una ventana vale para un modelo si cae ENTERA dentro de su preictal (minutos antes de la crisis)</text><text x="40" y="144" font-size="15" text-anchor="start" fill="#9b1b1e" font-family="'DejaVu Sans Mono', Consolas, monospace">en_general</text><text x="220" y="144" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">modelo general</text><rect x="360" y="120" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="990.7" y="120" width="172.0" height="34" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="1.5"/><text x="40" y="196" font-size="15" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">en_umbral_2min</text><text x="220" y="196" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">comparación</text><rect x="360" y="172" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="1105.3" y="172" width="57.3" height="34" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><text x="40" y="248" font-size="15" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">en_umbral_10min</text><text x="220" y="248" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">comparación</text><rect x="360" y="224" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="646.7" y="224" width="516.0" height="34" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><text x="40" y="300" font-size="15" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">en_umbral_15min</text><text x="220" y="300" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">comparación</text><rect x="360" y="276" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="360.0" y="276" width="802.7" height="34" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><text x="40" y="352" font-size="15" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">en_modelo_grupo</text><text x="220" y="352" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">🔹 ausencias</text><rect x="360" y="328" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="1162.7" y="328" width="47.8" height="34" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><text x="876.0" y="351" font-size="13" text-anchor="end" fill="#9b1b1e" font-style="italic">de 60 s a 10 s →</text><text x="40" y="404" font-size="15" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">en_test_comun</text><text x="220" y="404" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">solo 🟢 eval</text><rect x="360" y="380" width="860" height="34" rx="0" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/><rect x="1105.3" y="380" width="57.3" height="34" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="1.5"/><rect x="1220" y="110" width="50" height="320" rx="0" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="1245.0" y="276.5" font-size="18" text-anchor="middle" fill="#ffffff">⚡</text><rect x="1036.5" y="108" width="34.4" height="324" rx="0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="6 4"/><text x="1053.7" y="452" font-size="14" text-anchor="middle" fill="#141414" font-weight="bold">una ventana a −3 min</text><text x="360.0" y="476" font-size="13.5" text-anchor="middle" fill="#8a8a8a">−15 min</text><text x="646.7" y="476" font-size="13.5" text-anchor="middle" fill="#8a8a8a">−10 min</text><text x="990.7" y="476" font-size="13.5" text-anchor="middle"