<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="470" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">LA CADENA DE PREPROCESADO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">la misma para todos los tramos y para la demo en directo (tfm_comun/senal/preprocesado.py)</text><rect x="40" y="120" width="196" height="170" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="120" width="196" height="40" rx="0" fill="#141414"/><text x="138.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">1 · EDF</text><text x="138.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">referencia LE o AR</text><text x="138.0" y="226" font-size="14.5" text-anchor="middle" fill="#141414">250-1000 Hz</text><text x="138.0" y="252" font-size="14.5" text-anchor="middle" fill="#141414">20-40 canales</text><rect x="264" y="120" width="196" height="170" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="264" y="120" width="196" height="40" rx="0" fill="#141414"/><text x="362.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">2 · Montaje TCP</text><text x="362.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">22 canales bipolares</text><text x="362.0" y="226" font-size="14.5" text-anchor="middle" fill="#141414">(a 0 si faltan A1/A2)</text><line x1="239" y1="205" x2="261" y2="205" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="488" y="120" width="196" height="170" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="488" y="120" width="196" height="40" rx="0" fill="#141414"/><text x="586.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">3 · µV</text><text x="586.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">V × 10⁶</text><line x1="463" y1="205" x2="485" y2="205" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="712" y="120" width="196" height="170" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="712" y="120" width="196" height="40" rx="0" fill="#141414"/><text x="810.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">4 · Remuestreo</text><text x="810.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">256 Hz</text><text x="810.0" y="226" font-size="14.5" text-anchor="middle" fill="#141414">(con antialiasing)</text><line x1="687" y1="205" x2="709" y2="205" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="936" y="120" width="196" height="170" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="936" y="120" width="196" height="40" rx="0" fill="#141414"/><text x="1034.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">5 · Filtro causal</text><text x="1034.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">paso banda 0,5-40 Hz</text><text x="1034.0" y="226" font-size="14.5" text-anchor="middle" fill="#141414">notch 60 Hz</text><line x1="911" y1="205" x2="933" y2="205" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="1160" y="120" width="196" height="170" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><rect x="1160" y="120" width="196" height="40" rx="0" fill="#9b1b1e"/><text x="1258.0" y="147" font-size="16.5" text-anchor="middle" fill="#ffffff" font-weight="bold">6 · float16</text><text x="1258.0" y="200" font-size="14.5" text-anchor="middle" fill="#141414">un .npy por tramo</text><text x="1258.0" y="226" font-size="14.5" text-anchor="middle" fill="#141414">sin normalizar</text><line x1="1135" y1="205" x2="1157" y2="205" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="40" y="316" width="640" height="124" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="62" y="350" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Por qué en este orden</text><text x="62" y="379" font-size="15.5" text-anchor="start" fill="#141414">· Se remuestrea ANTES de filtrar: el filtro es siempre el mismo,</text><text x="62" y="408" font-size="15.5" text-anchor="start" fill="#141414">  diseñado a 256 Hz, en todos los ficheros y en la demo.</text><rect x="720" y="316" width="640" height="124" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="742" y="348" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">La normalización no va aquí</text><text x="742" y="378" font-size="15.5" text-anchor="start" fill="#141414">La hace el cargador de la Fase 3 en cada ventana: así se</text><text x="742" y="408" font-size="15.5" text-anchor="start" fill="#141414">prueban varias sin repetir los ~20 min de preprocesado.</text></svg>