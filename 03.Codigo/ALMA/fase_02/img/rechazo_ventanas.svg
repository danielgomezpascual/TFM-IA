<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="470" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">QUÉ VENTANAS SE MARCAN COMO RECHAZADAS</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">se marcan (rechazada = True y su motivo), no se borran: la Fase 3 puede probar con y sin ellas</text><rect x="40" y="110" width="420" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="110" width="420" height="40" rx="0" fill="#9b1b1e"/><rect x="40" y="150" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="54" y="137.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">1 · Pico de amplitud</text><text x="60" y="190" font-size="15.5" text-anchor="start" fill="#141414">más de 1.000 µV tras filtrar:</text><text x="60" y="220" font-size="15.5" text-anchor="start" fill="#141414">casi seguro artefacto.</text><text x="60" y="250" font-size="15.5" text-anchor="start" fill="#9b1b1e" font-weight="bold">Igual para 💤 y ⏳; no a las ⚡.</text><rect x="490" y="110" width="420" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="490" y="110" width="420" height="40" rx="0" fill="#141414"/><rect x="490" y="150" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="504" y="137.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">2 · Canales planos</text><text x="510" y="190" font-size="15.5" text-anchor="start" fill="#141414">más de MAX_CANALES_PLANOS</text><text x="510" y="220" font-size="15.5" text-anchor="start" fill="#141414">canales sin señal: electrodo</text><text x="510" y="250" font-size="15.5" text-anchor="start" fill="#141414">suelto o sin contacto.</text><rect x="940" y="110" width="420" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="940" y="110" width="420" height="40" rx="0" fill="#141414"/><rect x="940" y="150" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="954" y="137.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">3 · Inicio del fichero</text><text x="960" y="190" font-size="15.5" text-anchor="start" fill="#141414">primeros DESCARTE_INICIO_</text><text x="960" y="220" font-size="15.5" text-anchor="start" fill="#141414">FICHERO_S segundos: el filtro</text><text x="960" y="250" font-size="15.5" text-anchor="start" fill="#141414">aún arranca (lo vio el 05).</text><rect x="40" y="334" width="1320" height="110" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="62" y="366" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Por qué un umbral común para 💤 y ⏳ (y no uno por clase o por tipo)</text><text x="62" y="396" font-size="15.5" text-anchor="start" fill="#141414">Si cada clase se limpiara distinto, la red podría separarlas por el &quot;techo&quot; de amplitud y no por el EEG: sería un atajo.</text><text x="62" y="426" font-size="15.5" text-anchor="start" fill="#141414">Que cada tipo de crisis llegue a amplitudes distintas importa para clasificarlas (Fase 4), no para decidir qué es artefacto.</text></svg>