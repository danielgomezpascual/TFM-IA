<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">TRES GRUPOS DE VENTANAS, COMO UN ESTUDIANTE</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >la red estudia con unas, se prueba con otras y saca la nota con otras distintas</text><rect x="40" y="105" width="420" height="38" fill="#141414"/><rect x="40" y="143" width="420" height="4" fill="#9b1b1e"/><text x="56" y="131" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">ENTRENAMIENTO</text><circle cx="420" cy="124" r="10" fill="#1f77b4"/><text x="404" y="130" font-size="15" text-anchor="end" fill="#ffffff" font-weight="normal" font-style="normal" >train</text><rect x="40" y="147" width="420" height="270" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="250" y="192" font-size="22" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="italic" >Ejercicios con solución</text><text x="250" y="235" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >la red estudia con ellos</text><text x="250" y="265" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >y corrige sus errores</text><text x="250" y="295" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" ></text><text x="250" y="325" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >mitad preictal, mitad interictal</text><text x="250" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >(equilibrado en F02.04)</text><rect x="490" y="105" width="420" height="38" fill="#141414"/><rect x="490" y="143" width="420" height="4" fill="#9b1b1e"/><text x="506" y="131" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">VALIDACIÓN</text><circle cx="870" cy="124" r="10" fill="#b8860b"/><text x="854" y="130" font-size="15" text-anchor="end" fill="#ffffff" font-weight="normal" font-style="normal" >dev</text><rect x="490" y="147" width="420" height="270" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="700" y="192" font-size="22" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="italic" >Exámenes de prueba</text><text x="700" y="235" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >para decidir cuándo dejar de</text><text x="700" y="265" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >estudiar y qué ajustes van mejor</text><text x="700" y="295" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" ></text><text x="700" y="325" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >proporción real: muchas más</text><text x="700" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >interictales que preictales</text><rect x="940" y="105" width="420" height="38" fill="#141414"/><rect x="940" y="143" width="420" height="4" fill="#9b1b1e"/><text x="956" y="131" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">EVALUACIÓN</text><circle cx="1320" cy="124" r="10" fill="#2ca02c"/><text x="1304" y="130" font-size="15" text-anchor="end" fill="#ffffff" font-weight="normal" font-style="normal" >eval</text><rect x="940" y="147" width="420" height="270" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1150" y="192" font-size="22" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="italic" >El examen final</text><text x="1150" y="235" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >se hace UNA vez, al final:</text><text x="1150" y="265" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >es la nota que irá en la memoria</text><text x="1150" y="295" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" ></text><text x="1150" y="325" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >proporción real, como en</text><text x="1150" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >la vida (y en la demo)</text><line x1="462" y1="280" x2="488" y2="280" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="912" y1="280" x2="938" y2="280" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="940" y="440" width="420" height="150" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="960" y="474" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >+ CONTROLES (sobre el examen final)</text><text x="960" y="504" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >el mismo examen, pero quitando las</text><text x="960" y="526" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >pistas tramposas que encontró F02.05.</text><text x="960" y="548" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >Si la nota se mantiene, la red no</text><text x="960" y="570" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >hacía trampa.</text><line x1="1150" y1="417" x2="1150" y2="440" stroke="#9b1b1e" stroke-width="2"/><rect x="40" y="440" width="870" height="150" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="60" y="476" font-size="20" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Regla de oro: cada PACIENTE está en un solo grupo</text><text x="60" y="510" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >Si un paciente estuviera en los ejercicios y en el examen, la red podría aprobar</text><text x="60" y="534" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >reconociendo al paciente en vez de reconocer la crisis que se acerca: la nota saldría</text><text x="60" y="558" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >inflada. TUSZ ya viene repartido así (train / dev / eval) y el notebook lo comprueba.</text><rect x="40" y="620" width="1320" height="70" fill="#f2f2f2" stroke="#8a8a8a"/><text x="60" y="650" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >En el código cada grupo se llama VISTA:</text><text x="60" y="676" font-size="15" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >entrenamiento · validacion · evaluacion · control_posicion · control_misma_sesion · control_misma_sesion_estricta</text><text x="700.0" y="742" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >En los grupos con pocos pacientes (ausencias, F02.04) la validación es cruzada: se rota qué pacientes hacen de "examen de prueba".</text></svg>