<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">LAS CUATRO COMBINACIONES QUE SE PRUEBAN</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">como con la tensión arterial: una medida suelta, su evolución, lo normal en esa persona… o todo a la vez</text><text x="580.0" y="150" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="1.5">VENTANA SOLA (4 s)</text><text x="1100.0" y="150" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="1.5">CON EL ÚLTIMO MINUTO (hasta 60 s)</text><text x="170" y="277.0" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">SIN COMPARAR</text><text x="170" y="301.0" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">con el paciente</text><text x="170" y="527.0" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">CADA PACIENTE</text><text x="170" y="551.0" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="italic">frente a sí mismo</text><rect x="330" y="170" width="500" height="230" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="354" y="216" font-size="20" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Una medida suelta</text><text x="354" y="266" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">"Tienes 14 de máxima."</text><text x="354" y="300" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">Es la línea base de F03.02.</text><circle cx="788" cy="349.0" r="7" fill="#9b1b1e"/><rect x="850" y="170" width="500" height="230" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="874" y="216" font-size="20" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Su evolución, sin saber lo normal</text><text x="874" y="266" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">"Ha subido en la última media hora."</text><text x="874" y="300" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">Solo contexto (§7, negro).</text><circle cx="1140" cy="356.0" r="7" fill="#141414"/><circle cx="1164" cy="351.0" r="7" fill="#141414"/><circle cx="1188" cy="346.0" r="7" fill="#141414"/><circle cx="1212" cy="341.0" r="7" fill="#141414"/><circle cx="1236" cy="336.0" r="7" fill="#141414"/><circle cx="1260" cy="331.0" r="7" fill="#141414"/><circle cx="1284" cy="326.0" r="7" fill="#141414"/><circle cx="1308" cy="321.0" r="7" fill="#9b1b1e"/><rect x="330" y="420" width="500" height="230" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="354" y="466" font-size="20" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Comparada con lo tuyo, pero suelta</text><text x="354" y="516" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">"Para ti, que sueles tener 11, es alto."</text><text x="354" y="550" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">Solo normalización (§7, 4 s).</text><circle cx="788" cy="599.0" r="7" fill="#9b1b1e"/><line x1="610" y1="599.0" x2="800" y2="599.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6,5"/><text x="800" y="621.0" font-size="12" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">lo normal en él</text><rect x="850" y="420" width="500" height="230" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="3"/><text x="874" y="466" font-size="20" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">Comparada con lo tuyo y su evolución</text><text x="874" y="516" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">"Para ti es alto, y lleva un rato subiendo."</text><text x="874" y="550" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">Las dos palancas juntas (§7, 60 s).</text><circle cx="1140" cy="606.0" r="7" fill="#141414"/><circle cx="1164" cy="601.0" r="7" fill="#141414"/><circle cx="1188" cy="596.0" r="7" fill="#141414"/><circle cx="1212" cy="591.0" r="7" fill="#141414"/><circle cx="1236" cy="586.0" r="7" fill="#141414"/><circle cx="1260" cy="581.0" r="7" fill="#141414"/><circle cx="1284" cy="576.0" r="7" fill="#141414"/><circle cx="1308" cy="571.0" r="7" fill="#9b1b1e"/><line x1="1130" y1="599.0" x2="1320" y2="599.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6,5"/><text x="1320" y="621.0" font-size="12" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">lo normal en él</text><rect x="40" y="670" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="714" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="699" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">La hipótesis de F03.03: solo la casilla roja (las dos cosas juntas) anuncia la crisis</text></svg>