<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">PREENTRENAR SIN ETIQUETAS Y DESPUÉS AJUSTAR</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">F03.07: la red aprende primero &quot;cómo es un EEG&quot; con toda la señal de train, y luego a predecir crisis</text><rect x="60" y="110" width="600" height="56" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="60" y="162" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="360.0" y="143.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Paso 1 · Preentrenar (sin etiquetas)</text><rect x="740" y="110" width="600" height="56" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="740" y="162" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="1040.0" y="143.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Paso 2 · Ajustar a preictal / interictal</text><text x="70" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">señal sin etiquetar de train (también los ~400 pacientes sin crisis)</text><rect x="70" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="102" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="134" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="166" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="198" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="230" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="262" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="294" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="326" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="358" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="390" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="422" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="454" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="486" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="518" y="215" width="28" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="550" y="215" width="28" height="40" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.4"/><rect x="582" y="215" width="28" height="40" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.4"/><rect x="614" y="215" width="28" height="40" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.4"/><text x="310.0" y="280" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">lo que ve: 60 s (15 ventanas)</text><text x="598.0" y="280" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">a predecir: 12 s</text><rect x="90" y="320" width="260" height="110" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="220" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">CODIFICADOR</text><text x="220" y="382" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">proyección + GRU</text><text x="220" y="404" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">(lee la señal)</text><line x1="352" y1="375" x2="400" y2="375" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="405" y="320" width="240" height="110" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2" stroke-dasharray="7 5"/><text x="525" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">DECODIFICADOR</text><text x="525" y="382" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">escribe los 12 s futuros</text><text x="525" y="404" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">(se tira al terminar)</text><line x1="220" y1="260" x2="220" y2="318" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="90" y="495" width="555" height="95" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="110" y="528" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">Pérdida: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">error absoluto medio (MAE) entre lo predicho y lo real.</tspan></text><text x="110" y="558" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">Suelo: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">decir siempre &quot;lo normal del paciente&quot;. Hay que bajar de ahí.</tspan></text><path d="M 220 432 L 220 455 L 705 455 L 705 375 L 746 375" fill="none" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)"/><text x="460" y="478" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">se copian los pesos del codificador</text><text x="750" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">las ventanas etiquetadas de F03.01 (clip de 60 s)</text><rect x="750" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="788" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="826" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="864" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="902" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="940" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="978" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1016" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1054" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1092" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1130" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1168" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1206" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1244" y="215" width="34" height="40" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.4"/><rect x="1282" y="215" width="34" height="40" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.4"/><rect x="750" y="320" width="260" height="110" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="880" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">CODIFICADOR</text><text x="880" y="382" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">parte de lo aprendido:</text><text x="880" y="404" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">libre o congelado</text><line x1="880" y1="260" x2="880" y2="318" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="1012" y1="375" x2="1060" y2="375" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="1065" y="320" width="270" height="110" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1200" y="355" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">CAPA FINAL (nueva)</text><text x="1200" y="382" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">un logit: preictal</text><text x="1200" y="404" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">o interictal</text><rect x="750" y="495" width="585" height="95" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="770" y="528" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#141414">Libre: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">se ajusta toda la red (como Tang).</tspan></text><text x="770" y="558" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#141414">Congelado: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">solo aprende la capa final: ¿sirve tal cual?</tspan></text><rect x="40" y="670" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="710" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="698.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Solo train en los dos pasos: dev y eval no se ven nunca (ni sin etiquetas), para que la nota sea honesta.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>