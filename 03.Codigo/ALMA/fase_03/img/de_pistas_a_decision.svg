<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="600" fill="#ffffff"/><text x="700.0" y="50" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">DE LAS PISTAS A LA DECISIÓN</text><text x="700.0" y="80" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">lo que enseñó F03.02 y por qué la fase siguió por F03.03 antes de la red</text><rect x="40" y="130" width="400" height="50" rx="0" fill="#141414"/><rect x="40" y="176" width="400" height="4" rx="0" fill="#9b1b1e"/><text x="240.0" y="161.6" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">①  Predecir</text><rect x="40" y="180" width="400" height="140" rx="0" fill="#f2f2f2"/><text x="240.0" y="218" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">con 4 s sueltos y 110 números</text><text x="240.0" y="258" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">casi el azar</text><text x="426" y="308" font-size="14" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">§5</text><text x="470" y="239.0" font-size="40" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">+</text><rect x="500" y="130" width="400" height="50" rx="0" fill="#141414"/><rect x="500" y="176" width="400" height="4" rx="0" fill="#9b1b1e"/><text x="700.0" y="161.6" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">②  Detectar</text><rect x="500" y="180" width="400" height="140" rx="0" fill="#f2f2f2"/><text x="700.0" y="218" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">con los MISMOS números y modelos</text><text x="700.0" y="258" font-size="18" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">sí funciona: los datos están bien</text><text x="886" y="308" font-size="14" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">§9</text><text x="930" y="239.0" font-size="40" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">+</text><rect x="960" y="130" width="400" height="50" rx="0" fill="#141414"/><rect x="960" y="176" width="400" height="4" rx="0" fill="#9b1b1e"/><text x="1160.0" y="161.6" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">③  Por paciente</text><rect x="960" y="180" width="400" height="140" rx="0" fill="#f2f2f2"/><text x="1160.0" y="218" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">cada persona tiene su propio "nivel"</text><text x="1160.0" y="258" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">compararla consigo misma puede ayudar</text><text x="1346" y="308" font-size="14" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">§6</text><line x1="700" y1="332" x2="700" y2="378" stroke="#141414" stroke-width="3" marker-end="url(#fN)"/><rect x="240" y="386" width="920" height="84" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="420" font-size="22" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">CONCLUSIÓN: falta INFORMACIÓN, no potencia</text><text x="700" y="450" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="italic">un modelo más complicado con los mismos 4 s no lo arreglaría</text><line x1="700" y1="478" x2="700" y2="514" stroke="#141414" stroke-width="3" marker-end="url(#fN)"/><rect x="40" y="522" width="1320" height="60" rx="0" fill="#141414"/><rect x="40" y="578" width="1320" height="4" rx="0" fill="#9b1b1e"/><text x="700" y="560" font-size="19" text-anchor="middle" xml:space="preserve"><tspan fill="#e6a3a5" font-weight="bold" font-style="normal">F03.03: </tspan><tspan fill="#ffffff" font-weight="normal" font-style="normal">mirar el último minuto (contexto) y comparar a cada paciente consigo mismo  →  después, la red (F03.04)</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>