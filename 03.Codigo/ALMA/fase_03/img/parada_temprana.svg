<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="660" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">PARADA TEMPRANA: CUÁNDO DEJAR DE ENTRENAR</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">se guarda la red de la época con mejor AUC en dev; si en varias épocas no mejora, se para</text><line x1="120" y1="520" x2="960" y2="520" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)"/><line x1="120" y1="520" x2="120" y2="125" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)"/><text x="530.0" y="560" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">épocas (pasadas completas por los datos de train)</text><rect x="465.2631578947368" y="140" width="258.94736842105266" height="380" rx="0" fill="#f2f2f2" stroke="none" stroke-width="0"/><text x="594.7368421052631" y="166" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">paciencia: 6 épocas</text><text x="594.7368421052631" y="188" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">sin mejorar → parar</text><polyline points="120.0,193.5 163.2,224.3 206.3,251.9 249.5,276.6 292.6,298.7 335.8,318.5 378.9,336.2 422.1,352.0 465.3,366.2 508.4,378.9 551.6,390.2 594.7,400.4 637.9,409.4 681.1,417.6 724.2,424.8 767.4,431.4 810.5,437.2 853.7,442.4 896.8,447.1 940.0,451.2" fill="none" stroke="#141414" stroke-width="3"/><polyline points="120.0,373.0 163.2,314.4 206.3,273.4 249.5,244.8 292.6,224.7 335.8,210.7 378.9,200.9 422.1,194.0 465.3,193.6 508.4,197.5 551.6,204.1 594.7,212.7 637.9,222.9 681.1,234.3 724.2,246.9" fill="none" stroke="#9b1b1e" stroke-width="3"/><polyline points="724.2,246.9 767.4,260.4 810.5,274.7 853.7,289.8 896.8,305.6 940.0,322.0" fill="none" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="5,5" stroke-opacity="0.5"/><line x1="465.2631578947368" y1="520" x2="465.2631578947368" y2="140" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="7,5"/><circle cx="465.2631578947368" cy="193.63128203769907" r="9" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="455.2631578947368" y="173.63128203769907" font-size="16" text-anchor="end" fill="#9b1b1e" font-weight="bold" font-style="normal">mejor época: se guarda esta red</text><line x1="724.2105263157895" y1="520" x2="724.2105263157895" y2="140" stroke="#141414" stroke-width="2"/><text x="732.2105263157895" y="508" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">se para aquí</text><text x="145.89473684210526" y="400" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">línea negra: pérdida en train</text><text x="145.89473684210526" y="422" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(sigue bajando)</text><text x="745.7894736842105" y="230.90143004374465" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">AUC en dev</text><rect x="1010" y="120" width="350" height="122" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="1030" y="150" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Al principio</text><text x="1030" y="176" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">las dos mejoran: la red aprende</text><text x="1030" y="198" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">patrones que sirven también</text><text x="1030" y="220" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">en pacientes nuevos.</text><rect x="1010" y="260" width="350" height="122" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="1030" y="290" font-size="18" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">Después</text><text x="1030" y="316" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">train sigue mejorando pero dev</text><text x="1030" y="338" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">no: la red empieza a aprenderse</text><text x="1030" y="360" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">a los pacientes de train.</text><rect x="1010" y="400" width="350" height="122" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="1030" y="430" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Cuidado</text><text x="1030" y="456" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">elegir la época con dev hace su</text><text x="1030" y="478" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">AUC algo optimista: la nota</text><text x="1030" y="500" font-size="15.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">limpia será la de eval.</text><rect x="40" y="590" width="1320" height="40" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><text x="700.0" y="616.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Además: si la AUC de dev no mejora en 2 épocas, la tasa de aprendizaje se reduce a la mitad (pasos más finos cerca del mejor punto).</text></svg>