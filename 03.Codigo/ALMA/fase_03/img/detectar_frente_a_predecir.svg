488" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">La onda casi no cambia respecto a lo normal.</text><text x="64" y="522" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">El cambio es pequeño y distinto en cada persona.</text><text x="64" y="556" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Con una ventana de 4 s sola: casi el azar.</text><text x="64" y="590" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Es la pregunta del TFM: la difícil.</text><rect x="720" y="400" width="640" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="434" width="640" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="736" y="423" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">DETECTAR: ¿es esto la crisis?</text><rect x="720" y="450" width="640" height="170" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="744" y="488" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">La onda cambia muchísimo (amplitud, ritmo).</text><text x="744" y="522" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Se parece bastante entre pacientes.</text><text x="744" y="556" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Con los mismos números: se detecta bien.</text><text x="744" y="590" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Sirve para comprobar que los datos están bien.</text><line x1="826.0" y1="355" x2="360" y2="398" stroke="#141414" stroke-width="1.6" marker-end="url(#fN)"/><line x1="1052.8000000000002" y1="355" x2="1040" y2="398" stroke="#9b1b1e" stroke-width="1.6" marker-end="url(#fR)"/><text x="700" y="668" font-size="16" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">Por eso la comprobación de F03.02 (§9) separa "los datos fallan" de "predecir es difícil".</text></svg>