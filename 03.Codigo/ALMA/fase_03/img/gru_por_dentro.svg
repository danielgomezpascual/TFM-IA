<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="680" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">QUÉ HACE LA GRU EN CADA PASO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">una memoria de 64 números que, ventana a ventana, decide qué conserva y qué reescribe</text><rect x="330" y="150" width="520" height="330" rx="0" fill="#ffffff" stroke="#9b1b1e" stroke-width="2.5"/><text x="590" y="178" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="italic">paso t de la GRU</text><text x="110" y="310" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">memoria</text><text x="110" y="334" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">de antes</text><text x="110" y="358" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">h(t−1)</text><line x1="175" y1="325" x2="328" y2="325" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><text x="590" y="560" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">resumen de la ventana t (lo que da la CNN)  ·  x(t)</text><line x1="590" y1="540" x2="590" y2="483" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="370" y="215" width="200" height="90" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="470" y="245" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">puerta de reinicio  r</text><text x="470" y="270" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿cuánto de la memoria</text><text x="470" y="289" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">uso para leer lo nuevo?</text><rect x="610" y="215" width="200" height="90" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="710" y="245" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">puerta de actualización  z</text><text x="710" y="270" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿cuánto conservo y</text><text x="710" y="289" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">cuánto reescribo?</text><rect x="370" y="340" width="200" height="90" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="470" y="370" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">propuesta nueva  h̃(t)</text><text x="470" y="395" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">lo que apuntaría con</text><text x="470" y="414" font-size="14.5" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">la ventana de ahora</text><rect x="610" y="340" width="200" height="90" rx="0" fill="#141414" stroke="#141414" stroke-width="1.5"/><text x="710" y="372" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">mezcla</text><text x="710" y="400" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">(1 − z)·h(t−1) + z·h̃(t)</text><line x1="470" y1="307" x2="470" y2="338" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="572" y1="385" x2="608" y2="385" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="710" y1="307" x2="710" y2="338" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)"/><line x1="812" y1="385" x2="940" y2="385" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)"/><text x="1010" y="375" font-size="19" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">memoria nueva</text><text x="1010" y="399" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">h(t)</text><text x="1010" y="423" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">→ al paso t+1</text><rect x="1090" y="150" width="280" height="330" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="1230" y="180" font-size="18" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Qué significa z</text><text x="1110" y="220" font-size="17" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">z ≈ 0</text><text x="1110" y="244" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana parecida a las de</text><text x="1110" y="264" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">antes: conserva la memoria</text><text x="1110" y="305" font-size="17" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">z ≈ 1</text><text x="1110" y="329" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">algo cambia: reescribe la</text><text x="1110" y="349" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">memoria con lo nuevo</text><text x="1110" y="390" font-size="17" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">z a medias</text><text x="1110" y="414" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">va acumulando poco a poco</text><text x="1110" y="434" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(una tendencia en el minuto)</text><rect x="40" y="590" width="430" height="46" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="56" y="619" font-size="16" text-anchor="start"><tspan font-weight="bold" font-style="normal" fill="#141414">RNN simple:  </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">sin puertas: lo lejano se olvida</tspan></text><rect x="490" y="590" width="430" height="46" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="506" y="619" font-size="16" text-anchor="start"><tspan font-weight="bold" font-style="normal" fill="#141414">LSTM:  </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">3 puertas + una memoria aparte (más pesada)</tspan></text><rect x="940" y="590" width="430" height="46" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="956" y="619" font-size="16" text-anchor="start"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">GRU:  </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">2 puertas: casi igual que la LSTM, con menos pesos</tspan></text></svg>