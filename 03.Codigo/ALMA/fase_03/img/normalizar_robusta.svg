" width="630" height="4" fill="#9b1b1e"/><text x="746" y="128" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">ROBUSTA (la elegida)</text><rect x="730" y="147" width="630" height="330" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="1045" y="182" font-size="16" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >(valor − mediana) / ancho de la mitad central</text><line x1="750" y1="215" x2="1340" y2="215" stroke="#9b1b1e" stroke-dasharray="6 5"/><text x="1340" y="209" font-size="13" text-anchor="end" fill="#9b1b1e" font-weight="normal" font-style="normal" >recorte +20</text><polyline points="750.0,313.1 753.7,305.3 757.4,299.0 761.1,304.1 764.8,308.6 768.4,305.7 772.1,296.6 775.8,292.3 779.5,288.0 783.2,294.5 786.9,297.9 790.6,314.6 794.2,332.0 797.9,346.8 801.6,353.4 805.3,345.3 809.0,341.6 812.7,335.5 816.4,331.6 820.1,339.0 823.8,340.4 827.4,338.8 831.1,335.4 834.8,325.3 838.5,311.1 842.2,305.2 845.9,286.8 849.6,280.9 853.2,285.6 856.9,297.7 860.6,303.6 864.3,314.9 868.0,307.1 871.7,307.0 875.4,310.1 879.1,316.1 882.8,317.4 886.4,334.3 890.1,344.0 893.8,353.7 897.5,359.4 901.2,354.2 904.9,340.5 908.6,330.4 912.2,324.8 915.9,319.4 919.6,313.5 923.3,323.3 927.0,320.8 930.7,306.6 934.4,300.0 938.1,286.5 941.8,281.6 945.4,285.1 949.1,286.9 952.8,310.8 956.5,322.2 960.2,334.4 963.9,333.0 967.6,336.4 971.2,333.6 974.9,329.5 978.6,339.6 982.3,344.5 986.0,347.5 989.7,359.4 993.4,354.6 997.1,340.3 1000.8,318.0 1004.4,305.2 1008.1,300.6 1011.8,297.1 1015.5,301.7 1019.2,302.6 1022.9,309.5 1026.6,299.7 1030.2,292.5 1033.9,287.8 1037.6,291.1 1041.3,296.0 1045.0,321.0 1048.7,333.8 1052.4,339.4 1056.1,349.0 1059.8,353.2 1063.4,341.1 1067.1,337.7 1070.8,270.2 1074.5,216.0 1078.2,270.2 1081.9,338.0 1085.6,339.3 1089.2,327.7 1092.9,307.1 1096.6,299.6 1100.3,292.0 1104.0,287.2 1107.7,289.2 1111.4,290.9 1115.1,306.3 1118.8,314.7 1122.4,320.0 1126.1,308.8 1129.8,314.9 1133.5,320.4 1137.2,330.4 1140.9,342.8 1144.6,354.1 1148.2,356.4 1151.9,363.5 1155.6,357.7 1159.3,340.0 1163.0,330.0 1166.7,311.7 1170.4,318.3 1174.1,313.6 1177.8,311.5 1181.4,313.9 1185.1,300.4 1188.8,296.6 1192.5,289.9 1196.2,283.0 1199.9,290.4 1203.6,296.1 1207.2,313.0 1210.9,319.6 1214.6,330.2 1218.3,337.7 1222.0,342.1 1225.7,337.0 1229.4,337.0 1233.1,341.5 1236.8,348.1 1240.4,346.7 1244.1,356.9 1247.8,352.1 1251.5,328.9 1255.2,317.1 1258.9,297.5 1262.6,295.6 1266.2,287.8 1269.9,294.2 1273.6,297.6 1277.3,301.1 1281.0,303.0 1284.7,303.8 1288.4,299.1 1292.1,292.3 1295.8,299.9 1299.4,313.4 1303.1,336.4 1306.8,345.8 1310.5,350.8 1314.2,351.8 1317.9,343.1 1321.6,338.4 1325.2,331.1 1328.9,329.1 1332.6,335.7 1336.3,329.2 1340.0,326.1" fill="none" stroke="#141414" stroke-width="1.5"/><text x="1045" y="430" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >el pico apenas mueve la mediana: el resto se</text><text x="1045" y="454" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal" >ve bien; el pico se queda grande y se RECORTA</text><rect x="40" y="500" width="1320" height="160" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="60" y="534" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >media:</text><text x="395" y="534" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >la suma de todos los valores dividida entre cuántos hay. Un solo valor enorme la mueve mucho.</text><text x="60" y="568" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >mediana:</text><text x="395" y="568" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >el valor que queda en el centro al ordenarlos. Un valor enorme casi no la mueve.</text><text x="60" y="602" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >ancho de la mitad central (IQR):</text><text x="395" y="602" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >distancia entre el valor del 25 % y el del 75 %: dónde está la mayoría de la señal.</text><text x="60" y="636" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >recorte (±20):</text><text x="395" y="636" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >lo que pase de 20 "anchos" se deja en 20: el artefacto no desestabiliza a la red.</text><text x="700.0" y="702" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >Señales inventadas para el esquema. La comparación con los datos reales está en la tabla de la §6.</text></svg>