xt><text x="410.0" y="610" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">+ 1 cambio</text><text x="410.0" y="261.99999999999983" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">se queda</text><rect x="530" y="257.99999999999983" width="200" height="302.00000000000017" rx="0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6,4"/><text x="630.0" y="243.99999999999983" font-size="18" text-anchor="middle" fill="#8a8a8a" font-weight="bold" font-style="normal">AUC 0,67</text><text x="630.0" y="588" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">tasa de aprendizaje menor</text><text x="630.0" y="610" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">+ 1 cambio</text><text x="630.0" y="287.99999999999983" font-size="16" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">se descarta</text><rect x="750" y="180.00000000000006" width="200" height="379.99999999999994" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="850.0" y="166.00000000000006" font-size="18" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">AUC 0,70</text><text x="850.0" y="588" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">red más pequeña</text><text x="850.0" y="610" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">+ 1 cambio</text><text x="850.0" y="210.00000000000006" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">se queda</text><rect x="970" y="128.0" width="200" height="432.0" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="1070.0" y="114.0" font-size="18" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">AUC 0,72</text><text x="1070.0" y="588" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">sin secuencias repetidas</text><text x="1070.0" y="610" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">+ 1 cambio</text><text x="1070.0" y="158.0" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">se queda</text><line x1="70" y1="167.00000000000006" x2="1190" y2="167.00000000000006" stroke="#141414" stroke-width="1.5" stroke-dasharray="8,6"/><text x="70" y="159.00000000000006" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">XGBoost de F03.03</text><line x1="60" y1="560" x2="1200" y2="560" stroke="#141414" stroke-width="1.5"/><rect x="1200" y="150" width="170" height="300" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="1285" y="180" font-size="17" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">registro.csv</text><text x="1220" y="215" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">huella  AUC</text><text x="1220" y="245" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">3f9a…  0,66</text><text x="1220" y="275" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">b71c…  0,68</text><text x="1220" y="305" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">0d2e…  0,67</text><text x="1220" y="335" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">a5f0…  0,70</text><text x="1220" y="365" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">…</text><text x="1285" y="410" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">lo ya entrenado</text><text x="1285" y="428" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">no se repite</text><text x="70" y="650" font-size="15.5" text-anchor="start"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">Las cifras son un ejemplo. </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">Un peldaño descartado no se acumula: el siguiente se prueba sobre la mejor red anterior. </tspan><tspan font-weight="normal" font-style="italic" fill="#141414">Ojo: muchas decisiones con dev hacen su AUC algo optimista.</tspan></text></svg>