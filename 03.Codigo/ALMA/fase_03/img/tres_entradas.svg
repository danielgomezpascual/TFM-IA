<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">QUÉ NÚMEROS RECIBE LA RED DE CADA VENTANA DE 4 S</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">las tres entradas de tfm_comun/red/entradas/, lado a lado</text><rect x="60" y="110" width="400" height="70" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="60" y="176" width="400" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="260.0" y="142.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Espectro relativo</text><text x="260.0" y="165.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">F03.04 - F03.05</text><rect x="60" y="180" width="400" height="300" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="84" y="225" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Welch sobre los 4 s (trozos de 1 s)</text><text x="84" y="251" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">40 frecuencias por canal, relativas</text><text x="84" y="277" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(suman 1) y en log10</text><text x="84" y="345" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal" letter-spacing="1.5">NÚMEROS POR VENTANA</text><text x="84" y="380" font-size="26" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">22 × 40 = 880</text><text x="84" y="420" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">un resumen por ventana</text><rect x="500" y="110" width="400" height="70" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="500" y="176" width="400" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="142.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Log-FFT por segundo</text><text x="700.0" y="165.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">F03.06 - F03.08 (Tang)</text><rect x="500" y="180" width="400" height="300" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="524" y="225" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">FFT de cada segundo por separado</text><text x="524" y="251" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">40 Hz por canal, en log10,</text><text x="524" y="277" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">menos el nivel del canal</text><text x="524" y="345" font-size="13" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="1.5">NÚMEROS POR VENTANA</text><text x="524" y="380" font-size="26" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">22 × 4 × 40 = 3.520</text><text x="524" y="420" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">4 pasos por ventana</text><rect x="940" y="110" width="400" height="70" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="940" y="176" width="400" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="1140.0" y="142.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Bandas por segundo</text><text x="1140.0" y="165.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">F03.06 (diagnóstico)</text><rect x="940" y="180" width="400" height="300" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="964" y="225" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">potencia relativa en 5 bandas</text><text x="964" y="251" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(lo que ve XGBoost),</text><text x="964" y="277" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">calculada en cada segundo</text><text x="964" y="345" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal" letter-spacing="1.5">NÚMEROS POR VENTANA</text><text x="964" y="380" font-size="26" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">22 × 4 × 5 = 440</text><text x="964" y="420" font-size="17" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">4 pasos por ventana</text><text x="60" y="530" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">En las tres: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">canales sin señal = NaN (pasan a 0 tras normalizar por paciente) · solo numpy, sin MNE ni PyTorch: sirven igual en la demo.</tspan></text><rect x="40" y="565" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="605" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="593.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Se calcula UNA vez por ventana y se guarda en el almacén: el clip de cada fila son solo índices a esas ventanas.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>