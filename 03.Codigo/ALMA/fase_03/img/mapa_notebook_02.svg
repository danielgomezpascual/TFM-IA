<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="650" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">EL RECORRIDO DEL NOTEBOOK F03.02</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">una línea base sin red neuronal: el suelo que la red de F03.04 tendrá que superar</text><rect x="60" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="104" cy="168" r="26" fill="#141414"/><text x="104" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="148" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Características</text><text x="148" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§3</text><text x="88" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">de cada ventana, 110 números:</text><text x="88" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">cómo se reparte la energía</text><line x1="442" y1="200" x2="508" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="168" r="26" fill="#141414"/><text x="554" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="598" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Entrenar</text><text x="598" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§4</text><text x="538" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">regresión logística y XGBoost,</text><text x="538" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">con y sin el mismo peso por paciente</text><line x1="892" y1="200" x2="958" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="120" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="1004" cy="168" r="26" fill="#141414"/><text x="1004" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><text x="1048" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Medir en dev</text><text x="1048" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§5</text><text x="988" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">AUC-ROC con su intervalo</text><text x="988" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">y curva ROC (sin mirar eval)</text><rect x="60" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="104" cy="378" r="26" fill="#141414"/><text x="104" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="148" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Por paciente</text><text x="148" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§6</text><text x="88" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">¿ordena bien las ventanas</text><text x="88" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">dentro de cada paciente?</text><line x1="442" y1="410" x2="508" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="330" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="378" r="26" fill="#141414"/><text x="554" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="598" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Por grupo</text><text x="598" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§7</text><text x="538" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">focal, generalizada y ausencia:</text><text x="538" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">¿cuál se predice mejor?</text><line x1="892" y1="410" x2="958" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="330" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1004" cy="378" r="26" fill="#141414"/><text x="1004" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text><text x="1048" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Qué ha aprendido</text><text x="1048" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§8</text><text x="988" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">qué bandas y canales usa</text><text x="988" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">para decidir</text><path d="M1270,280 L1270,300 L250,300 L250,328" fill="none" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="60" y="506" width="1280" height="40" fill="#f2f2f2" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="80" y="532" font-size="17" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">§9 · COMPROBACIÓN:</text><text x="250" y="532" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">con los mismos números y modelos, ¿se DETECTA la crisis (ictal frente a interictal)? Si sí, la cadena de datos está bien.</text><rect x="40" y="570" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="614" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="599" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">RESULTADO: la nota que se puede sacar sin red. Todo se decide con dev; eval no se toca.</text></svg>