<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="680" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">EL RECORRIDO DEL NOTEBOOK F03.04</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">la primera red neuronal: lo que decidió F03.03 (60 s y cada paciente frente a sí mismo), aprendido por una red</text><rect x="60" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="104" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="104" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="148" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Qué ventanas</text><text x="148" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§3</text><text x="88" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">las mismas de F03.03: con 60 s</text><text x="88" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">de contexto completo</text><line x1="442" y1="200" x2="508" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="554" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="598" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Qué ve la red</text><text x="598" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§4</text><text x="538" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">el espectro relativo de cada</text><text x="538" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana de 4 s (22 × 40)</text><line x1="892" y1="200" x2="958" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1004" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="1004" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><text x="1048" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Cada paciente</text><text x="1048" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§5</text><text x="988" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">calibración tranquila de F03.03</text><text x="988" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(solo con sus interictales)</text><rect x="60" y="330" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="104" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="104" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="148" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La red</text><text x="148" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§6</text><text x="88" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">CNN para cada ventana</text><text x="88" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">+ GRU para los 60 s</text><line x1="442" y1="410" x2="508" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="554" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="554" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="598" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Entrenar</text><text x="598" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§7</text><text x="538" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">tres variantes, tres semillas,</text><text x="538" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">parada temprana con dev</text><line x1="892" y1="410" x2="958" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="1004" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="1004" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text><text x="1048" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Comparar</text><text x="1048" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§8-§11</text><text x="988" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">con XGBoost de F03.03: global,</text><text x="988" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">por paciente, grupo y sesión</text><path d="M1270,280 L1270,305 L250,305 L250,328" fill="none" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="60" y="506" width="1280" height="44" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="80" y="534" font-size="17" text-anchor="start"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">Se compara siempre con: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">la mejor combinación de F03.03 (XGBoost · 60 s · calibración por paciente), con las MISMAS ventanas de dev.</tspan></text><rect x="40" y="590" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><text x="700.0" y="618.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">La regla de oro de la Fase 3: todo se decide con dev. Eval no se abre hasta la evaluación final de la fase.</text></svg>