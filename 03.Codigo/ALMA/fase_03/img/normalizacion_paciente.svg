4" stroke-width="2"/><circle cx="477.6" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="500.64000000000004" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="531.36" cy="230" r="8" fill="#9b1b1e"/><circle cx="554.4000000000001" cy="230" r="8" fill="#9b1b1e"/><line x1="477.6" y1="208" x2="477.6" y2="252" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="477.6" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">mediana</text><text x="60" y="366" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente B</text><line x1="180" y1="360" x2="660" y2="360" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="252.96" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="276.0" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="299.04" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="314.4" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="337.44" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="368.15999999999997" cy="360" r="8" fill="#9b1b1e"/><circle cx="391.20000000000005" cy="360" r="8" fill="#9b1b1e"/><line x1="314.4" y1="338" x2="314.4" y2="382" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="314.4" y="402" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">mediana</text><text x="60" y="470" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">Las preictales de B quedan por debajo de las interictales de A: un umbral común falla.</text><rect x="720" y="110" width="640" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="144" width="640" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="736" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">DESPUÉS: RESTADA LA MEDIANA DE CADA UNO</text><rect x="720" y="160" width="640" height="330" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="740" y="236" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente A</text><line x1="860" y1="230" x2="1340" y2="230" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="1014.56" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1037.6" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1060.64" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1076.0" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1099.04" cy="230" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1129.76" cy="230" r="8" fill="#9b1b1e"/><circle cx="1152.8000000000002" cy="230" r="8" fill="#9b1b1e"/><line x1="1076.0" y1="208" x2="1076.0" y2="252" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="1076.0" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">mediana</text><text x="740" y="366" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente B</text><line x1="860" y1="360" x2="1340" y2="360" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="1014.56" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1037.6" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1060.64" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1076.0" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1099.04" cy="360" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1129.76" cy="360" r="8" fill="#9b1b1e"/><circle cx="1152.8000000000002" cy="360" r="8" fill="#9b1b1e"/><line x1="1076.0" y1="338" x2="1076.0" y2="382" stroke="#141414" stroke-width="1.5" stroke-dasharray="6,5"/><text x="1076.0" y="402" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">mediana</text><text x="740" y="470" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">Las preictales de los dos quedan a la derecha: un mismo umbral sirve para ambos.</text><circle cx="500" cy="506" r="8" fill="#9b1b1e"/><text x="516" y="511" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana preictal</text><circle cx="700" cy="506" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="716" y="511" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana interictal</text><rect x="40" y="530" width="1320" height="96" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="560" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Dos formas de calcular la mediana de cada paciente (las dos se prueban):</text><text x="60" y="585" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">· por_paciente: con TODAS sus ventanas, sin mirar etiquetas (pero sus preictales también entran en la mediana).</text><text x="60" y="608" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">· por_paciente_calibrado: solo con sus interictales, como una app que graba unos minutos tranquilos; ninguna ventana se calibra consigo misma.</text></svg>