<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">LA CALIBRACIÓN LIMPIA, EN TRES PASOS</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">como una app: al empezar, graba unos minutos tranquilos para saber cómo es "lo normal" en esa persona</text><rect x="40" y="110" width="400" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="144" width="400" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="56" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">1 · RESERVAR</text><rect x="40" y="160" width="400" height="330" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="500" y="110" width="400" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="500" y="144" width="400" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="516" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">2 · CALCULAR SU "NORMAL"</text><rect x="500" y="160" width="400" height="330" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="960" y="110" width="400" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="960" y="144" width="400" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="976" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">3 · COMPARAR TODAS CON ÉL</text><rect x="960" y="160" width="400" height="330" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="60" y="200" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Las ventanas de un paciente, en el orden del tiempo:</text><circle cx="75" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="108" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="141" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="174" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="207" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="240" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="273" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="306" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="339" cy="260" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="372" cy="260" r="8" fill="#9b1b1e"/><circle cx="405" cy="260" r="8" fill="#9b1b1e"/><circle cx="75" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="108" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="141" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="174" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="207" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="240" cy="330" r="8" fill="#9b1b1e"/><circle cx="273" cy="330" r="8" fill="#9b1b1e"/><circle cx="306" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="339" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="372" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="405" cy="330" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><line x1="60" y1="288" x2="425" y2="288" stroke="#8a8a8a" stroke-width="1.2"/><rect x="62" y="238" width="134" height="44" fill="none" stroke="#9b1b1e" stroke-width="2.5" stroke-dasharray="7,5"/><text x="62" y="230" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">las primeras interictales</text><text x="60" y="395" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Se apartan las primeras interictales (2 min).</text><text x="60" y="418" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Son su "calibración": no se entrena ni se</text><text x="60" y="441" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">mide con ellas.</text><text x="60" y="470" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">(nunca más de la mitad de sus interictales)</text><circle cx="620" cy="240" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="660" cy="240" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="700" cy="240" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="740" cy="240" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="600" y="215" width="160" height="50" fill="none" stroke="#9b1b1e" stroke-width="2.5" stroke-dasharray="7,5"/><line x1="700" y1="275" x2="700" y2="325" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="590" y="335" width="220" height="56" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="360" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">su normal</text><text x="700" y="381" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">= la mediana de la reserva</text><text x="520" y="430" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">La mediana es el valor del medio: un</text><text x="520" y="453" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">valor raro no la mueve. Se calcula para</text><text x="520" y="476" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">cada número (banda × canal).</text><rect x="990" y="190" width="150" height="46" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="1065" y="218" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">su normal</text><line x1="1065" y1="236" x2="1065" y2="406" stroke="#8a8a8a" stroke-width="1.5"/><line x1="1065" y1="280" x2="1088" y2="280" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#fN)"/><circle cx="1100" cy="280" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1120" y="285" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal − su normal</text><line x1="1065" y1="322" x2="1088" y2="322" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#fN)"/><circle cx="1100" cy="322" r="8" fill="#9b1b1e"/><text x="1120" y="327" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">preictal − su normal</text><line x1="1065" y1="364" x2="1088" y2="364" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#fN)"/><circle cx="1100" cy="364" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1120" y="369" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal − su normal</text><line x1="1065" y1="406" x2="1088" y2="406" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#fN)"/><circle cx="1100" cy="406" r="8" fill="#9b1b1e"/><text x="1120" y="411" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">preictal − su normal</text><text x="980" y="455" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">La MISMA referencia para todas,</text><text x="980" y="478" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">preictales e interictales por igual.</text><line x1="448" y1="325" x2="492" y2="325" stroke="#9b1b1e" stroke-width="3" marker-end="url(#fR)"/><line x1="908" y1="325" x2="952" y2="325" stroke="#9b1b1e" stroke-width="3" marker-end="url(#fR)"/><circle cx="560" cy="516" r="8" fill="#9b1b1e"/><text x="576" y="521" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana preictal</text><circle cx="760" cy="516" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="776" y="521" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana interictal</text><rect x="40" y="542" width="1320" height="70" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="571" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La clave: para normalizar una ventana no hace falta saber si es preictal o interictal.</text><text x="60" y="596" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Es lo único que se puede hacer de verdad en una app, donde la etiqueta es justo lo que se quiere adivinar.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>