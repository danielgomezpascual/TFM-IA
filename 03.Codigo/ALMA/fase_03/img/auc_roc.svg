<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="815" viewBox="0 0 1400 815" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="815" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">LA NOTA: AUC-ROC</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">se ordenan las ventanas por su puntuación: ¿quedan las preictales por encima de las interictales?</text><rect x="40" y="110" width="1320" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="144" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="56" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">QUÉ MIDE: ELEGIDA UNA PREICTAL Y UNA INTERICTAL AL AZAR, LA PROBABILIDAD DE QUE LA PREICTAL PUNTÚE MÁS</text><text x="60" y="206" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">AZAR · 0,5</text><text x="60" y="228" font-size="14" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">mezcladas: el modelo no sirve</text><line x1="400" y1="200" x2="1320" y2="200" stroke="#8a8a8a" stroke-width="1.5"/><circle cx="510.4" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="657.6" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="786.4" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="906.0" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1044.0" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1182.0" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1274.0" cy="200" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="473.6" cy="200" r="9" fill="#9b1b1e"/><circle cx="584.0" cy="200" r="9" fill="#9b1b1e"/><circle cx="722.0" cy="200" r="9" fill="#9b1b1e"/><circle cx="860.0" cy="200" r="9" fill="#9b1b1e"/><circle cx="970.4" cy="200" r="9" fill="#9b1b1e"/><circle cx="1136.0" cy="200" r="9" fill="#9b1b1e"/><circle cx="1228.0" cy="200" r="9" fill="#9b1b1e"/><text x="60" y="301" font-size="18" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">BUENO · 0,85</text><text x="60" y="323" font-size="14" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">casi siempre la preictal por encima</text><line x1="400" y1="295" x2="1320" y2="295" stroke="#8a8a8a" stroke-width="1.5"/><circle cx="446.0" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="510.4" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="584.0" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="676.0" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="749.6" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="860.0" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="988.8000000000001" cy="295" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="786.4" cy="295" r="9" fill="#9b1b1e"/><circle cx="952.0" cy="295" r="9" fill="#9b1b1e"/><circle cx="1025.6" cy="295" r="9" fill="#9b1b1e"/><circle cx="1117.6" cy="295" r="9" fill="#9b1b1e"/><circle cx="1182.0" cy="295" r="9" fill="#9b1b1e"/><circle cx="1228.0" cy="295" r="9" fill="#9b1b1e"/><circle cx="1283.1999999999998" cy="295" r="9" fill="#9b1b1e"/><text x="60" y="396" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">PERFECTO · 1</text><text x="60" y="418" font-size="14" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">todas las preictales por encima</text><line x1="400" y1="390" x2="1320" y2="390" stroke="#8a8a8a" stroke-width="1.5"/><circle cx="436.8" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="492.0" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="565.6" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="639.2" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="703.6" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="786.4" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="878.4000000000001" cy="390" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="970.4" cy="390" r="9" fill="#9b1b1e"/><circle cx="1044.0" cy="390" r="9" fill="#9b1b1e"/><circle cx="1099.2" cy="390" r="9" fill="#9b1b1e"/><circle cx="1154.4" cy="390" r="9" fill="#9b1b1e"/><circle cx="1209.6" cy="390" r="9" fill="#9b1b1e"/><circle cx="1255.6" cy="390" r="9" fill="#9b1b1e"/><circle cx="1292.4" cy="390" r="9" fill="#9b1b1e"/><text x="400" y="488" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="normal">0 · seguro interictal</text><text x="1320" y="488" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">seguro preictal · 1</text><circle cx="560" cy="520" r="9" fill="#9b1b1e"/><text x="578" y="526" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana preictal</text><circle cx="780" cy="520" r="9" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="798" y="526" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana interictal</text><text x="1000" y="526" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">No depende de cuántas haya de cada clase.</text><rect x="40" y="560" width="1320" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="594" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="56" y="583" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">POR QUÉ TAMBIÉN POR PACIENTE: LA NOTA GLOBAL PUEDE ENGAÑAR</text><text x="60" y="632" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente A</text><text x="60" y="650" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">muchas crisis: casi todo preictal</text><line x1="400" y1="630" x2="1320" y2="630" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="1007.2" cy="630" r="8" fill="#9b1b1e"/><circle cx="1048.6" cy="630" r="8" fill="#9b1b1e"/><circle cx="1090.0" cy="630" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1131.4" cy="630" r="8" fill="#9b1b1e"/><circle cx="1172.8000000000002" cy="630" r="8" fill="#9b1b1e"/><circle cx="1214.2" cy="630" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1255.6" cy="630" r="8" fill="#9b1b1e"/><text x="1131.4" y="658" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="italic">mezcladas dentro del paciente → AUC 0,5</text><text x="60" y="694" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente B</text><text x="60" y="712" font-size="13" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">pocas crisis: casi todo interictal</text><line x1="400" y1="692" x2="1320" y2="692" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="436.8" cy="692" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="478.2" cy="692" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="519.6" cy="692" r="8" fill="#9b1b1e"/><circle cx="561.0" cy="692" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="602.4" cy="692" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="643.8" cy="692" r="8" fill="#9b1b1e"/><circle cx="685.2" cy="692" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="561.0" y="720" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="italic">mezcladas dentro del paciente → AUC 0,5</text><text x="60" y="770" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">Juntando los dos, casi todas las preictales (de A) quedan por encima de casi todas las interictales (de B): la AUC global sale alta.</text><text x="60" y="792" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">Pero dentro de cada paciente el modelo no distingue nada: solo ha aprendido a reconocer al paciente. La AUC por paciente lo destapa.</text></svg>