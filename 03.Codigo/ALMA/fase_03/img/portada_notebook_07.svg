a preictal / interictal</text><text x="492" y="556.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">con y sin preentrenar</text><rect x="420" y="586" width="560" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="456" cy="621.0" r="20" fill="#141414"/><text x="456" y="628.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="492" y="616.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Comparar en dev</text><text x="492" y="640.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">diferencia emparejada</text><line x1="366" y1="453.0" x2="412" y2="453.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="988" y1="453.0" x2="1034" y2="453.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="40" y="696" width="1320" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="756" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="735" font-size="19" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#e8a0a2">IDEA CLAVE: </tspan><tspan fill="#ffffff">si preentrenar no cambia la nota, lo que falta no es saber cómo es un EEG.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>