<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="620" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">DATASET Y DATALOADER: LAS DOS PIEZAS DE PYTORCH</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >un almacén que sabe dar cada ventana y un repartidor que las lleva a la red en lotes</text><rect x="40" y="105" width="400" height="34" fill="#141414"/><rect x="40" y="139" width="400" height="4" fill="#9b1b1e"/><text x="56" y="128" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">DATASET = EL ALMACÉN</text><rect x="40" y="147" width="400" height="300" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="70" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="93" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >0</text><rect x="70" y="220" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="93" y="244" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >6</text><rect x="70" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="93" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >12</text><rect x="70" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="93" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >18</text><rect x="128" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="151" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >1</text><rect x="128" y="220" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="151" y="244" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >7</text><rect x="128" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="151" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >13</text><rect x="128" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="151" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >19</text><rect x="186" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="209" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >2</text><rect x="186" y="220" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="209" y="244" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >8</text><rect x="186" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="209" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >14</text><rect x="186" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="209" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >20</text><rect x="244" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="267" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >3</text><rect x="244" y="220" width="46" height="38" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="267" y="244" font-size="13" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="normal" >9</text><rect x="244" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="267" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >15</text><rect x="244" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="267" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >21</text><rect x="302" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="325" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >4</text><rect x="302" y="220" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="325" y="244" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >10</text><rect x="302" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="325" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >16</text><rect x="302" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="325" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >22</text><rect x="360" y="170" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="383" y="194" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >5</text><rect x="360" y="220" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="383" y="244" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >11</text><rect x="360" y="270" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="383" y="294" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >17</text><rect x="360" y="320" width="46" height="38" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="383" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal" >23</text><text x="240" y="395" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="italic" >"dame la ventana 9" →</text><text x="240" y="420" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >la saca del paquete con su respuesta (1 o 0)</text><text x="240" y="475" font-size="16" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >VentanasEEG</text><line x1="442" y1="300" x2="498" y2="300" stroke="#141414" stroke-width="3" marker-end="url(#fN)"/><rect x="500" y="105" width="400" height="34" fill="#141414"/><rect x="500" y="139" width="400" height="4" fill="#9b1b1e"/><text x="516" y="128" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">DATALOADER = EL REPARTIDOR</text><rect x="500" y="147" width="400" height="300" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="525" y="190" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >1. elige 64 ventanas</text><text x="525" y="224" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >    (al azar si es para estudiar)</text><text x="525" y="258" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >2. las prepara (PrepararLote):</text><text x="525" y="292" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >    · misma escala (§6)</text><text x="525" y="326" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >    · recorta picos</text><text x="525" y="360" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >    · refleja algunas (§7, solo al estudiar)</text><text x="525" y="394" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >3. se las da a la red</text><text x="700" y="475" font-size="16" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >crear_cargador + PrepararLote</text><line x1="902" y1="300" x2="958" y2="300" stroke="#141414" stroke-width="3" marker-end="url(#fN)"/><rect x="960" y="105" width="400" height="34" fill="#141414"/><rect x="960" y="139" width="400" height="4" fill="#9b1b1e"/><text x="976" y="128" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">LA RED</text><rect x="960" y="147" width="400" height="300" fill="#141414"/><text x="1160" y="260" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >64 ventanas</text><text x="1160" y="292" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal" >+ sus 64 respuestas</text><text x="1160" y="350" font-size="16" text-anchor="middle" fill="#cccccc" font-weight="normal" font-style="italic" >aprende de ellas y pide el lote siguiente</text><rect x="40" y="500" width="1320" height="70" fill="#f2f2f2" stroke="#8a8a8a"/><text x="700" y="530" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >Para validar y evaluar, el repartidor NO baraja ni refleja: entrega las ventanas en orden,</text><text x="700" y="556" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" >para poder saber después de qué paciente y de qué crisis era cada predicción.</text></svg>