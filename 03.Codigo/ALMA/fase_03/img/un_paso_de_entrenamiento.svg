<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="600" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">UN PASO DE ENTRENAMIENTO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">lo que hace entrenar_red con cada lote de 128 filas (tfm_comun/red/entreno/entrenar_red.py)</text><rect x="40" y="140" width="172" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="126" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="126" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="126" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Lote</text><text x="126" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">128 filas en el</text><text x="126" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">orden de la época</text><line x1="214" y1="220" x2="230" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="232" y="140" width="172" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="318" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="318" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="318" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Aumentos</text><text x="318" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">reflejo, apagar</text><text x="318" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">canales, tapar Hz</text><line x1="406" y1="220" x2="422" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="424" y="140" width="172" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="510" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="510" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><text x="510" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">La red</text><text x="510" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">da un logit</text><text x="510" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">por fila</text><line x1="598" y1="220" x2="614" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="616" y="140" width="172" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="702" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="702" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="702" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Pérdida</text><text x="702" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">entropía cruzada:</text><text x="702" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿cuánto falla?</text><line x1="790" y1="220" x2="806" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="808" y="140" width="172" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="894" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="894" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="894" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Gradientes</text><text x="894" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">backward: hacia</text><text x="894" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">dónde mover</text><line x1="982" y1="220" x2="998" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="1000" y="140" width="172" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1086" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="1086" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text><text x="1086" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Recorte</text><text x="1086" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">ningún paso</text><text x="1086" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">más largo que 5</text><line x1="1174" y1="220" x2="1190" y2="220" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="1192" y="140" width="172" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="1278" cy="140" r="22" fill="#141414" stroke="none" stroke-width="0"/><text x="1278" y="147" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">7</text><text x="1278" y="205" font-size="20" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">Optimizador</text><text x="1278" y="240" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">AdamW mueve</text><text x="1278" y="261" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">un poco los pesos</text><path d="M 1290 302 L 1290 360 L 126 360 L 126 302" fill="none" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)" stroke-dasharray="6 5"/><text x="700" y="352" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="italic">siguiente lote (una época = todos los lotes)</text><rect x="40" y="395" width="1320" height="110" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2" stroke-dasharray="7 5"/><text x="60" y="430" font-size="17" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">Cada cuarto de época (o cada época): </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">se mide la AUC en dev con puntuar_red (sin dropout ni gradientes).</tspan></text><text x="60" y="462" font-size="17" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#141414">ParadaTemprana </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">guarda los pesos si es la mejor medida y avisa de parar tras &quot;paciencia&quot; medidas sin mejorar.</tspan></text><text x="60" y="492" font-size="17" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#141414">Punto de control: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">al final de cada época, todo se guarda en disco para poder seguir si se corta.</tspan></text><rect x="40" y="530" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="570" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="558.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Al terminar, la red se queda con los pesos de la MEJOR medida, no con los de la última.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>