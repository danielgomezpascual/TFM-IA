ormal" letter-spacing="1.5">UN PICO SUELTO</text><rect x="940" y="160" width="420" height="330" fill="#ffffff" stroke="#141414" stroke-width="2"/><line x1="1010" y1="400" x2="1320" y2="400" stroke="#8a8a8a" stroke-width="1.2"/><line x1="1010" y1="400" x2="1010" y2="200" stroke="#8a8a8a" stroke-width="1.2"/><text x="1002" y="365.0" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">0,5</text><text x="1002" y="285.0" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">0,6</text><text x="1002" y="205.00000000000006" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">0,7</text><line x1="1010" y1="360.0" x2="1320" y2="360.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3,4"/><text x="1320" y="354.0" font-size="12" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="italic">azar</text><text x="1030" y="420" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">4 s</text><text x="1097" y="420" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">8 s</text><text x="1164" y="420" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">16 s</text><text x="1231" y="420" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">32 s</text><text x="1298" y="420" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">60 s</text><polyline points="1030,344.0 1097,352.0 1164,264.0 1231,360.0 1298,344.0" fill="none" stroke="#141414" stroke-width="3"/><circle cx="1030" cy="344.0" r="5" fill="#141414"/><circle cx="1097" cy="352.0" r="5" fill="#141414"/><circle cx="1164" cy="264.0" r="5" fill="#141414"/><circle cx="1231" cy="360.0" r="5" fill="#141414"/><circle cx="1298" cy="344.0" r="5" fill="#141414"/><text x="1150" y="460" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">probablemente casualidad</text><rect x="40" y="505" width="1320" height="40" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="531" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Además, la banda sombreada (el intervalo) tiene que quedar por ENCIMA del 0,5: si lo toca, la mejora puede ser suerte.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>