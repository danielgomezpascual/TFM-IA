<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="680" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">EL RECORRIDO DEL NOTEBOOK F03.08</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">la red completa de Tang: una memoria por electrodo que escucha a sus vecinos en un grafo</text><rect x="60" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="104" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="104" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="148" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Los datos</text><text x="148" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§3</text><text x="88" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">los mismos que F03.06: clip de</text><text x="88" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">60 s y log-FFT de cada segundo</text><line x1="442" y1="200" x2="508" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="554" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="598" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">El grafo</text><text x="598" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§4</text><text x="538" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">en cada clip, cada canal se une</text><text x="538" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">a sus 3 canales más parecidos</text><line x1="892" y1="200" x2="958" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="120" width="380" height="160" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1004" cy="168" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="1004" y="175" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><text x="1048" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Las variantes</text><text x="1048" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§5</text><text x="988" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">la DCRNN con 60 s y con 12 s</text><text x="988" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">(los dos clips de Tang)</text><rect x="60" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="104" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="104" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="148" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Entrenar</text><text x="148" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§6</text><text x="88" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">con puntos de control:</text><text x="88" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">si se corta, sigue donde iba</text><line x1="442" y1="410" x2="508" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="554" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="554" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="598" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La nota</text><text x="598" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§7</text><text x="538" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">frente a XGBoost y a las redes</text><text x="538" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">anteriores (F03.06 y F03.05)</text><line x1="892" y1="410" x2="958" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="330" width="380" height="160" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="1004" cy="378" r="26" fill="#141414" stroke="none" stroke-width="0"/><text x="1004" y="385" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text><text x="1048" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Controles</text><text x="1048" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">§8</text><text x="988" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">por paciente, por grupo de inicio</text><text x="988" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">y control de sesión</text><path d="M 1270 282 L 1270 305 L 250 305 L 250 328" fill="none" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="60" y="505" width="1280" height="46" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2" stroke-dasharray="7 5"/><text x="80" y="534" font-size="17" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">La DCRNN gasta más memoria: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">LOTE_EVALUACION mide la validación en lotes más pequeños (no cambia el resultado).</tspan></text><rect x="40" y="590" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="630" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="618.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Regla acordada: si no supera a XGBoost dentro del paciente, la Fase 3 se cierra con XGBoost.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>