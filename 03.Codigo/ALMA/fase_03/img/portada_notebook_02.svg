<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="796" viewBox="0 0 1400 796" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="796" fill="#ffffff"/><text x="700.0" y="50" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">F03.02 · LÍNEA BASE</text><text x="700.0" y="80" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">lo que se consigue sin red neuronal</text><rect x="40" y="108" width="1320" height="76" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="134" font-size="13" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="2">LA PREGUNTA DE ESTE NOTEBOOK</text><text x="700" y="168" font-size="24" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿Cuánto se predice con una ventana de 4 s y modelos clásicos?</text><text x="40" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE ENTRA</text><rect x="40" y="235" width="320" height="3" rx="0" fill="#9b1b1e"/><text x="420" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE HACE</text><rect x="420" y="235" width="560" height="3" rx="0" fill="#9b1b1e"/><text x="1040" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE SALE</text><rect x="1040" y="235" width="320" height="3" rx="0" fill="#9b1b1e"/><rect x="40" y="250" width="320" height="196.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="330.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F03.01 · los paquetes</text><text x="60" y="356.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventanas de 4 s de</text><text x="60" y="380.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">train y dev</text><rect x="40" y="460.0" width="320" height="196.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="540.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Regla de la fase</text><text x="60" y="566.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">eval no se mira:</text><text x="60" y="590.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">se usa una vez, al final</text><rect x="1040" y="250" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="330.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La nota suelo</text><text x="1060" y="356.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">lo que la red tiene que</text><text x="1060" y="380.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">superar (F03.04)</text><rect x="1040" y="460.0" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="540.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Modelos y puntuaciones</text><text x="1060" y="566.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">para comparar ventana</text><text x="1060" y="590.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">a ventana con la red</text><rect x="420" y="250" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="285.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="292.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="492" y="280" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">De cada ventana, 110 números</text><text x="492" y="304" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">qué parte de la energía cae en cada banda y canal (§3)</text><line x1="456" y1="306.0" x2="456" y2="333" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="420" y="334" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="369.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="376.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="492" y="364" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Dos modelos clásicos</text><text x="492" y="388" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">regresión logística y XGBoost, entrenados con train (§4)</text><line x1="456" y1="390.0" x2="456" y2="417" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="420" y="418" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="453.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="460.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><text x="492" y="448" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La nota en dev</text><text x="492" y="472" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">global, por paciente y por grupo de crisis (§5-§7)</text><line x1="456" y1="474.0" x2="456" y2="501" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="420" y="502" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="537.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="544.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="492" y="532" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Qué ha aprendido</text><text x="492" y="556" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">qué bandas y canales usa cada modelo (§8)</text><line x1="456" y1="558.0" x2="456" y2="585" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="420" y="586" width="560" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="456" cy="621.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="628.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><text x="492" y="616" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La comprobación</text><text x="492" y="640" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">con los mismos números, ¿se DETECTA la crisis? (§9)</text><line x1="366" y1="453.0" x2="412" y2="453.0" stroke="#141414" stroke-width="2.5" marker-end="url(#fN)"/><line x1="988" y1="453.0" x2="1032" y2="453.0" stroke="#141414" stroke-width="2.5" marker-end="url(#fN)"/><rect x="40" y="696" width="1320" height="64" rx="0" fill="#141414"/><rect x="40" y="756" width="1320" height="4" rx="0" fill="#9b1b1e"/><text x="700" y="735" font-size="19" text-anchor="middle" xml:space="preserve"><tspan fill="#e6a3a5" font-weight="bold" font-style="normal">IDEA CLAVE: </tspan><tspan fill="#ffffff" font-weight="normal" font-style="normal">la crisis se DETECTA con estos números, pero NO se PREDICE con 4 s sueltos: falta información.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>