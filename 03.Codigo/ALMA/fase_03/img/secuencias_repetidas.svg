<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="700" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">POR QUÉ LA RED SE APRENDE LAS SECUENCIAS DE MEMORIA</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">dos filas preictales seguidas comparten 14 de sus 15 ventanas: para la red son casi el mismo ejemplo</text><text x="90" y="150" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Un tramo preictal: una ventana empieza cada 2 s (las de 4 s se solapan a la mitad)</text><rect x="90" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="124" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="158" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="192" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="226" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="260" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="294" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="328" 