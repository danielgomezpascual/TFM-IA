141414" stroke-width="1"/><rect x="1008" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1042" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1076" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1110" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1144" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1178" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1212" y="170" width="31" height="26" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="90" y="220" width="1017" height="22" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="98" y="237" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">fila A: sus 60 s</text><rect x="124" y="260" width="1017" height="22" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="132" y="277" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">fila B (2 s después)</text><rect x="158" y="300" width="1017" height="22" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="166" y="317" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">fila C (4 s después)</text><text x="1212" y="280" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">casi todo</text><text x="1212" y="300" font-size="16" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">compartido</text><rect x="60" y="360" width="620" height="200" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="60" y="360" width="620" height="40" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="60" y="400" width="620" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="370.0" y="387.0" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Lo que pasa ahora (F03.04)</text><text x="80" y="440" font-size="16.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">En cada época la red ve muchas veces casi la misma</text><text x="80" y="466" font-size="16.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">secuencia de cada crisis de train. Aprende rápido</text><text x="80" y="492" font-size="16.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">"esta secuencia es de un preictal" en vez de la regla:</text><text x="80" y="518" font-size="16.5" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">la pérdida de train cae casi a 0 y la AUC de dev baja.</text><rect x="720" y="360" width="620" height="200" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><rect x="720" y="360" width="620" height="40" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="400" width="620" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="1030.0" y="387.0" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">El cambio (peldaño "sin secuencias repetidas")</text><rect x="750" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="784" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="818" y="425" width="31" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><rect x="852" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="886" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="920" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="954" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="988" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1022" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1056" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1090" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1124" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1158" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1192" y="425" width="31" height="22" rx="0" fill="#9b1b1e" stroke="#141414" stroke-width="1"/><rect x="1226" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="1260" y="425" width="31" height="22" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1"/><rect x="747" y="420" width="275" height="32" rx="0" fill="none" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="5,4"/><rect x="1019" y="420" width="275" height="32" rx="0" fill="none" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="5,4"/><text x="750" y="475" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">trozos de 16 s: en cada época entra UNA fila de cada trozo,</text><text x="750" y="499" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">sorteada (otra en la época siguiente). Las clases se</text><text x="750" y="523" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">equilibran en la pérdida porque quedan más interictales.</text><rect x="40" y="600" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><text x="700.0" y="628.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">No se pierden datos: a lo largo de las épocas la red ve todas las filas, pero nunca dos casi iguales en la misma época.</text></svg>