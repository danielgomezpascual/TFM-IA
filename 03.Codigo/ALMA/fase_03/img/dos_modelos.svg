<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="720" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">LOS DOS MODELOS DE LA LÍNEA BASE</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">los mismos 110 números entran en los dos; cada uno los combina a su manera</text><rect x="40" y="110" width="640" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="144" width="640" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="56" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">REGRESIÓN LOGÍSTICA: UNA SUMA CON PESOS</text><rect x="40" y="160" width="640" height="380" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="60" y="192" width="160" height="32" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="140" y="214" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">FP1-F7 · delta</text><line x1="222" y1="210" x2="352" y2="340" stroke="#9b1b1e" stroke-width="1.6"/><text x="228" y="202" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">× +0,8</text><rect x="60" y="254" width="160" height="32" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="140" y="276" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">T3-T5 · theta</text><line x1="222" y1="272" x2="352" y2="340" stroke="#9b1b1e" stroke-width="1.6"/><text x="228" y="264" font-size="14" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">× +0,3</text><rect x="60" y="316" width="160" height="32" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="140" y="338" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">T5-O1 · alfa</text><line x1="222" y1="334" x2="352" y2="340" stroke="#141414" stroke-width="1.6"/><text x="228" y="326" font-size="14" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">× −0,6</text><text x="140" y="401" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">… 110 números</text><rect x="60" y="440" width="160" height="32" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="140" y="462" font-size="14" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">P4-O2 · gamma</text><line x1="222" y1="458" x2="352" y2="340" stroke="#141414" stroke-width="1.6"/><text x="228" y="484" font-size="14" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">× −0,1</text><circle cx="380" cy="340" r="30" fill="#ffffff" stroke="#141414" stroke-width="2.5"/><text x="380" y="350" font-size="28" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">Σ</text><line x1="412" y1="340" x2="462" y2="340" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><polyline points="470.0,399.2 472.5,399.0 475.1,398.9 477.6,398.7 480.2,398.4 482.7,398.1 485.3,397.8 487.8,397.4 490.3,396.9 492.9,396.4 495.4,395.8 498.0,395.0 500.5,394.1 503.1,393.1 505.6,391.9 508.1,390.5 510.7,388.9 513.2,387.1 515.8,385.0 518.3,382.7 520.8,380.0 523.4,377.0 525.9,373.7 528.5,370.1 531.0,366.1 533.6,361.8 536.1,357.3 538.6,352.5 541.2,347.6 543.7,342.5 546.3,337.5 548.8,332.4 551.4,327.5 553.9,322.7 556.4,318.2 559.0,313.9 561.5,309.9 564.1,306.3 566.6,303.0 569.2,300.0 571.7,297.3 574.2,295.0 576.8,292.9 579.3,291.1 581.9,289.5 584.4,288.1 586.9,286.9 589.5,285.9 592.0,285.0 594.6,284.2 597.1,283.6 599.7,283.1 602.2,282.6 604.7,282.2 607.3,281.9 609.8,281.6 612.4,281.3 614.9,281.1 617.5,281.0 620.0,280.8" fill="none" stroke="#9b1b1e" stroke-width="2.6"/><line x1="470" y1="400" x2="620" y2="400" stroke="#8a8a8a" stroke-width="1.2"/><text x="545" y="422" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">curva en S</text><text x="630" y="300" font-size="22" text-anchor="end" fill="#9b1b1e" font-weight="bold" font-style="normal">0,73</text><text x="60" y="500" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Peso positivo: empuja hacia preictal. Negativo: hacia interictal.</text><text x="60" y="524" font-size="16" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">Sencilla y explicable: un número por característica.</text><rect x="720" y="110" width="640" height="34" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="144" width="640" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="736" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">XGBOOST: MUCHOS ÁRBOLES QUE SE CORRIGEN</text><rect x="720" y="160" width="640" height="380" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="755" y="200" width="170" height="40" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="840" y="225" font-size="13" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿delta FP1-F7 &gt; −0,4?</text><line x1="840" y1="240" x2="785" y2="292" stroke="#141414" stroke-width="1.4"/><rect x="755" y="292" width="60" height="30" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="785" y="313" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">+0,3</text><line x1="840" y1="240" x2="895" y2="292" stroke="#141414" stroke-width="1.4"/><rect x="865" y="292" width="60" height="30" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="895" y="313" font-size="14" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">−0,1</text><text x="790" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">sí</text><text x="890" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">no</text><rect x="955" y="200" width="170" height="40" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.5"/><text x="1040" y="225" font-size="13" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿alfa O1 &lt; −0,9?</text><line x1="1040" y1="240" x2="985" y2="292" stroke="#141414" stroke-width="1.4"/><rect x="955" y="292" width="60" height="30" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.5"/><text x="985" y="313" font-size="14" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">+0,2</text><line x1="1040" y1="240" x2="1095" y2="292" stroke="#141414" stroke-width="1.4"/><rect x="1065" y="292" width="60" height="30" rx="0" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><text x="1095" y="313" font-size="14" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">−0,2</text><text x="990" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">sí</text><text x="1090" y="272" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">no</text><text x="1170" y="260" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">+ … 300 árboles</text><text x="1040" y="375" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">cada árbol corrige lo que fallaron los anteriores</text><text x="940" y="420" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">suma de las hojas → curva en S →</text><text x="1180" y="420" font-size="22" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">0,81</text><text x="740" y="500" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Ve combinaciones ("mucha delta Y poca alfa") que la logística no ve.</text><text x="740" y="524" font-size="16" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">El mejor clásico en TUSZ (Roy 2020), por encima de sus redes.</text><rect x="40" y="570" width="1320" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="600" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Cada modelo se entrena dos veces: con todas las ventanas pesando igual, y con "mismo peso por paciente"</text><text x="60" y="626" font-size="16" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic">(cada ventana pesa 1 / ventanas de su paciente: un paciente con 30 crisis cuenta lo mismo que uno con 1, ver F03.01 §3.1).</text><rect x="40" y="660" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="704" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="689" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Sale una puntuación entre 0 y 1 por ventana: más alta = más probable preictal</text></svg>