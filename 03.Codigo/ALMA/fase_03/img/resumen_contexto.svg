l">24</text><text x="285" y="515" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">variación</text><text x="285" y="543" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">0</text><text x="490" y="515" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">cambio</text><text x="490" y="543" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">0</text><text x="60" y="590" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">Lo de ahora es como lo de antes.</text><rect x="720" y="110" width="640" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="144" width="640" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="736" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">ALGO SE ESTÁ MOVIENDO</text><rect x="720" y="160" width="640" height="400" fill="#ffffff" stroke="#141414" stroke-width="2"/><line x1="800" y1="450" x2="1240" y2="450" stroke="#8a8a8a" stroke-width="1.2"/><line x1="800" y1="450" x2="800" y2="230" stroke="#8a8a8a" stroke-width="1.2"/><text x="790" y="455.0" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">15</text><text x="790" y="381.6666666666667" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">20</text><text x="790" y="308.33333333333337" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">25</text><text x="790" y="235.0" font-size="13" text-anchor="end" fill="#8a8a8a" font-weight="normal" font-style="normal">30</text><rect x="825" y="391.3333333333333" width="70" height="58.666666666666686" fill="#f7e8e8" stroke="#141414" stroke-width="1.5"/><text x="860" y="383.3333333333333" font-size="15" text-anchor="middle" fill="#141414" font-weight="b