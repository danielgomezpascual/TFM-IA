e" font-weight="bold" font-style="normal">3,8</text><text x="1170" y="515" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">cambio</text><text x="1170" y="543" font-size="22" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">+5</text><text x="740" y="590" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">La media es la misma (24), pero la variación y el cambio</text><text x="740" y="612" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">delatan que el número va subiendo.</text><rect x="40" y="640" width="1320" height="46" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="670" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">Se hace para los 110 números de cada ventana → 3 × 110 = 330 números. Con 4 s (una ventana sola) quedan los 110 de siempre.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>