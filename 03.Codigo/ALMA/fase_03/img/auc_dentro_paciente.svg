<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="700" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">AUC GLOBAL FRENTE A AUC DENTRO DEL PACIENTE</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">la global compara ventanas de pacientes distintos; la de dentro, solo de la misma persona</text><rect x="60" y="110" width="600" height="40" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="60" y="150" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="360.0" y="137.0" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">AUC global</text><text x="360" y="180" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">todas las preictales contra todas las interictales</text><text x="70" y="256" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente A</text><line x1="180" y1="250" x2="640" y2="250" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="440" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="510" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="580" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="475" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="545" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="615" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="70" y="376" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente B</text><line x1="180" y1="370" x2="640" y2="370" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="220" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="290" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="360" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="255" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="325" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="395" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="410" y="500" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">puntuación del modelo →</text><path d="M475,262 L290,358" fill="none" stroke="#9b1b1e" stroke-width="1.5" stroke-dasharray="4,4"/><path d="M545,262 L360,358" fill="none" stroke="#9b1b1e" stroke-width="1.5" stroke-dasharray="4,4"/><text x="360" y="540" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">También se comparan preictales de A con interictales de B:</text><text x="360" y="564" font-size="16" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">casi siempre gana A, que puntúa alto en todo → AUC global más alta</text><rect x="740" y="110" width="600" height="40" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="740" y="150" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="1040.0" y="137.0" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">AUC dentro del paciente</text><text x="1040" y="180" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">solo preictales e interictales del mismo paciente</text><text x="750" y="256" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente A</text><line x1="860" y1="250" x2="1320" y2="250" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="1120" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1190" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1260" cy="250" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1155" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="1225" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="1295" cy="250" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="750" y="376" font-size="17" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">paciente B</text><line x1="860" y1="370" x2="1320" y2="370" stroke="#8a8a8a" stroke-width="1.2"/><circle cx="900" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="970" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1040" cy="370" r="11" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="935" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="1005" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><circle cx="1075" cy="370" r="11" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="1090" y="500" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">puntuación del modelo →</text><rect x="850" y="225" width="480" height="50" rx="0" fill="none" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="6,4"/><rect x="850" y="345" width="480" height="50" rx="0" fill="none" stroke="#9b1b1e" stroke-width="2" stroke-dasharray="6,4"/><text x="1040" y="540" font-size="16" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">Solo pares del mismo paciente: aquí se ve que el modelo</text><text x="1040" y="564" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">ordena regular dentro de cada uno → AUC dentro más baja</text><circle cx="500" cy="620" r="10" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="518" y="626" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">preictal</text><circle cx="640" cy="620" r="10" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="658" y="626" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal</text><rect x="40" y="650" width="1320" height="36" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><text x="700.0" y="674.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">Una app vigila siempre a la misma persona: lo que necesita es la nota de la derecha.</text></svg>