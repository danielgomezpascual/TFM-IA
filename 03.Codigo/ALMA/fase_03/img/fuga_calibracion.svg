<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="700" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">POR QUÉ SE CAMBIÓ LA CALIBRACIÓN</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">un paciente con interictales el lunes (valen 10) y el jueves (valen 14); la crisis es el lunes (sus preictales valen 10)</text><rect x="40" y="110" width="640" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="144" width="640" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="56" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">ANTES: LA REFERENCIA DEPENDÍA DE LA ETIQUETA</text><rect x="40" y="160" width="640" height="370" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="60" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">ventana</text><text x="230" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">valor</text><text x="340" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">se compara con</text><text x="570" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">resultado</text><line x1="60" y1="212" x2="660" y2="212" stroke="#8a8a8a" stroke-width="1"/><circle cx="68" cy="250" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="86" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal lunes</text><text x="230" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">10</text><text x="340" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">las del jueves (14)</text><text x="570" y="255" font-size="22" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">−4</text><circle cx="68" cy="305" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="86" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal jueves</text><text x="230" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">14</text><text x="340" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">las del lunes (10)</text><text x="570" y="310" font-size="22" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">+4</text><circle cx="68" cy="360" r="8" fill="#9b1b1e"/><text x="86" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">preictal lunes</text><text x="230" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">10</text><text x="340" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">todas (12)</text><text x="570" y="365" font-size="22" text-anchor="start" fill="#9b1b1e" font-weight="bold" font-style="normal">−2</text><text x="60" y="445" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">Las preictales y las interictales del lunes valen lo mismo (10),</text><text x="60" y="469" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">pero salen distintas: −4 frente a −2. Esa diferencia la crea</text><text x="60" y="493" font-size="15" text-anchor="start" fill="#9b1b1e" font-weight="normal" font-style="italic">la normalización, y el modelo la puede aprender sin saber nada de crisis.</text><rect x="720" y="110" width="640" height="34" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="720" y="144" width="640" height="4" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="736" y="133" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">AHORA: UNA SOLA REFERENCIA (LA RESERVA)</text><rect x="720" y="160" width="640" height="370" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="740" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">ventana</text><text x="910" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">valor</text><text x="1020" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">se compara con</text><text x="1250" y="200" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="bold" font-style="normal">resultado</text><line x1="740" y1="212" x2="1340" y2="212" stroke="#8a8a8a" stroke-width="1"/><circle cx="748" cy="250" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="766" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal lunes</text><text x="910" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">10</text><text x="1020" y="255" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">la reserva (10)</text><text x="1250" y="255" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">0</text><circle cx="748" cy="305" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="766" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">interictal jueves</text><text x="910" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">14</text><text x="1020" y="310" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">la reserva (10)</text><text x="1250" y="310" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">+4</text><circle cx="748" cy="360" r="8" fill="#9b1b1e"/><text x="766" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">preictal lunes</text><text x="910" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">10</text><text x="1020" y="365" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">la reserva (10)</text><text x="1250" y="365" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">0</text><text x="740" y="445" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">Las del lunes salen iguales (0): no se inventa ninguna diferencia.</text><text x="740" y="469" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">La del jueves sí cambia, pero es una diferencia real entre días:</text><text x="740" y="493" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="italic">la vigila el control de sesión (§10).</text><line x1="688" y1="330" x2="712" y2="330" stroke="#9b1b1e" stroke-width="3" marker-end="url(#fR)"/><circle cx="560" cy="560" r="8" fill="#9b1b1e"/><text x="576" y="565" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana preictal</text><circle cx="760" cy="560" r="8" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="776" y="565" font-size="14" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ventana interictal</text><rect x="40" y="586" width="1320" height="84" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="60" y="615" font-size="16" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Dos fallos de la versión antigua: crea diferencias falsas entre preictales e interictales,</text><text x="60" y="640" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">y para elegir con qué se compara cada ventana hay que saber su etiqueta (una app no la sabe). En §9 se mide cuánto inflaba la nota.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>