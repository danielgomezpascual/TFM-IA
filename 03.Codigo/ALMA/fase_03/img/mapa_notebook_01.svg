<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">EL RECORRIDO DEL NOTEBOOK F03.01</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >seis pasos para que la red reciba los datos listos para aprender</text><rect x="60" y="120" width="380" height="160" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="104" cy="168" r="26" fill="#141414"/><text x="104" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >1</text><text x="148" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Repartir</text><text x="148" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§3</text><text x="88" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >¿qué ventanas son para estudiar</text><text x="88" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >y cuáles para el examen?</text><line x1="442" y1="200" x2="508" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="120" width="380" height="160" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="168" r="26" fill="#141414"/><text x="554" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >2</text><text x="598" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Empaquetar</text><text x="598" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§4</text><text x="538" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >leer la señal del disco</text><text x="538" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >una sola vez y guardarla junta</text><line x1="892" y1="200" x2="958" y2="200" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="120" width="380" height="160" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="1004" cy="168" r="26" fill="#141414"/><text x="1004" y="175" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >3</text><text x="1048" y="164" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Comprobar</text><text x="1048" y="188" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§5</text><text x="988" y="228" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >¿lo empaquetado es idéntico</text><text x="988" y="252" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >a la señal original?</text><rect x="60" y="330" width="380" height="160" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="104" cy="378" r="26" fill="#141414"/><text x="104" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >4</text><text x="148" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Normalizar</text><text x="148" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§6</text><text x="88" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >poner todas las ventanas</text><text x="88" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >en la misma escala</text><line x1="442" y1="410" x2="508" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="510" y="330" width="380" height="160" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="554" cy="378" r="26" fill="#141414"/><text x="554" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >5</text><text x="598" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Reflejar</text><text x="598" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§7</text><text x="538" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >crear ejemplos nuevos creíbles:</text><text x="538" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >izquierda ↔ derecha</text><line x1="892" y1="410" x2="958" y2="410" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="960" y="330" width="380" height="160" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="1004" cy="378" r="26" fill="#141414"/><text x="1004" y="385" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >6</text><text x="1048" y="374" font-size="22" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >Servir lotes</text><text x="1048" y="398" font-size="15" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-style="italic" >§8</text><text x="988" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >entregar a la red</text><text x="988" y="462" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >64 ventanas cada vez</text><path d="M1270,280 L1270,300 L250,300 L250,328" fill="none" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="60" y="560" width="1280" height="44" fill="#141414"/><rect x="60" y="604" width="1280" height="4" fill="#9b1b1e"/><text x="700" y="589" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal" >RESULTADO: la red (F03.02) solo tendrá que pedir lotes. Aquí todavía no se entrena nada.</text></svg>