<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">COMPARAR DOS MODELOS DE FORMA EMPAREJADA</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">por qué Evaluador.diferencia(A, B) da un intervalo mucho más estrecho que comparar dos intervalos sueltos</text><rect x="60" y="110" width="600" height="56" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="60" y="162" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="360.0" y="142.65" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">Dos intervalos sueltos</text><rect x="740" y="110" width="600" height="56" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="740" y="162" width="600" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="1040.0" y="142.65" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">La diferencia emparejada</text><line x1="140" y1="340" x2="620" y2="340" stroke="#8a8a8a" stroke-width="1.5"/><text x="160" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">0,60</text><text x="280" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">0,65</text><text x="400" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">0,70</text><text x="520" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">0,75</text><line x1="250" y1="230" x2="470" y2="230" stroke="#141414" stroke-width="4"/><line x1="250" y1="220" x2="250" y2="240" stroke="#141414" stroke-width="3"/><line x1="470" y1="220" x2="470" y2="240" stroke="#141414" stroke-width="3"/><circle cx="360" cy="230" r="8" fill="#141414" stroke="none" stroke-width="0"/><text x="236" y="236" font-size="17" text-anchor="end" fill="#141414" font-weight="bold" font-style="normal">A</text><line x1="220" y1="290" x2="440" y2="290" stroke="#8a8a8a" stroke-width="4"/><line x1="220" y1="280" x2="220" y2="300" stroke="#8a8a8a" stroke-width="3"/><line x1="440" y1="280" x2="440" y2="300" stroke="#8a8a8a" stroke-width="3"/><circle cx="330" cy="290" r="8" fill="#8a8a8a" stroke="none" stroke-width="0"/><text x="206" y="296" font-size="17" text-anchor="end" fill="#8a8a8a" font-weight="bold" font-style="normal">B</text><text x="360" y="410" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">se solapan casi enteros:</text><text x="360" y="434" font-size="17" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">&quot;no se puede decir cuál es mejor&quot;</text><text x="760" y="210" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">En cada sorteo de pacientes se calculan</text><text x="760" y="235" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">LAS DOS notas con los mismos pacientes y se</text><text x="760" y="260" font-size="17" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">resta. La suerte del sorteo afecta igual a A y B.</text><line x1="820" y1="340" x2="1300" y2="340" stroke="#8a8a8a" stroke-width="1.5"/><text x="860" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">-0,02</text><text x="980" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">0,00</text><text x="1100" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">+0,02</text><text x="1220" y="365" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="normal">+0,04</text><line x1="980" y1="300" x2="980" y2="345" stroke="#141414" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="1010" y1="310" x2="1130" y2="310" stroke="#9b1b1e" stroke-width="4"/><line x1="1010" y1="300" x2="1010" y2="320" stroke="#9b1b1e" stroke-width="3"/><line x1="1130" y1="300" x2="1130" y2="320" stroke="#9b1b1e" stroke-width="3"/><circle cx="1070" cy="310" r="8" fill="#9b1b1e" stroke="none" stroke-width="0"/><text x="996" y="316" font-size="17" text-anchor="end" fill="#9b1b1e" font-weight="bold" font-style="normal"></text><text x="1070" y="290" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal">A − B</text><text x="1040" y="410" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="normal">el intervalo NO incluye el 0:</text><text x="1040" y="434" font-size="17" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="normal">&quot;mejora real&quot;</text><rect x="60" y="470" width="1280" height="70" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2" stroke-dasharray="7 5"/><text x="80" y="512" font-size="17" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" font-style="normal" fill="#9b1b1e">lectura_diferencia: </tspan><tspan font-weight="normal" font-style="normal" fill="#141414">por encima de 0 → mejora real · por debajo → empeora · incluye el 0 → sin diferencia clara.</tspan></text><rect x="40" y="565" width="1320" height="44" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="605" width="1320" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="593.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">El Evaluador fija las ventanas, los pacientes y los sorteos una vez: todos los modelos se miden igual.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>