<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">DEL ÍNDICE AL LOTE QUE ENTRA EN LA RED</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >la señal se lee del disco una sola vez; la normalización se hace en cada lote, como en la demo</text><rect x="40" y="104" width="1320" height="34" fill="#141414"/><rect x="40" y="138" width="1320" height="4" fill="#9b1b1e"/><text x="56" y="127" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">UNA SOLA VEZ · ESTE NOTEBOOK (F03.01)</text><rect x="40" y="168" width="400" height="190" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="58" y="202" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >1 · Índice de ventanas</text><text x="58" y="232" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >conjuntos/general.csv (F02.04) + controles (F02.05)</text><text x="58" y="258" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >una fila por ventana: dónde está su señal</text><text x="58" y="280" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >(qué fichero y en qué muestra empieza),</text><text x="58" y="302" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >de qué paciente es y si es preictal</text><rect x="500" y="168" width="400" height="190" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="518" y="202" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >2 · Vistas</text><text x="518" y="232" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >prediccion/vistas.py</text><text x="518" y="258" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >qué ventanas son para estudiar,</text><text x="518" y="280" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >cuáles para el examen de prueba</text><text x="518" y="302" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >y cuáles para el examen final</text><rect x="960" y="168" width="400" height="190" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="978" y="202" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >3 · Un paquete por partición</text><text x="978" y="232" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >paquetes/general/train.npy …</text><text x="978" y="258" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >todas las ventanas juntas en un fichero</text><text x="978" y="280" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >(ventanas × 22 canales × 1.024 muestras)</text><text x="978" y="302" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >en µV, tal cual, sin normalizar</text><line x1="440" y1="263" x2="498" y2="263" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="900" y1="263" x2="958" y2="263" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><path d="M1160,358 L1160,398 L240,398 L240,466" fill="none" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)"/><text x="700" y="390" font-size="15" text-anchor="middle" fill="#9b1b1e" font-weight="normal" font-style="italic" >mmap: se abre sin cargarlo entero en memoria</text><rect x="40" y="438" width="1320" height="34" fill="#141414"/><rect x="40" y="472" width="1320" height="4" fill="#9b1b1e"/><text x="56" y="461" font-size="17" text-anchor="start" fill="#ffffff" font-weight="bold" font-style="normal" letter-spacing="1.5">EN CADA ÉPOCA · AL VUELO (red/datos.py)</text><rect x="40" y="502" width="400" height="200" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="58" y="536" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >4 · Dataset</text><text x="58" y="566" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >VentanasEEG</text><text x="58" y="592" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >cuando se le pide la ventana n.º i,</text><text x="58" y="614" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >la saca del paquete con su respuesta:</text><text x="58" y="636" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >1 = preictal · 0 = interictal</text><rect x="500" y="502" width="400" height="200" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="518" y="536" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >5 · Preparar el lote</text><text x="518" y="566" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >PrepararLote</text><text x="518" y="592" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >junta 64 ventanas y, a la vez:</text><text x="518" y="614" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >a) las pone todas en la misma escala</text><text x="518" y="636" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >b) recorta los picos exagerados</text><text x="518" y="658" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >c) refleja izq. ↔ der. (solo al estudiar)</text><rect x="960" y="502" width="400" height="200" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="978" y="536" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" >6 · A la red</text><text x="978" y="566" font-size="14" text-anchor="start" fill="#555" font-weight="normal" font-style="normal" font-family="monospace" >DataLoader</text><text x="978" y="592" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >64 ventanas listas + sus 64 respuestas</text><text x="978" y="614" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >en orden distinto en cada vuelta,</text><text x="978" y="636" font-size="15" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal" >pero repetible (semilla)</text><line x1="440" y1="602" x2="498" y2="602" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="900" y1="602" x2="958" y2="602" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="1277" y="266" width="70" height="40" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="1268" y="275" width="70" height="40" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="1259" y="284" width="70" height="40" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="1250" y="293" width="70" height="40" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><polyline points="1256.0,313.0 1257.5,318.0 1258.9,321.8 1260.3,323.5 1261.8,322.8 1263.2,320.0 1264.7,315.9 1266.2,311.6 1267.6,308.0 1269.0,306.0 1270.5,305.8 1272.0,307.1 1273.4,309.5 1274.8,312.2 1276.3,314.5 1277.8,316.0 1279.2,316.5 1280.7,316.2 1282.1,315.3 1283.5,314.2 1285.0,313.0 1286.5,312.0 1287.9,311.2 1289.3,310.8 1290.8,310.7 1292.2,311.2 1293.7,312.1 1295.2,313.5 1296.6,315.2 1298.0,316.8 1299.5,317.8 1301.0,317.8 1302.4,316.5 1303.8,314.0 1305.3,310.8 1306.8,307.5 1308.2,305.0 1309.7,304.1 1311.1,305.3 1312.5,308.5 1314.0,313.0" fill="none" stroke="#9b1b1e" stroke-width="1.6"/><rect x="1268" y="632" width="70" height="34" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="1259" y="641" width="70" height="34" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><rect x="1250" y="650" width="70" height="34" fill="#ffffff" stroke="#141414" stroke-width="1.5"/><polyline points="1256.0,667.0 1257.5,672.0 1258.9,675.8 1260.3,677.5 1261.8,676.8 1263.2,674.0 1264.7,669.9 1266.2,665.6 1267.6,662.0 1269.0,660.0 1270.5,659.8 1272.0,661.1 1273.4,663.5 1274.8,666.2 1276.3,668.5 1277.8,670.0 1279.2,670.5 1280.7,670.2 1282.1,669.3 1283.5,668.2 1285.0,667.0 1286.5,666.0 1287.9,665.2 1289.3,664.8 1290.8,664.7 1292.2,665.2 1293.7,666.1 1295.2,667.5 1296.6,669.2 1298.0,670.8 1299.5,671.8 1301.0,671.8 1302.4,670.5 1303.8,668.0 1305.3,664.8 1306.8,661.5 1308.2,659.0 1309.7,658.1 1311.1,659.3 1312.5,662.5 1314.0,667.0" fill="none" stroke="#9b1b1e" stroke-width="1.6"/><text x="700" y="740" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic" >Esquema, no a escala. Las cifras reales (ventanas, GB, lotes por segundo) salen al ejecutar el notebook.</text></svg>