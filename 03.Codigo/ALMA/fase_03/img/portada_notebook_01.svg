0" fill="#9b1b1e"/><rect x="40" y="250" width="320" height="126.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="295.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F02.02 · la señal</text><text x="60" y="321.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">ficheros .npy en µV,</text><text x="60" y="345.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">sin normalizar</text><rect x="40" y="390.0" width="320" height="126.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="435.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F02.04 · el conjunto</text><text x="60" y="461.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">cada ventana con su</text><text x="60" y="485.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">partición y su clase</text><rect x="40" y="530.0" width="320" height="126.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="575.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F02.05 · los controles</text><text x="60" y="601.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">el examen sin las</text><text x="60" y="625.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">pistas tramposas</text><rect x="1040" y="250" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="330.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Paquetes</text><text x="1060" y="356.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">train · dev · eval,</text><text x="1060" y="380.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">comprobados</text><rect x="1040" y="460.0" width="320" height="196.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="540.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">configuracion.json</text><text x="1060" y="566.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">para que F03.02-F03.08</text><text x="1060" y="590.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">lo repitan igual</text><rect x="420" y="250" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="285.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="292.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><text x="492" y="280" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Repartir las ventanas</text><text x="492" y="304" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">estudiar · simulacro (dev) · examen final (eval)</text><line x1="456" y1="306.0" x2="456" y2="333" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="420" y="334" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="369.0" r="20" fill="#141414" stroke="#141414" stroke-width="2"/><text x="456" y="376.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><text x="492" y="364" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Empaquetarlas</text><text x="492" y="388" font-size="15" text-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">un fichero grande por partición, rápido de leer</text><line x1="456" y1="390.0" x2="456" y2="417" 