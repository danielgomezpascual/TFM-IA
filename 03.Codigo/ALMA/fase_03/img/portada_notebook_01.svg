ext-anchor="start" fill="#3a3a3a" font-weight="normal" font-style="italic">grupos de 64 ventanas, siempre igual</text><line x1="366" y1="453.0" x2="412" y2="453.0" stroke="#141414" stroke-width="2.5" marker-end="url(#fN)"/><line x1="988" y1="453.0" x2="1032" y2="453.0" stroke="#141414" stroke-width="2.5" marker-end="url(#fN)"/><rect x="40" y="696" width="1320" height="64" rx="0" fill="#141414"/><rect x="40" y="756" width="1320" height="4" rx="0" fill="#9b1b1e"/><text x="700" y="735" font-size="19" text-anchor="middle" xml:space="preserve"><tspan fill="#e6a3a5" font-weight="bold" font-style="normal">IDEA CLAVE: </tspan><tspan fill="#ffffff" font-weight="normal" font-style="normal">aquí no se entrena nada; es la cocina. Si los datos llegan mal, da igual lo buena que sea la red.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>