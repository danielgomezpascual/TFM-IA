iddle" fill="#141414" font-weight="normal" font-style="normal">si se cortó, se lee</text><line x1="302" y1="385" x2="333" y2="385" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="335" y="290" width="215" height="190" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.6"/><text x="442" y="335" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">crear la red</text><text x="442" y="380" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">fijar la semilla;</text><text x="442" y="402" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">preparar_red (F03.07)</text><line x1="552" y1="385" x2="583" y2="385" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="585" y="290" width="215" height="190" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="1.6"/><text x="692" y="335" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">entrenar_red</text><text x="692" y="380" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">con punto de control:</text><text x="692" y="402" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">sigue si se corta</text><line x1="802" y1="385" x2="833" y2="385" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="835" y="290" width="215" height="190" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.6"/><text x="942" y="335" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">puntuar</text><text x="942" y="380" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">probabilidad de</text><text x="942" y="402" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">preictal en validación</text><line x1="1052" y1="385" x2="1083" y2="385" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><rect x="1085" y="290" width="215" height="190" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.6"/><text x="1192" y="335" font-size="19" text-anchor="middle" fill="#141414" font-weight="bold" font-style="normal">guardar</text><text x="1192" y="380" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">el modelo (.pt) y</text><text x="1192" y="402" font-size="15" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">el entrenamiento suelto</text><line x1="700" y1="512" x2="700" y2="555" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="380" y="560" width="640" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="380" y="620" width="640" height="4" rx="0" fill="#9b1b1e" stroke="#9b1b1e" stroke-width="0"/><text x="700.0" y="589.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">ResultadoVariante</text><text x="700.0" y="612.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="normal" font-style="normal">huella · puntuaciones (semillas × filas) · historial · estado · minutos</text><text x="700.0" y="670" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">Después, el notebook mide (Evaluador), compara y apunta el experimento con registro.guardar().</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>