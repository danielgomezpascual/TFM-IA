<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="500" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">QUÉ ES EL LEAD-IN</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">tiempo sin crisis antes de cada crisis, dentro de su mismo fichero (valores de ejemplo)</text><text x="60" y="222" font-size="16" text-anchor="start" fill="#141414" font-weight="bold">Fichero</text><text x="60" y="242" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">20 min</text><rect x="120" y="190" width="1180" height="50" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><rect x="474.0" y="190" width="59.0" height="50" rx="0" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="503.5" y="220.8" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">⚡ A</text><rect x="651.0" y="190" width="59.0" height="50" rx="0" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="680.5" y="220.8" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">⚡ B</text><line x1="120.0" y1="252" x2="120.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="120.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">0</text><line x1="238.0" y1="252" x2="238.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="238.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">2</text><line x1="356.0" y1="252" x2="356.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="356.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">4</text><line x1="474.0" y1="252" x2="474.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="474.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">6</text><line x1="592.0" y1="252" x2="592.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="592.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">8</text><line x1="710.0" y1="252" x2="710.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="710.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">10</text><line x1="828.0" y1="252" x2="828.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="828.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">12</text><line x1="946.0" y1="252" x2="946.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="946.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">14</text><line x1="1064.0" y1="252" x2="1064.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="1064.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">16</text><line x1="1182.0" y1="252" x2="1182.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="1182.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">18</text><line x1="1300.0" y1="252" x2="1300.0" y2="260" stroke="#8a8a8a" stroke-width="1"/><text x="1300.0" y="280" font-size="14" text-anchor="middle" fill="#8a8a8a">20</text><text x="710.0" y="306" font-size="15" text-anchor="middle" fill="#8a8a8a" font-style="italic">minuto del fichero</text><line x1="120" y1="168" x2="474.0" y2="168" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)" marker-start="url(#fN)"/><text x="297.0" y="160" font-size="14" text-anchor="middle" fill="#141414" font-style="italic"></text><text x="297.0" y="156" font-size="16" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#141414">lead-in de A: 6 min </tspan><tspan font-weight="bold" fill="#141414">✓</tspan></text><text x="297.0" y="132" font-size="14" text-anchor="middle" fill="#444444" font-style="italic">primera crisis: desde el inicio del fichero</text><line x1="533.0" y1="168" x2="651.0" y2="168" stroke="#9b1b1e" stroke-width="1.5" marker-end="url(#fR)" marker-start="url(#fR)"/><text x="592.0" y="160" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic"></text><text x="592.0" y="156" font-size="16" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#9b1b1e">lead-in de B: 2 min ✗</tspan></text><text x="592.0" y="132" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">desde el final de A</text><rect x="40" y="345" width="640" height="125" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="62" y="379" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Con un umbral de 4 min:</text><text x="62" y="409" font-size="15.5" text-anchor="start" fill="#141414">· A sirve para predicción: hay 6 min de señal limpia antes.</text><text x="62" y="439" font-size="15.5" text-anchor="start" fill="#9b1b1e">· B no: solo hay 2 min, y justo después de otra crisis.</text><rect x="720" y="345" width="640" height="125" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="742" y="377" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Lead-in ≠ ventana preictal</text><text x="742" y="407" font-size="15.5" text-anchor="start" fill="#141414">El lead-in lo da el fichero; la ventana preictal la</text><text x="742" y="437" font-size="15.5" text-anchor="start" fill="#141414">elegimos nosotros y tiene que caber dentro (preictal + SPH).</text></svg>