<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="722" viewBox="0 0 1400 722" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><rect width="1400" height="722" fill="#ffffff"/><text x="700" y="50" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">F01.03 · LANZADOR DE VISUALIZACIONES</text><text x="700" y="80" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">un notebook, una ejecución por tipo de crisis</text><rect x="40" y="108" width="1320" height="76" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="134" font-size="13" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="2">LA PREGUNTA DE ESTE NOTEBOOK</text><text x="700" y="168" font-size="24" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿Cómo se ve una crisis de cada tipo sin mantener siete copias?</text><text x="40" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE ENTRA</text><rect x="40" y="235" width="320" height="3" fill="#9b1b1e"/><text x="420" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE HACE</text><rect x="420" y="235" width="560" height="3" fill="#9b1b1e"/><text x="1040" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE SALE</text><rect x="1040" y="235" width="320" height="3" fill="#9b1b1e"/><rect x="40" y="250.0" width="320" height="154.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="310.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F01.03v</text><text x="60" y="336.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">el notebook, con su</text><text x="60" y="360.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">celda de parámetros</text><rect x="40" y="418.0" width="320" height="154.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="490.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">tipos_crisis.py</text><text x="60" y="516.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">los tipos que tienen ficha</text><rect x="1040" y="250.0" width="320" height="154.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="310.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Una copia por tipo</text><text x="1060" y="336.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">el F01.03v ejecutado</text><text x="1060" y="360.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">y sus figuras</text><rect x="1040" y="418.0" width="320" height="154.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="490.0" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">La galería</text><text x="1060" y="516.0" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">galeria_espectrogramas.png</text><rect x="420" y="250" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="285.0" r="20" fill="#141414"/><text x="456" y="292.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><line x1="456" y1="305.0" x2="456" y2="333" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="280.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Elegir los tipos</text><text x="492" y="304.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">los que tienen ficha, ordenados por grupo de inicio</text><rect x="420" y="334" width="560" height="70" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="456" cy="369.0" r="20" fill="#141414"/><text x="456" y="376.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><line x1="456" y1="389.0" x2="456" y2="417" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="364.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Ejecutar con papermill</text><text x="492" y="388.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">el F01.03v una vez por tipo</text><rect x="420" y="418" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="453.0" r="20" fill="#141414"/><text x="456" y="460.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><line x1="456" y1="473.0" x2="456" y2="501" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="448.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Resumen</text><text x="492" y="472.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">qué tipos terminaron bien y cuántas figuras dieron</text><rect x="420" y="502" width="560" height="70" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="537.0" r="20" fill="#141414"/><text x="456" y="544.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><text x="492" y="532.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Galería</text><text x="492" y="556.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">un espectrograma de cada tipo en una imagen</text><line x1="366" y1="411.0" x2="412" y2="411.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="988" y1="411.0" x2="1034" y2="411.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="40" y="612" width="1320" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="672" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="651" font-size="19" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#e8a0a2">IDEA CLAVE: </tspan><tspan fill="#ffffff">si cambia el F01.03v, se relanza esto y se regenera todo.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>