<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="560" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">DEL EDF REFERENCIAL AL MONTAJE TCP</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">cada canal TCP es la resta de dos electrodos vecinos: la referencia se cancela</text><rect x="40" y="110" width="560" height="290" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="110" width="560" height="40" rx="0" fill="#141414"/><rect x="40" y="150" width="560" height="4" rx="0" fill="#9b1b1e"/><text x="54" y="137.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">En el EDF: cada electrodo contra la referencia</text><text x="62" y="190" font-size="18" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">FP1 − ref</text><text x="62" y="232" font-size="18" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">F7 − ref</text><text x="62" y="274" font-size="18" text-anchor="start" fill="#141414" font-family="'DejaVu Sans Mono', Consolas, monospace">T3 − ref   …</text><text x="62" y="330" font-size="15" text-anchor="start" fill="#444444" font-style="italic">ref = orejas (-LE) o media de todos (-REF):</text><text x="62" y="356" font-size="15" text-anchor="start" fill="#9b1b1e" font-style="italic">cambia de un equipo a otro</text><line x1="604" y1="255" x2="676" y2="255" stroke="#9b1b1e" stroke-width="3" marker-end="url(#fR)"/><rect x="680" y="110" width="680" height="290" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><rect x="680" y="110" width="680" height="40" rx="0" fill="#9b1b1e"/><rect x="680" y="150" width="680" height="4" rx="0" fill="#9b1b1e"/><text x="694" y="137.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">En TCP: resta de vecinos</text><text x="704" y="200" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">(FP1 − ref) − (F7 − ref) = </tspan><tspan font-weight="bold" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#9b1b1e">FP1 − F7</tspan></text><text x="704" y="255" font-size="15.5" text-anchor="start" fill="#141414">· Da igual la referencia: 01_tcp_ar y 02_tcp_le</text><text x="704" y="284" font-size="15.5" text-anchor="start" fill="#141414">  acaban con los mismos 22 canales.</text><text x="704" y="313" font-size="15.5" text-anchor="start" fill="#141414">· Es el montaje en el que TUSZ anota las crisis</text><text x="704" y="342" font-size="15.5" text-anchor="start" fill="#141414">  (el .csv va canal a canal en TCP).</text><text x="40" y="438" font-size="17" text-anchor="start" fill="#141414" font-weight="bold">22 canales = 5 cadenas de vecinos</text><text x="40" y="474" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#141414">temporal izq.: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">FP1-F7 · F7-T3 · T3-T5 · T5-O1</tspan></text><text x="490" y="474" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#141414">parasagital izq.: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">FP1-F3 · F3-C3 · C3-P3 · P3-O1</tspan></text><text x="940" y="474" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#9b1b1e">central: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">A1-T3 · T3-C3 · C3-CZ · CZ-C4 · C4-T4 · T4-A2</tspan></text><text x="40" y="508" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#141414">parasagital dcha.: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">FP2-F4 · F4-C4 · C4-P4 · P4-O2</tspan></text><text x="490" y="508" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#141414">temporal dcha.: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#141414">FP2-F8 · F8-T4 · T4-T6 · T6-O2</tspan></text></svg>