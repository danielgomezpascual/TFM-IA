<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="545" viewBox="0 0 1400 545" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="545" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">CÓMO SE ELIGE EL UMBRAL DE LEAD-IN</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">subirlo da preictal más largo y limpio; bajarlo deja más crisis y pacientes (esquema)</text><rect x="140" y="140" width="1120" height="26" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1"/><rect x="192" y="132" width="16" height="42" rx="0" fill="#141414"/><text x="200" y="200" font-size="15" text-anchor="middle" fill="#141414">2 min</text><rect x="392" y="132" width="16" height="42" rx="0" fill="#9b1b1e"/><text x="400" y="200" font-size="16" text-anchor="middle" fill="#9b1b1e" font-weight="bold">4 min</text><rect x="692" y="132" width="16" height="42" rx="0" fill="#141414"/><text x="700" y="200" font-size="15" text-anchor="middle" fill="#141414">10 min</text><rect x="892" y="132" width="16" height="42" rx="0" fill="#141414"/><text x="900" y="200" font-size="15" text-anchor="middle" fill="#141414">15 min</text><rect x="1212" y="132" width="16" height="42" rx="0" fill="#141414"/><text x="1220" y="200" font-size="15" text-anchor="middle" fill="#141414">30 min</text><text x="400" y="222" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">umbral del TFM</text><text x="1220" y="222" font-size="14" text-anchor="middle" fill="#8a8a8a" font-style="italic">imposible: ficheros de ≤ 30 min</text><line x1="690" y1="112" x2="150" y2="112" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><text x="160" y="100" font-size="15" text-anchor="start" fill="#141414" font-weight="bold">más crisis y más pacientes</text><line x1="710" y1="112" x2="1250" y2="112" stroke="#9b1b1e" stroke-width="2.2" marker-end="url(#fR)"/><text x="1240" y="100" font-size="15" text-anchor="end" fill="#9b1b1e" font-weight="bold">más señal preictal por crisis, y más limpia</text><rect x="40" y="260" width="420" height="165" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="40" y="260" width="420" height="40" rx="0" fill="#141414"/><rect x="40" y="300" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="54" y="287.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">1 · Cuánto dura un fichero</text><text x="60" y="342" font-size="15.5" text-anchor="start" fill="#141414">Como mucho 30 min; la mediana, 10 min.</text><text x="60" y="372" font-size="15.5" text-anchor="start" fill="#141414">El lead-in de 30-60 min de la literatura</text><text x="60" y="402" font-size="15.5" text-anchor="start" fill="#141414">(CHB-MIT, registros de días) no cabe.</text><rect x="490" y="260" width="420" height="165" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="490" y="260" width="420" height="40" rx="0" fill="#141414"/><rect x="490" y="300" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="504" y="287.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">2 · Cada cuánto llegan</text><text x="510" y="342" font-size="15.5" text-anchor="start" fill="#141414">Muchas crisis van en racimos: justo</text><text x="510" y="372" font-size="15.5" text-anchor="start" fill="#141414">después de una crisis la señal no es</text><text x="510" y="402" font-size="15.5" text-anchor="start" fill="#141414">&quot;normal&quot;. El umbral las deja fuera.</text><rect x="940" y="260" width="420" height="165" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><rect x="940" y="260" width="420" height="40" rx="0" fill="#9b1b1e"/><rect x="940" y="300" width="420" height="4" rx="0" fill="#9b1b1e"/><text x="954" y="287.2" font-size="17.5" text-anchor="start" fill="#ffffff" font-weight="bold">3 · Pacientes en eval</text><text x="960" y="342" font-size="15.5" text-anchor="start" fill="#141414">Lo que manda: con pocos pacientes</text><text x="960" y="372" font-size="15.5" text-anchor="start" fill="#141414">en 🟡 dev y 🟢 eval la nota no</text><text x="960" y="402" font-size="15.5" text-anchor="start" fill="#141414">generaliza. Se exigen al menos 20.</text><rect x="40" y="448" width="1320" height="70" rx="0" fill="#f5e6e6" stroke="#9b1b1e" stroke-width="2"/><text x="62" y="480" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">4 min = 3 min de preictal + 1 min de SPH: </text><text x="62" y="510" font-size="15.5" text-anchor="start" fill="#141414">el que más señal preictal da en 🔵 train dejando ≥ 20 pacientes en 🟡 dev y 🟢 eval (análisis en fase_02/01, §4.3).</text></svg>