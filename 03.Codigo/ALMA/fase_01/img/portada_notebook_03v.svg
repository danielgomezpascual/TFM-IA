<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><rect width="1400" height="812" fill="#ffffff"/><text x="700" y="50" font-size="30" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal" letter-spacing="2">F01.03v · VISUALIZACIÓN DE UNA CRISIS</text><text x="700" y="80" font-size="17" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-style="italic">la primera vez que se abre la señal EEG</text><rect x="40" y="108" width="1320" height="76" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><text x="700" y="134" font-size="13" text-anchor="middle" fill="#9b1b1e" font-weight="bold" font-style="normal" letter-spacing="2">LA PREGUNTA DE ESTE NOTEBOOK</text><text x="700" y="168" font-size="24" text-anchor="middle" fill="#141414" font-weight="normal" font-style="normal">¿Cómo se ve una crisis real en el EEG?</text><text x="40" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE ENTRA</text><rect x="40" y="235" width="320" height="3" fill="#9b1b1e"/><text x="420" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE HACE</text><rect x="420" y="235" width="560" height="3" fill="#9b1b1e"/><text x="1040" y="225" font-size="15" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal" letter-spacing="2">LO QUE SALE</text><rect x="1040" y="235" width="320" height="3" fill="#9b1b1e"/><rect x="40" y="250.0" width="320" height="199.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="344.5" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">F01.01 · crisis.csv</text><text x="60" y="370.5" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">para elegir la crisis</text><rect x="40" y="463.0" width="320" height="199.0" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="2"/><text x="60" y="545.5" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Un EDF de train</text><text x="60" y="571.5" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">el de más lead-in útil</text><text x="60" y="595.5" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">del tipo elegido</text><rect x="1040" y="250.0" width="320" height="199.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="344.5" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Unas 22 figuras</text><text x="1060" y="370.5" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">por tipo de crisis</text><rect x="1040" y="463.0" width="320" height="199.0" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="1060" y="557.5" font-size="18" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">crisis_ejemplo.csv</text><text x="1060" y="583.5" font-size="16" text-anchor="start" fill="#141414" font-weight="normal" font-style="normal">y configuracion.json</text><rect x="420" y="250" width="560" height="62" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="281.0" r="20" fill="#141414"/><text x="456" y="288.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text><line x1="456" y1="301.0" x2="456" y2="319" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="276.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Elegir y leer el EDF</text><text x="492" y="300.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">MNE, canales y referencias</text><rect x="420" y="320" width="560" height="62" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="351.0" r="20" fill="#141414"/><text x="456" y="358.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text><line x1="456" y1="371.0" x2="456" y2="389" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="346.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Situar las crisis</text><text x="492" y="370.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">anotaciones .csv y .csv_bi</text><rect x="420" y="390" width="560" height="62" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="421.0" r="20" fill="#141414"/><text x="456" y="428.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text><line x1="456" y1="441.0" x2="456" y2="459" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="416.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Montaje TCP</text><text x="492" y="440.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">22 canales bipolares, igual en todos los EDF</text><rect x="420" y="460" width="560" height="62" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="491.0" r="20" fill="#141414"/><text x="456" y="498.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text><line x1="456" y1="511.0" x2="456" y2="529" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="486.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Filtrar y mirar</text><text x="492" y="510.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">la señal, su espectro y sus bandas</text><rect x="420" y="530" width="560" height="62" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><circle cx="456" cy="561.0" r="20" fill="#141414"/><text x="456" y="568.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text><line x1="456" y1="581.0" x2="456" y2="599" stroke="#141414" stroke-width="2" marker-end="url(#fN)"/><text x="492" y="556.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">El cambio en el tiempo</text><text x="492" y="580.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">espectrograma antes y durante la crisis</text><rect x="420" y="600" width="560" height="62" rx="0" fill="#f7e8e8" stroke="#9b1b1e" stroke-width="2"/><circle cx="456" cy="631.0" r="20" fill="#141414"/><text x="456" y="638.0" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text><text x="492" y="626.0" font-size="19" text-anchor="start" fill="#141414" font-weight="bold" font-style="normal">Dónde se origina</text><text x="492" y="650.0" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="italic">canales que arrancan antes y cerebro 3D</text><line x1="366" y1="456.0" x2="412" y2="456.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><line x1="988" y1="456.0" x2="1034" y2="456.0" stroke="#141414" stroke-width="2.2" marker-end="url(#fN)"/><rect x="40" y="702" width="1320" height="64" rx="0" fill="#141414" stroke="#141414" stroke-width="0"/><rect x="40" y="762" width="1320" height="4" fill="#9b1b1e"/><text x="700" y="741" font-size="19" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold" fill="#e8a0a2">IDEA CLAVE: </tspan><tspan fill="#ffffff">la crisis se ve clarísima; el preictal, no: detectar es fácil, predecir es lo difícil.</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>