<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="fN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker>
<marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1b1e"/></marker>
<marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fafafa"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e2e2" stroke-width="3"/></pattern>
</defs><rect width="1400" height="470" fill="#ffffff"/><text x="700.0" y="46" font-size="30" text-anchor="middle" fill="#141414" letter-spacing="2">EL LEAD-IN SE MIDE SOLO DENTRO DEL FICHERO</text><text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#8a8a8a" font-style="italic">una sesión partida en tokens: no sabemos si van seguidos (esquema)</text><rect x="120" y="150" width="300" height="50" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><text x="270.0" y="180.4" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">fichero t000</text><rect x="520" y="150" width="340" height="50" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><text x="690.0" y="180.4" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">fichero t001</text><rect x="428" y="160" width="84" height="30" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="470.0" y="181.5" font-size="18" text-anchor="middle" fill="#8a8a8a" font-weight="bold">?</text><rect x="1000" y="150" width="300" height="50" rx="0" fill="#f2f2f2" stroke="#141414" stroke-width="1.2"/><text x="1150.0" y="180.4" font-size="15" text-anchor="middle" fill="#141414" font-weight="bold">fichero t003</text><rect x="868" y="160" width="124" height="30" rx="0" fill="url(#rayado)" stroke="#8a8a8a" stroke-width="1.2"/><text x="930.0" y="181.5" font-size="18" text-anchor="middle" fill="#8a8a8a" font-weight="bold">?</text><text x="930" y="232" font-size="14" text-anchor="middle" fill="#9b1b1e" font-style="italic">falta t002</text><rect x="760" y="150" width="40" height="50" rx="0" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="780.0" y="180.8" font-size="16" text-anchor="middle" fill="#ffffff">⚡</text><line x1="520" y1="132" x2="760" y2="132" stroke="#141414" stroke-width="1.5" marker-end="url(#fN)" marker-start="url(#fN)"/><text x="640.0" y="124" font-size="14.5" text-anchor="middle" fill="#141414" font-style="italic">lead-in medido: desde el inicio de t001</text><path d="M420,225 C500,260 680,260 760,225" stroke="#9b1b1e" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="590" y="278" font-size="14.5" text-anchor="middle" fill="#9b1b1e" font-style="italic">encadenar t000 + t001 ✗: inflaría el lead-in con una suposición</text><rect x="40" y="330" width="1320" height="110" rx="0" fill="#ffffff" stroke="#141414" stroke-width="2"/><text x="62" y="362" font-size="15.5" text-anchor="start" fill="#141414" font-weight="bold">Por qué no se encadenan tokens</text><text x="62" y="390" font-size="15.5" text-anchor="start" fill="#141414">· Las cabeceras están anonimizadas (todas empiezan el 1 de enero a las 00.00.00): no hay hora real.</text><text x="62" y="418" font-size="15.5" text-anchor="start" fill="#141414">· En 108 sesiones faltan tokens en la numeración. Dentro de un fichero, en cambio, la señal es continua seguro.</text></svg>